// EQUIPO IDEAL / EQUIPO GANADOR posters
// Figma 356:4068 (ideal) and 356:3821 (ganador) — one skeleton, two
// colourways. Both are fed by get_matchday_recap, which already returns
// `winning_team` (the ideal XI) and `winner_team` (the winning user's XI,
// with captain + bidón markers), so no extra round-trip.
//
// Player photos are deliberately not rendered — the art isn't wired up yet.
// ══════════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════════
// CAPTIONS (CAP_*)
// Al lado de cada póster, el texto para Instagram y para X, ya armado con los
// datos de la fecha. Editable y con botón de copiar.
//
// Las plantillas están calcadas de captions reales de Winning (fecha 7), no
// inventadas. Lo que sale de ahí:
//   - Título "11 IDEAL — FECHA N | CLAUSURA 2026", con la barra y el guion largo.
//   - SIN hashtags. Ninguno.
//   - Se le habla al público de USTEDES, y con signo de apertura:
//     "¿A ustedes cómo les fue?". (En las push escriben distinto, sin apertura;
//     en redes sí lo usan.)
//   - Prosa, no lista de bullets.
//   - Siempre hay una "figura de la fecha" con lo que hizo, y un dato de color
//     tipo "entró desde el banco".
//   - Al ganador se lo nombra sin arroba: "Con este equipo, Polze se lleva...".
//
// Lo que el texto NO trae y hay que poner a mano:
//   - El color narrativo ("dos bombazos desde afuera del área", "el Lobo en
//     Avellaneda"). Eso es criterio editorial, no un dato de la base.
//   - Lo que costaba el equipo en palos: fantasy.player_prices no es legible
//     con la anon key (401). Hace falta exponer una vista para automatizarlo.
//
// CAPTIONS ESCRITOS (captions.json). Desde la fecha 10 del Clausura 2026 el
// caption del 11 Ideal se escribe como editor (historias de la fecha leídas
// en los medios, figura con su racha, cierre con el análisis de puntajes) y
// se carga en captions.json con la clave "<torneo>-<temporada>-<fecha>",
// varias versiones por fecha. Si la fecha está ahí, la caja de Instagram
// muestra esas versiones (una caja por caption, editables y con Copiar) en
// vez del template de arriba. Si no está, sigue el template.
// ══════════════════════════════════════════════════════════════════════

const CAP_STORE = 'winning.recap.captions.v2';
const CAP_MAX_TWEET = 280;

let capEscritosCache = null;
async function capCargarEscritos() {
  if (capEscritosCache) return capEscritosCache;
  capEscritosCache = {};
  try {
    // En winning.com.ar un archivo que no existe devuelve la home con 200: por eso el try.
    const r = await fetch('captions.json?v=' + Date.now());
    capEscritosCache = JSON.parse(await r.text()) || {};
  } catch (e) { console.warn('captions.json no disponible', e); }
  return capEscritosCache;
}
/* Las versiones escritas del caption del 11 Ideal para esta fecha, o [] si no hay. */
function capEscritos(kind, matchday) {
  const fecha = (capEscritosCache || {})[currentComp + '-' + currentSeason + '-' + matchday];
  const lista = fecha && fecha[kind];
  if (!Array.isArray(lista) || !lista.length) return [];
  const v = fecha.v || 1;
  return lista.filter(c => c && c.texto).map((c, i) => ({
    titulo: c.titulo || ('Caption ' + (i + 1)),
    texto: c.texto,
    texto_corto: c.texto_corto || null,   // misma idea con menos palabras (botón "Corta")
    texto_x: c.texto_x || null,           // versión de 280 para X (pestaña "X" y "Publicar en X")
    red: 'ig' + (i + 1) + ':v' + v,   // con 'v' nueva se descarta lo editado a mano en el navegador
    opcion: kind === 'ideal' ? String(i + 1) : ('AB'.charAt(i) || String(i + 1)),
  }));
}

/* Las variantes de una caja: Completa, Corta (si hay) y X (si hay). */
function capVersiones(c) {
  const vs = [{ id: 'completa', label: 'Completa', texto: c.texto }];
  if (c.texto_corto) vs.push({ id: 'corta', label: 'Corta', texto: c.texto_corto });
  if (c.texto_x) vs.push({ id: 'x', label: 'X', texto: c.texto_x });
  return vs.length > 1 ? vs : null;
}

// ── Publicar en X desde acá ──
// La página no tiene las claves de X (es pública). Le pide a GitHub que corra
// la acción "Publicar en X" (.github/workflows/publicar-x.yml), que sí las
// tiene: arma la placa desde esta misma página y la publica con el texto de la
// pestaña "X" tal como quedó editado. Para pedírselo a GitHub hace falta un
// token personal de Luchi con permiso de Actions sobre el repo. Luchi lo pega
// una vez y queda guardado en su navegador (como los montos de premios y las
// ediciones de los captions), nunca en el código ni en el sitio.
const GH_REPO = 'luchi-dev/winning-recap';
const GH_TOKEN_STORE = 'winning.recap.github.token';
// Cada red tiene su acción en GitHub y su texto: X publica la pestaña "X"
// (280 caracteres); Instagram publica lo que está a la vista (Completa o Corta).
const CAP_REDES = {
  x:  { nombre: 'X',         workflow: 'publicar-x.yml',  boton: 'Publicar en X',  maximo: 280 },
  ig: { nombre: 'Instagram y Facebook', workflow: 'publicar-ig.yml', boton: 'Publicar en IG', maximo: 2200 },   // Facebook sólo si el repo tiene FB_PAGE_ID / FB_PAGE_TOKEN
};
function ghToken(pedir) {
  let t = '';
  try { t = localStorage.getItem(GH_TOKEN_STORE) || ''; } catch (e) { /* incógnito */ }
  if (!t && pedir) {
    t = (prompt('Para publicar desde acá hace falta tu token de GitHub (queda guardado sólo en este navegador).\n\nGitHub → Settings → Developer settings → Personal access tokens → Fine-grained → repo winning-recap, permiso Actions: Read and write.\n\nPegalo acá:') || '').trim();
    if (t) { try { localStorage.setItem(GH_TOKEN_STORE, t); } catch (e) { /* incógnito */ } }
  }
  return t;
}
function ghOlvidarToken() { try { localStorage.removeItem(GH_TOKEN_STORE); } catch (e) { /* nada */ } }
async function ghApi(ruta, opciones = {}) {
  const r = await fetch('https://api.github.com/repos/' + GH_REPO + ruta, {
    ...opciones,
    headers: { Authorization: 'Bearer ' + ghToken(true), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opciones.headers || {}) },
  });
  if (r.status === 401 || r.status === 403) { ghOlvidarToken(); throw new Error('GitHub no aceptó el token (' + r.status + '). Volvé a intentar y pegá uno nuevo.'); }
  if (!r.ok && r.status !== 204) throw new Error('GitHub respondió ' + r.status);
  return r.status === 204 ? null : r.json();
}
// ── Publicación automática ──
// Qué sale solo y en qué red, en cada momento del posteo (lo ejecuta el
// vigilante en GitHub: tools/publicar-auto.js). El panel muestra lo que dice
// publicar.json en el sitio y, al guardar, le pide a GitHub que lo reescriba
// (acción "Configurar publicación automática"). Cambia recién en la corrida
// siguiente del vigilante.
const AUTO_MOMENTOS = [
  { id: 'cierre', nombre: 'Cierre de la fecha', detalle: 'carrusel 11 Ideal + Ganadores + MVPs, con el caption 1' },
  { id: 'dia',    nombre: 'MVPs del día',       detalle: 'al terminar el último partido de cada día' },
  { id: 'pitazo', nombre: 'Resultado al pitazo', detalle: 'la placa de resultado de cada partido, 15 por fecha' },
];
async function autoPanelRender() {
  const cont = document.getElementById('autoPanel');
  if (!cont) return;
  let cfg = {};
  try { const r = await fetch('publicar.json?v=' + Date.now()); const t = await r.text(); cfg = (t.trim().startsWith('{') ? JSON.parse(t) : {}); } catch (e) { cfg = {}; }
  const auto = cfg.auto || {};
  const fila = m => `<div class="auto-fila"><div class="auto-nombre">${m.nombre}<small>${m.detalle}</small></div>` +
    `<label><input type="checkbox" data-auto="${m.id}:ig"${auto[m.id] && auto[m.id].ig ? ' checked' : ''}> Instagram</label>` +
    `<label><input type="checkbox" data-auto="${m.id}:x"${auto[m.id] && auto[m.id].x ? ' checked' : ''}> X</label></div>`;
  cont.innerHTML =
    `<div class="match-section auto-panel"><h3>PUBLICACIÓN AUTOMÁTICA</h3>` +
      `<div class="auto-ayuda">Lo que esté prendido sale solo en el momento del posteo, sin revisión previa. ` +
      (cfg.actualizado ? `Última configuración guardada: ${gnEscape(cfg.actualizado.slice(0, 16).replace('T', ' '))} UTC.` : 'Todavía no hay nada prendido.') + `</div>` +
      AUTO_MOMENTOS.map(fila).join('') +
      `<div class="auto-acciones"><button class="cap-btn auto-guardar">Guardar</button><span class="auto-estado"></span></div>` +
    `</div>`;
  const btn = cont.querySelector('.auto-guardar'), est = cont.querySelector('.auto-estado');
  btn.addEventListener('click', async () => {
    if (!ghToken(true)) return;
    const inputs = {};
    cont.querySelectorAll('input[data-auto]').forEach(i => { inputs[i.dataset.auto.replace(':', '_')] = i.checked ? 'true' : 'false'; });
    try {
      btn.disabled = true; est.textContent = 'Guardando...';
      const desde = new Date(Date.now() - 60e3).toISOString();
      await ghApi('/actions/workflows/configurar-auto.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: 'main', inputs }) });
      for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 6000));
        const d = await ghApi('/actions/workflows/configurar-auto.yml/runs?per_page=1&created=>' + desde);
        const run = d && d.workflow_runs && d.workflow_runs[0];
        if (!run || run.status !== 'completed') continue;
        est.textContent = run.conclusion === 'success' ? 'Guardado ✓' : 'Falló: ver en GitHub';
        btn.disabled = false;
        if (run.conclusion === 'success') setTimeout(autoPanelRender, 1500);
        return;
      }
      est.textContent = 'Tarda más de lo normal: ver en GitHub'; btn.disabled = false;
    } catch (e) { est.textContent = ''; btn.disabled = false; alert('No se pudo guardar: ' + e.message); }
  });
}

/* Manda a publicar en una red y va mostrando el estado de la corrida en el botón. */
async function capPublicarRed(btn, red, matchday, placa, opcion, texto) {
  const R = CAP_REDES[red];
  if (!ghToken(true)) return;
  if (texto.length > R.maximo) { alert('El texto tiene ' + texto.length + ' caracteres y ' + R.nombre + ' permite ' + R.maximo + '.'); return; }
  if (!confirm('¿Publicar en ' + R.nombre + ' la placa de ' + (placa === 'ideal' ? '11 Ideal' : 'Ganadores') + ' de la fecha ' + matchday + ' con este texto?\n\n' + texto)) return;
  const estado = (t, clase) => { btn.textContent = t; btn.className = 'cap-btn cap-' + red + (clase ? ' ' + clase : ''); };
  try {
    btn.disabled = true; estado('Enviando...');
    const desde = new Date(Date.now() - 60e3).toISOString();
    await ghApi('/actions/workflows/' + R.workflow + '/dispatches', {
      method: 'POST',
      body: JSON.stringify({ ref: 'main', inputs: { fecha: String(matchday), placa, opcion: String(opcion), texto, probar: 'false' } }),
    });
    estado('En cola...');
    // La corrida aparece unos segundos después; se la sigue hasta que termine.
    for (let i = 0; i < 60; i++) {
      await new Promise(r => setTimeout(r, 8000));
      const d = await ghApi('/actions/workflows/' + R.workflow + '/runs?per_page=1&created=>' + desde);
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) continue;
      if (run.status !== 'completed') { estado(run.status === 'queued' ? 'En cola...' : 'Publicando...'); continue; }
      if (run.conclusion === 'success') { estado('Publicado en ' + R.nombre + ' ✓', 'is-ok'); }
      else { estado('Falló: ver en GitHub', 'is-error'); btn.onclick = () => window.open(run.html_url, '_blank'); }
      btn.disabled = false;
      return;
    }
    estado('Tarda más de lo normal: ver en GitHub'); btn.disabled = false;
    btn.onclick = () => window.open('https://github.com/' + GH_REPO + '/actions/workflows/' + R.workflow, '_blank');
  } catch (e) {
    estado(R.boton); btn.disabled = false;
    alert('No se pudo publicar: ' + e.message);
  }
}

let capConfig = {};
try { capConfig = JSON.parse(localStorage.getItem(CAP_STORE) || '{}'); } catch (e) { capConfig = {}; }

function capGuardar() {
  try { localStorage.setItem(CAP_STORE, JSON.stringify(capConfig)); } catch (e) { /* modo incógnito */ }
}
function capClave(kind, matchday, red) {
  return currentComp + '-' + currentSeason + ':' + matchday + ':' + kind + ':' + red;
}

const capTorneo = () => (currentComp === 724 ? 'CLAUSURA' : 'APERTURA') + ' ' + currentSeason;
const capPts = v => (Number(v) || 0).toFixed(1).replace('.', ',');

/* Nombre completo del club: el RPC trae la sigla y "Gimnasia de Mendoza" lee
   mejor que "GEM" en un caption. */
let capNombresEquipo = null;
async function capCargarEquipos() {
  if (capNombresEquipo) return capNombresEquipo;
  capNombresEquipo = {};
  try {
    const { data } = await db.from('teams').select('id, name, short_name');
    (data || []).forEach(t => { capNombresEquipo[t.id] = t.name || t.short_name; });
  } catch (e) { /* si falla se usa la sigla */ }
  return capNombresEquipo;
}
function capEquipo(p) {
  return (capNombresEquipo && capNombresEquipo[p.team_id]) || p.team_short_name || '';
}

/* Quién entró desde el banco. Es el dato de color que usan siempre y sale de la
   misma vista que alimenta la placa de super suplentes. */
let capSuplentes = {};
async function capCargarSuplentes(matchday, ids) {
  capSuplentes = {};
  if (!ids.length) return;
  try {
    const { data } = await db.from('v_fantasy_player_match_points')
      .select('player_id, is_starter')
      .eq('competition_id', currentComp).eq('season_id', currentSeason)
      .eq('matchday', matchday).in('player_id', ids);
    (data || []).forEach(r => { capSuplentes[r.player_id] = r.is_starter === false; });
  } catch (e) { /* sin este dato el caption sale igual, sin la línea del banco */ }
}

const capNombre = p => p.player_name || '';
const capApellido = p => (p.player_name || '').trim().split(/\s+/).slice(-1)[0];

function capTodos(lineup) {
  const out = [];
  PT_BAND_ORDER.forEach(b => (lineup[b] || []).forEach(e => out.push(e)));
  return out;
}
function capOrdenados(lineup) {
  return capTodos(lineup).sort((a, b) =>
    (Number(b.player.total_points) || 0) - (Number(a.player.total_points) || 0));
}

/* Los eventos del jugador en frase, para la línea de la figura. */
function capQueHizo(p) {
  const e = p.events || {};
  const partes = [];
  const g = (e.goals || 0) + (e.penalty_goals || 0);
  if (g === 1) partes.push('un gol');
  else if (g > 1) partes.push(g + ' goles');
  if (e.assists === 1) partes.push('una asistencia');
  else if (e.assists > 1) partes.push(e.assists + ' asistencias');
  if (e.penalty_saves === 1) partes.push('un penal atajado');
  else if (e.penalty_saves > 1) partes.push(e.penalty_saves + ' penales atajados');
  if (e.clean_sheet && !partes.length) partes.push('el arco en cero');
  if (!partes.length) return '';
  if (partes.length === 1) return partes[0];
  return partes.slice(0, -1).join(', ') + ' y ' + partes[partes.length - 1];
}

/* "Malcorra entró desde el banco" / "dos jugadores entraron desde el banco: A y B" */
function capLineaBanco(lineup) {
  const banco = capTodos(lineup).filter(e => capSuplentes[e.player.player_id]);
  if (!banco.length) return '';
  if (banco.length === 1) {
    return `Para destacar: ${capNombre(banco[0].player)} entró desde el banco y se metió igual en el 11 Ideal.`;
  }
  const nombres = banco.map(e => capApellido(e.player));
  const ultimo = nombres.pop();
  return `Para destacar: ${banco.length} jugadores del 11 Ideal entraron desde el banco: ${nombres.join(', ')} y ${ultimo}.`;
}

function capTextoIdeal(matchday, team, lineup) {
  const orden = capOrdenados(lineup);
  const figura = orden[0];
  const hizo = capQueHizo(figura.player);
  const lineaFigura = `⭐ La figura de la fecha: ${capNombre(figura.player)}` +
    `, ${capPts(figura.player.total_points)} puntos` +
    (hizo ? ` con ${hizo}` : '') +
    `. Un ${capEquipo(figura.player)} que está encendido ❤️‍🔥`;

  const banco = capLineaBanco(lineup);

  const ig = [
    `🔥 11 IDEAL — FECHA ${matchday} | ${capTorneo()}`,
    '',
    `Una fecha que nos dejó ${capPts(team.total_points)} puntos entre los once y varias actuaciones para destacar.`,
    '',
    lineaFigura,
    ...(banco ? ['', banco] : []),
    '',
    `¿A ustedes cómo les fue en la Fecha ${matchday}? 👇 ¿Qué opinan?`,
  ].join('\n');

  const tweet = [
    `EL EQUIPO IDEAL DE LA FECHA ${matchday} ⚡`,
    '',
    `${capPts(team.total_points)} puntos entre los once.`,
    ...(banco ? ['', banco.replace('Para destacar: ', '')] : []),
    '',
    `¿Cuántos tenían del equipo ideal?`,
  ].join('\n');

  return { ig, tweet };
}

function capTextoGanador(matchday, team, lineup) {
  // Sin arroba: en los captures reales lo nombran "Polze", no "@polze_".
  // Sin arroba, sin guiones de cola y con mayuscula inicial: en los posteos
  // reales aparece "Polze", no "@polze_".
  const crudo = (team.username || 'El ganador').replace(/^@/, '').replace(/_+$/, '');
  const usuario = crudo.charAt(0).toUpperCase() + crudo.slice(1);
  const todos = capTodos(lineup);
  const cap = todos.find(e => e.player.is_captain);
  const arquero = (lineup.gk || [])[0];

  const cuerpo = [];
  if (arquero) {
    cuerpo.push(`Fue seguro al arco con ${capNombre(arquero.player)}` +
      (arquero.player.events && arquero.player.events.clean_sheet ? ', que dejó el arco en cero' : '') + '.');
  }
  if (cap) {
    const bidon = cap.player.bidon_name ? ` con un ${cap.player.bidon_name}` : '';
    cuerpo.push(`Marcó la diferencia con ${capNombre(cap.player)}, a quien puso de capitán${bidon}: ` +
      `le terminó dando ${capPts(cap.player.total_points)} puntos.`);
  }

  const ig = [
    `Con este equipo, ${usuario} se lleva la Fecha ${matchday} 🏆`,
    '',
    ...cuerpo.flatMap(l => [l, '']),
    `Una decisión que terminó siendo clave para quedarse con la fecha.`,
  ].join('\n');

  return { ig, tweet: ig };
}

function capGenerar(kind, matchday, team, lineup) {
  return kind === 'ideal'
    ? capTextoIdeal(matchday, team, lineup)
    : capTextoGanador(matchday, team, lineup);
}

/** Caja editable con copiar y restaurar. Con `versiones` ([{id, label, texto}])
    aparecen botones para cambiar entre variantes del mismo caption (Completa /
    Corta); cada variante guarda su edición aparte. */
function capCaja(kind, matchday, red, titulo, textoBase, versiones, publicarX) {
  const caja = document.createElement('div');
  caja.className = 'cap-caja';
  const vs = (versiones && versiones.length > 1) ? versiones : null;
  let actual = vs ? vs[0] : null;
  const claveDe = (v) => capClave(kind, matchday, red + ((v || actual) ? ':' + (v || actual).id : ''));
  const baseDe = () => (actual ? actual.texto : textoBase);
  let clave = claveDe();
  const versionX = vs && vs.find(v => v.id === 'x');
  const conX = !!(publicarX && versionX);

  const esTweet = red === 'tweet';
  caja.innerHTML =
    `<div class="cap-head">${titulo}` +
      `<span class="cap-acciones">` +
        (vs ? `<span class="cap-versiones">` + vs.map((v, i) => `<button class="cap-btn cap-ver${i === 0 ? ' is-activa' : ''}" data-ver="${v.id}">${v.label}</button>`).join('') + `</span>` : '') +
        `<button class="cap-btn cap-copiar">Copiar</button>` +
        `<button class="cap-btn cap-reset" title="Volver al texto original">Restaurar</button>` +
        (publicarX ? `<button class="cap-btn cap-ig" title="Publica la placa en Instagram con el texto que está a la vista (Completa o Corta)">Publicar en IG</button>` : '') +
        (conX ? `<button class="cap-btn cap-x" title="Publica la placa en X con el texto de la pestaña X">Publicar en X</button>` : '') +
      `</span>` +
    `</div>` +
    `<textarea class="cap-txt${esTweet ? ' is-tweet' : ''}" spellcheck="false"></textarea>` +
    (esTweet ? `<div class="cap-cuenta"></div>` : '');

  const ta = caja.querySelector('.cap-txt');
  ta.value = capConfig[clave] != null ? capConfig[clave] : baseDe();

  const contar = () => {
    if (!esTweet) return;
    const n = ta.value.length;
    const c = caja.querySelector('.cap-cuenta');
    c.textContent = n + ' / ' + CAP_MAX_TWEET;
    c.className = 'cap-cuenta' + (n > CAP_MAX_TWEET ? ' is-pasado' : '');
  };
  const ajustarAlto = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };

  ta.addEventListener('input', () => {
    capConfig[clave] = ta.value; capGuardar(); contar(); ajustarAlto();
  });

  caja.querySelector('.cap-copiar').addEventListener('click', async ev => {
    const btn = ev.currentTarget;
    try { await navigator.clipboard.writeText(ta.value); }
    catch (e) { ta.select(); document.execCommand('copy'); }
    btn.textContent = 'Copiado'; btn.classList.add('is-ok');
    setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('is-ok'); }, 1400);
  });

  caja.querySelector('.cap-reset').addEventListener('click', () => {
    ta.value = baseDe(); delete capConfig[clave]; capGuardar(); contar(); ajustarAlto();
  });

  // Publicar en X: usa el texto de la pestaña "X" tal como está (editado o el original),
  // esté o no esa pestaña a la vista.
  if (conX) {
    caja.querySelector('.cap-x').addEventListener('click', ev => {
      const k = claveDe(versionX);
      const texto = (capConfig[k] != null ? capConfig[k] : versionX.texto).trim();
      capPublicarRed(ev.currentTarget, 'x', matchday, publicarX.placa, publicarX.opcion, texto);
    });
  }
  // Publicar en Instagram: el texto que está a la vista (Completa o Corta, con lo
  // editado). Si la pestaña activa es la de X, va la Completa.
  if (publicarX) {
    caja.querySelector('.cap-ig').addEventListener('click', ev => {
      const v = (actual && actual.id !== 'x') ? actual : (vs ? vs[0] : null);
      const k = claveDe(v);
      const texto = (capConfig[k] != null ? capConfig[k] : (v ? v.texto : textoBase)).trim();
      capPublicarRed(ev.currentTarget, 'ig', matchday, publicarX.placa, publicarX.opcion, texto);
    });
  }

  // Cambio de versión (Completa / Corta / X): cada una con su texto y su edición guardada.
  caja.querySelectorAll('.cap-ver').forEach(btn => btn.addEventListener('click', () => {
    actual = vs.find(v => v.id === btn.dataset.ver) || vs[0];
    clave = claveDe();
    caja.querySelectorAll('.cap-ver').forEach(b => b.classList.toggle('is-activa', b === btn));
    ta.value = capConfig[clave] != null ? capConfig[clave] : baseDe();
    contar(); ajustarAlto();
  }));

  requestAnimationFrame(() => { contar(); ajustarAlto(); });
  return caja;
}

/** Las cajas que van al lado del póster. Si la fecha tiene captions escritos
    (captions.json), una caja por versión en vez de la de Instagram del template. */
function capPanel(kind, matchday, team, lineup) {
  const t = capGenerar(kind, matchday, team, lineup);
  const panel = document.createElement('div');
  panel.className = 'cap-panel';
  const escritos = capEscritos(kind, matchday);
  if (escritos.length) {
    panel.classList.add('is-escritos');
    escritos.forEach(c => panel.appendChild(capCaja(kind, matchday, c.red, 'Instagram · ' + gnEscape(c.titulo), c.texto,
      capVersiones(c), kind === 'ideal' ? { placa: 'ideal', opcion: c.opcion } : null)));
    const informe = document.createElement('div');
    informe.className = 'cap-cuenta cap-informe';
    informe.style.textAlign = 'left';
    informe.innerHTML = `Escritos solos al cierre de la fecha. <a href="captions/fecha-${matchday}.md" target="_blank" style="color:#92B1DC">Informe: historias, fuentes y análisis</a>`;
    panel.appendChild(informe);
  } else {
    panel.appendChild(capCaja(kind, matchday, 'ig', 'Instagram', t.ig));
  }
  // La caja de X / Twitter se sacó (22-sep-2026): sólo se usa el caption de Instagram.
  return panel;
}

// ══════════════════════════════════════════════════════════════════════
// FOTOS DE JUGADORES
// Recortes con fondo transparente en fotos/<player_id>.png, con el mismo
// player_id que ya usan los escudos. La foto es siempre OPCIONAL: si el archivo
// no está, la tarjeta se dibuja exactamente como antes y no se rompe nada.
//
// Por qué archivos locales y no Transfermarkt en vivo:
//   - El recorte contra fondo transparente es trabajo a mano; la portrait cruda
//     de Transfermarkt viene con fondo y no sirve para la tarjeta.
//   - html-to-image dibuja las tarjetas en un canvas. Una imagen de otro dominio
//     sin CORS lo contamina y el "Descargar PNG" deja de funcionar. Sirviendo
//     las fotos del mismo origen que la página, eso no puede pasar.
//   - El recorte se hace una vez por jugador y se reusa en todas las fechas.
// ══════════════════════════════════════════════════════════════════════

const FOTO_DIR = 'fotos/';

/* Lista de fotos publicada (fotos/lista.json, la escribe tools/lista-fotos.js).
   En winning.com.ar pedir un archivo que no existe devuelve la home con
   "guardar un año", y el navegador se queda con eso aunque la foto se suba
   después. Por eso: (1) no se prueba foto por foto si hay lista, y (2) cada
   foto se pide con ?v=<sello de la publicación>, que saltea lo guardado.
   Sin lista (trabajando en local) se prueba por <img> como siempre. */
let fotoLista = null;        // { v, ids: Set } | false (no hay lista)
let fotoListaProm = null;
function fotoCargarLista() {
  if (fotoLista !== null) return Promise.resolve(fotoLista);
  if (!fotoListaProm) {
    fotoListaProm = fetch(FOTO_DIR + 'lista.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => { fotoLista = (j && Array.isArray(j.ids)) ? { v: j.v || '', ids: new Set(j.ids.map(Number)) } : false; return fotoLista; })
      .catch(() => { fotoLista = false; return fotoLista; });
  }
  return fotoListaProm;
}
function fotoUrl(playerId) {
  return FOTO_DIR + playerId + '.png' + (fotoLista && fotoLista.v ? '?v=' + fotoLista.v : '');
}

/* Jugadores que tienen recorte, resuelto ANTES de dibujar.
   No alcanza con un onerror: html-to-image clona la tarjeta para exportarla y
   vuelve a pedir cada imagen. Un <img> apuntando a un archivo que no está hace
   fallar ese clonado y se cae el "Descargar PNG" del póster entero, no sólo la
   foto. Por eso la etiqueta no se emite si el archivo no está. */
const fotoDisponibles = new Set();

async function fotoPreloadIds(idsCrudos) {
  const lista = [...new Set((idsCrudos || []).filter(Boolean))];
  const estados = await Promise.all(lista.map(fotoExiste));
  lista.forEach((id, i) => {
    if (estados[i]) fotoDisponibles.add(id); else fotoDisponibles.delete(id);
  });
  return lista.filter((id, i) => !estados[i]);
}

async function fotoPreload(data) {
  const ids = [];
  [data && data.winning_team, data && data.winner_team].forEach(t =>
    ((t && t.players) || []).forEach(pl => ids.push(pl.player_id)));
  return fotoPreloadIds(ids);
}

/* Etiqueta lista para pegar en el HTML de una tarjeta. Sin foto no hay <img> y
   la tarjeta queda con el marco vacío de siempre. */
function fotoImgHtml(playerId, clase) {
  if (!playerId || !fotoDisponibles.has(playerId)) return '';
  return `<img class="${clase}" src="${fotoUrl(playerId)}" alt="">`;
}

/* Probe por <img>: es la única forma de saber desde el navegador si el archivo
   está, y de paso deja la foto cacheada para cuando se dibuje la tarjeta. */
const fotoProbeCache = {};
function fotoExiste(playerId) {
  if (!playerId) return Promise.resolve(false);
  if (fotoProbeCache[playerId]) return fotoProbeCache[playerId];
  fotoProbeCache[playerId] = fotoCargarLista().then(lista => {
    if (lista) return lista.ids.has(Number(playerId));
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = fotoUrl(playerId);
    });
  });
  return fotoProbeCache[playerId];
}

/* Búsqueda por nombre en vez del perfil directo: la tabla que mapea nuestro
   player_id al de Transfermarkt no es legible con la anon key, y además sólo
   cubre la mitad del plantel. La búsqueda anda para todos. */
function fotoTmUrl(nombre) {
  return 'https://www.transfermarkt.com.ar/schnellsuche/ergebnis/schnellsuche?query=' +
         encodeURIComponent(nombre || '');
}

/**
 * Checklist de fotos faltantes de la fecha, sobre los 22 puestos de los dos
 * pósters. Es lo que reemplaza al "buscar y pegar a mano" en cada placa: acá
 * ves qué falta, lo bajás, lo recortás y lo guardás con el nombre que te dice.
 */
function renderFotosPendientes(data) {
  const cont = document.getElementById('fotosContainer');
  if (!cont) return;
  cont.innerHTML = '';

  const vistos = new Set();
  const jugadores = [];
  [data.winning_team, data.winner_team].forEach(t => {
    (t && t.players || []).forEach(p => {
      if (!p.player_id || vistos.has(p.player_id)) return;
      vistos.add(p.player_id);
      jugadores.push(p);
    });
  });
  if (!jugadores.length) return;

  const faltan = jugadores.filter(p => !fotoDisponibles.has(p.player_id));
  const tienen = jugadores.length - faltan.length;

  const box = document.createElement('div');
  box.className = 'foto-report' + (faltan.length ? '' : ' is-ok');

  if (!faltan.length) {
    box.innerHTML = '<div class="foto-head">Fotos: están las ' + jugadores.length + '.</div>';
    cont.appendChild(box);
    return;
  }

  box.innerHTML =
    '<div class="foto-head">Fotos: ' + tienen + ' de ' + jugadores.length + '. ' +
      'Faltan ' + faltan.length + ' — bajala de Transfermarkt, sacale el fondo y ' +
      'guardala en <code>website/recap/fotos/</code> con el nombre que dice acá. ' +
      'Una vez por jugador: después se reusa en todas las fechas.</div>' +
    '<table class="foto-table">' +
      faltan.map(p =>
        '<tr>' +
          '<td class="foto-name">' + gnEscape(p.player_name || '') + '</td>' +
          '<td class="foto-file"><code>' + p.player_id + '.png</code></td>' +
          '<td><a class="foto-link" target="_blank" rel="noopener" href="' +
            gnEscape(fotoTmUrl(p.player_name)) + '">buscar en Transfermarkt</a></td>' +
        '</tr>'
      ).join('') +
    '</table>';
  cont.appendChild(box);
}

// ══════════════════════════════════════════════════════════════════════
// MOTOR DE POSICIONES (PE_*)
// Decide qué puesto ocupa cada jugador dentro de su línea en los pósters de
// cancha, en vez de acomodarlos por el orden en que los devuelve el servidor.
//
// El problema que resuelve: el póster ordenaba cada línea por `slot_order`, que
// es un número de desempate del ranking de puntos, no una posición. En la fecha
// 7 del Clausura eso dejaba a Cerato (lateral DERECHO) dibujado a la izquierda y
// a Lautaro Blanco (lateral IZQUIERDO) a la derecha.
//
// De dónde sale el dato de posición, en orden de prioridad:
//   1. winning_lpf.player_universe.real_position / real_position_side
//      El perfil natural del jugador ("Full Back / Right"). Manda siempre.
//   2. winning_lpf.player_match_stats.formation_place de esa misma fecha
//      El puesto que Opta le asignó en el once ese día. Los lugares 2 y 3 son
//      lateral derecho e izquierdo en TODAS las formaciones (verificado sobre
//      ~1.400 alineaciones), así que valen como perfil duro cuando no hay
//      perfil natural. Del 7 al 11 el dato es flojo — los extremos cambian de
//      banda todo el tiempo — así que entra sólo como pista de desempate.
//   3. preferred_foot. Pista mínima: sólo desempata entre puestos equivalentes.
//
// Qué NO decide este motor: cuántos jugadores van en cada línea. Eso lo fija el
// once fantasy (3 DEF + 4 VOL/FLEX + 3 DEL = 3-4-3) y es la verdad del juego;
// tocarlo sería dibujar una formación que no es la que se armó. Lo que sí
// decide es la forma de cada línea: si los 3 del fondo son LI-DFC-LD o tres
// centrales, y quién se para en cada carril.
// ══════════════════════════════════════════════════════════════════════

/* real_position (Transfermarkt, vía player_universe) -> rol interno. */
const PE_ROLE_BY_REAL = {
  'Goalkeeper':           'GK',
  'Central Defender':     'CB',
  'Full Back':            'FB',
  'Wing Back':            'FB',
  'Defensive Midfielder': 'DM',
  'Central Midfielder':   'CM',
  'Attacking Midfielder': 'AM',
  'Winger':               'WING',
  'Second Striker':       'SS',
  'Striker':              'ST',
};

/* Afinidad de carril por rol: 0 = puro centro, 1 = puro banda. Es lo que evita
   que un central termine de lateral en una línea de 4 sólo porque sobraba lugar. */
const PE_WIDE_BY_ROLE = {
  GK: 0, CB: 0.15, FB: 1, DM: 0.1, CM: 0.35, AM: 0.45, WING: 1, SS: 0.3, ST: 0.15,
};

/* Opta formation_place -> lado y carril, con la confianza que le tenemos.
   Derivado empíricamente de winning_lpf: los puestos 2 y 3 aciertan el lado en
   más del 95% de los casos; el 7 y el 11 apenas en un 60%. */
const PE_FP = {
  1:  { side: 'C', conf: 1.00, wide: 0    },
  2:  { side: 'R', conf: 0.90, wide: 1    },
  3:  { side: 'L', conf: 0.90, wide: 1    },
  4:  { side: 'C', conf: 0.70, wide: 0    },
  5:  { side: 'C', conf: 0.80, wide: 0    },
  6:  { side: 'C', conf: 0.80, wide: 0    },
  7:  { side: 'R', conf: 0.30, wide: 0.85 },
  8:  { side: 'C', conf: 0.50, wide: 0.15 },
  9:  { side: 'C', conf: 0.60, wide: 0    },
  10: { side: 'C', conf: 0.40, wide: 0.25 },
  11: { side: 'L', conf: 0.30, wide: 0.85 },
};
/* Con tres al fondo los puestos 7 y 11 son interiores, no carrileros: el 2 y el
   3 ya se llevaron las bandas. Bajamos la pista a casi nada en vez de mentir. */
const PE_FP_BACK3 = {
  7:  { side: 'C', conf: 0.35, wide: 0.15 },
  10: { side: 'C', conf: 0.20, wide: 0.5  },
  11: { side: 'C', conf: 0.20, wide: 0.5  },
};

/* Plantilla de cada línea, de izquierda a derecha TAL COMO SE VE EN EL PÓSTER.
   La cancha se dibuja desde el arco propio, así que la izquierda de la imagen es
   la izquierda del equipo: el lateral izquierdo va a la izquierda.

   sideW = cuánto pesa el lado en esa línea. Una línea de 4 en el fondo exige
           laterales de verdad (1.0); una de 3 es mucho más laxa (0.55), porque
           ahí los de afuera bien pueden ser centrales de una defensa de tres.
   wideW = cuánto pesa el perfil carrilero contra el interior. */
const PE_LINE = {
  def: {
    1: { sides: ['C'],                 sideW: 0.20, wideW: 0.5 },
    2: { sides: ['L', 'R'],            sideW: 0.80, wideW: 1.5 },
    3: { sides: ['L', 'C', 'R'],       sideW: 0.55, wideW: 1.2 },
    4: { sides: ['L', 'C', 'C', 'R'],  sideW: 1.00, wideW: 3.0 },
    5: { sides: ['L', 'C', 'C', 'C', 'R'], sideW: 1.00, wideW: 3.0 },
  },
  mid: {
    1: { sides: ['C'],                 sideW: 0.20, wideW: 0.5 },
    2: { sides: ['C', 'C'],            sideW: 0.30, wideW: 0.6 },
    3: { sides: ['L', 'C', 'R'],       sideW: 0.50, wideW: 1.2 },
    4: { sides: ['L', 'C', 'C', 'R'],  sideW: 0.90, wideW: 2.4 },
    5: { sides: ['L', 'C', 'C', 'C', 'R'], sideW: 0.90, wideW: 2.4 },
  },
  attack: {
    1: { sides: ['C'],                 sideW: 0.20, wideW: 0.3 },
    2: { sides: ['C', 'C'],            sideW: 0.35, wideW: 0.6 },
    3: { sides: ['L', 'C', 'R'],       sideW: 0.90, wideW: 2.2 },
    4: { sides: ['L', 'C', 'C', 'R'],  sideW: 0.90, wideW: 2.2 },
  },
  gk: {
    1: { sides: ['C'],                 sideW: 0,    wideW: 0   },
  },
};

/* El lado pesa un orden de magnitud más que todo lo demás: la regla es que un
   lateral derecho y uno izquierdo NUNCA se intercambian para que cierre el
   dibujo. Las pistas blandas sólo desempatan. */
const PE_W_SIDE = 10;
const PE_W_HINT = 1.2;
const PE_W_ORDER = 0.02;

/** "Left/Centre" -> {L:true, C:true, R:false}. Devuelve null si no hay dato. */
function peParseSides(raw) {
  const s = String(raw || '');
  const out = { L: s.includes('Left'), C: s.includes('Centre'), R: s.includes('Right') };
  return (out.L || out.C || out.R) ? out : null;
}

/** Una línea que no está en la tabla (7 volantes, etc.) se sintetiza: bandas
    afuera, centro adentro. */
function peLine(band, n) {
  const table = PE_LINE[band] || PE_LINE.mid;
  if (table[n]) return table[n];
  const sides = [];
  for (let i = 0; i < n; i++) sides.push(i === 0 ? 'L' : i === n - 1 ? 'R' : 'C');
  return { sides, sideW: 0.8, wideW: 2.0 };
}

// ── Perfil del jugador ────────────────────────────────────────────────

/**
 * Funde las tres fuentes en un perfil único.
 *   sides    perfil duro {L,C,R} o null si no sabemos
 *   wide     afinidad de carril 0..1
 *   hint     pistas blandas por lado, 0..1
 */
function peProfile(player, uni, played) {
  const role = uni ? (PE_ROLE_BY_REAL[uni.real_position] || null) : null;
  let sides = uni ? peParseSides(uni.real_position_side) : null;
  const hint = { L: 0, C: 0, R: 0 };
  let wide = null;
  let source = sides ? 'perfil' : null;

  // Opta de esa fecha.
  let fp = null;
  if (played && played.formation_place >= 1 && played.formation_place <= 11) {
    const back3 = /^3/.test(String(played.formation_used || ''));
    fp = (back3 && PE_FP_BACK3[played.formation_place]) || PE_FP[played.formation_place];
  }
  if (fp) {
    if (!sides && fp.conf >= 0.7) {
      // Los puestos 1 a 6 son confiables: valen como perfil duro.
      sides = { L: fp.side === 'L', C: fp.side === 'C', R: fp.side === 'R' };
      source = 'opta';
    } else {
      hint[fp.side] += fp.conf;
    }
    if (wide === null) wide = fp.wide;
  }

  // Pierna hábil: la pista más débil de todas.
  if (uni && uni.preferred_foot === 'Left')  hint.L += 0.15;
  if (uni && uni.preferred_foot === 'Right') hint.R += 0.15;

  if (role !== null) wide = PE_WIDE_BY_ROLE[role];
  if (wide === null) wide = 0.5;

  return {
    role, sides, wide, hint,
    source: source || (fp ? 'opta' : null),
    foot: uni ? uni.preferred_foot : null,
    realPosition: uni ? uni.real_position : null,
    realSide: uni ? uni.real_position_side : null,
    played: fp ? played : null,
  };
}

/** Qué tan natural le queda a `prof` el lado que pide el puesto. 1 = su lado. */
function peSideScore(prof, want) {
  if (want === 'C') {
    if (!prof.sides) return 0.75;
    if (prof.sides.C) return 1;
    return 0.35;               // un carrilero metido adentro: se banca, no es lo suyo
  }
  if (!prof.sides) return 0.60;
  if (prof.sides[want]) return 1;
  const other = want === 'L' ? 'R' : 'L';
  if (prof.sides[other]) return 0;    // perfil cambiado: el peor caso, y por lejos
  return 0.55;                        // sólo 'Centre': abrirse cuesta, pero es legal
}

function peCost(prof, slot, line, orderBias) {
  const side  = line.sideW * PE_W_SIDE * (1 - peSideScore(prof, slot.side))
              - line.sideW * PE_W_HINT * (prof.hint[slot.side] || 0);
  const width = line.wideW * Math.abs(slot.wide - prof.wide);
  return side + width + PE_W_ORDER * orderBias;
}

/** Etiqueta en castellano del puesto que terminó ocupando. */
function peLabel(prof, slot, band) {
  if (band === 'gk') return 'ARQ';
  if (band === 'def') {
    if (slot.side === 'C') return 'DFC';
    if (prof.role === 'CB' || (prof.wide < 0.4 && prof.role !== 'FB')) return 'DFC';
    return slot.side === 'L' ? 'LI' : 'LD';
  }
  if (band === 'mid') {
    if (slot.side === 'C') {
      if (prof.role === 'DM') return 'MCD';
      if (prof.role === 'AM' || prof.role === 'SS') return 'MP';
      return 'MC';
    }
    return slot.side === 'L' ? 'VI' : 'VD';
  }
  if (slot.side === 'C') {
    return (prof.role === 'AM' || prof.role === 'SS') ? 'MP' : 'DC';
  }
  return slot.side === 'L' ? 'EI' : 'ED';
}

/** natural | secundaria | forzada | sin-dato. Es lo que se lee en el panel de QA. */
function peFit(prof, slot, line) {
  if (!prof.sides && !prof.role && !prof.played) return 'sin-dato';
  // Perfil cambiado: un lateral derecho parado de lateral izquierdo. Es el caso
  // que el motor existe para evitar, así que si aparece se canta siempre.
  if (slot.side !== 'C' && prof.sides) {
    const other = slot.side === 'L' ? 'R' : 'L';
    if (prof.sides[other] && !prof.sides[slot.side]) return 'forzada';
  }
  // En una línea donde el carril importa (fondo de 4, ataque de 3), un central
  // abierto o un extremo de doble cinco es una posición forzada.
  if (line.wideW >= 2 && Math.abs(slot.wide - prof.wide) >= 0.7) return 'forzada';
  if (prof.sides && prof.sides[slot.side]) return 'natural';
  // Sin lado declarado, un perfil de interior en un puesto del medio está en su
  // lugar: no hay nada que "adaptar" ahí.
  if (slot.side === 'C' && prof.wide < 0.5) return 'natural';
  return 'secundaria';
}

/* Permutaciones cacheadas. Una línea nunca pasa de 6, así que la búsqueda
   exhaustiva (720 combinaciones en el peor caso) da el óptimo exacto sin
   necesidad de Hungarian ni heurísticas. */
const PE_PERMS = {};
function pePerms(n) {
  if (PE_PERMS[n]) return PE_PERMS[n];
  const out = [];
  const walk = (acc, left) => {
    if (!left.length) { out.push(acc); return; }
    left.forEach((v, i) => walk(acc.concat(v), left.slice(0, i).concat(left.slice(i + 1))));
  };
  walk([], Array.from({ length: n }, (_, i) => i));
  PE_PERMS[n] = out;
  return out;
}

/**
 * Ordena una línea. `entries` = [{ player, prof, order }] en el orden que vino
 * del servidor. Devuelve el mismo array reordenado, con `slot`, `label` y `fit`.
 */
function peAssignLine(band, entries) {
  const n = entries.length;
  const line = peLine(band, n);
  const slots = line.sides.map((side, i) => ({ i, side, wide: side === 'C' ? 0 : 1 }));

  // Sesgo de estabilidad: a igualdad de todo lo demás, respetar el orden que ya
  // traía el servidor, para que dos renders de la misma fecha den lo mismo.
  const bias = entries.map((e, i) => (n > 1 ? i / (n - 1) : 0));

  const cost = entries.map((e, pi) =>
    slots.map(s => peCost(e.prof, s, line, Math.abs(bias[pi] - (n > 1 ? s.i / (n - 1) : 0))))
  );

  let best = null, bestCost = Infinity;
  pePerms(n).forEach(perm => {
    let total = 0;
    for (let pi = 0; pi < n; pi++) total += cost[pi][perm[pi]];
    if (total < bestCost - 1e-9) { bestCost = total; best = perm; }
  });

  const out = new Array(n);
  entries.forEach((e, pi) => {
    const slot = slots[best[pi]];
    out[slot.i] = Object.assign({}, e, {
      slot,
      label: peLabel(e.prof, slot, band),
      fit: peFit(e.prof, slot, line),
    });
  });
  return out;
}

// ── Datos ─────────────────────────────────────────────────────────────

/* Una fecha se puede mirar varias veces; el contexto no cambia. */
const PE_CACHE = {};

/**
 * Trae, para los jugadores de los dos pósters de una fecha, el perfil natural y
 * el puesto que ocuparon en el once de Opta. Si algo falla devuelve el contexto
 * vacío: el póster se dibuja igual, sólo que con menos información.
 */
async function peFetchContext(matchday, playerIds) {
  const ids = [...new Set(playerIds.filter(Boolean))].sort((a, b) => a - b);
  if (!ids.length) return { uni: {}, played: {} };
  const key = currentComp + '-' + currentSeason + ':' + matchday + ':' + ids.join(',');
  if (PE_CACHE[key]) return PE_CACHE[key];

  const ctx = { uni: {}, played: {} };
  try {
    const [uniR, fixR] = await Promise.all([
      db.schema('winning_lpf').from('player_universe')
        .select('player_id, real_position, real_position_side, preferred_foot')
        .in('player_id', ids),
      db.from('v_fixtures')
        .select('game_id')
        .eq('competition_id', currentComp)
        .eq('season_id', currentSeason)
        .eq('matchday', matchday),
    ]);
    (uniR.data || []).forEach(r => { ctx.uni[r.player_id] = r; });

    const gameIds = (fixR.data || []).map(r => r.game_id).filter(Boolean);
    if (gameIds.length) {
      const [pmsR, tmsR] = await Promise.all([
        db.schema('winning_lpf').from('player_match_stats')
          .select('player_id, game_id, team_id, formation_place')
          .in('game_id', gameIds).in('player_id', ids),
        db.schema('winning_lpf').from('team_match_stats')
          .select('game_id, team_id, formation_used')
          .in('game_id', gameIds),
      ]);
      const formations = {};
      (tmsR.data || []).forEach(r => { formations[r.game_id + ':' + r.team_id] = r.formation_used; });
      (pmsR.data || []).forEach(r => {
        // Un suplente entra con formation_place 0: no dice nada del puesto.
        if (!r.formation_place) return;
        ctx.played[r.player_id] = {
          formation_place: r.formation_place,
          formation_used: formations[r.game_id + ':' + r.team_id] || null,
        };
      });
    }
  } catch (err) {
    console.warn('[recap] motor de posiciones sin contexto:', err);
  }

  PE_CACHE[key] = ctx;
  return ctx;
}

/**
 * Reparte los 11 en las cuatro bandas del póster y ordena cada una.
 * Devuelve { bands, formation, rows } listo para dibujar.
 */
function peBuildLineup(team, ctx) {
  const bands = { attack: [], mid: [], def: [], gk: [] };
  (team.players || []).forEach((p, i) => {
    const band = PT_BAND[(p.display_position || 'VOL').toUpperCase()] || 'mid';
    bands[band].push({
      player: p,
      order: (p.slot_order != null ? p.slot_order : i),
      prof: peProfile(p, ctx.uni[p.player_id], ctx.played[p.player_id]),
    });
  });

  const out = {};
  PT_BAND_ORDER.forEach(band => {
    const row = bands[band].slice().sort((a, b) => a.order - b.order);
    out[band] = row.length ? peAssignLine(band, row) : [];
  });

  out.formation = [out.def.length, out.mid.length, out.attack.length]
    .filter(n => n > 0).join('-');
  return out;
}

const PT_CARD_W = 144.015;

// Which pitch band a position sits in. FLEX rides with the midfield, which is
// what makes the ideal XI a 4-card middle row.
const PT_BAND = { ARQ: 'gk', DEF: 'def', VOL: 'mid', FLEX: 'mid', DEL: 'attack' };
/* Allow-list: an unrecognised position code was interpolated straight into a
   class name, yielding a fully transparent pill instead of a coloured one. */
const PT_POS_CLASS = new Set(['ARQ', 'DEF', 'VOL', 'DEL', 'FLEX']);
const PT_BAND_ORDER = ['attack', 'mid', 'def', 'gk'];

/* Row geometry. The constants reproduce the Figma coordinates exactly for the
   layouts the two designs actually contain (attack 3, mid 3 and 4, def 3 and
   4, gk 1) and interpolate sanely for any other formation the winning user
   might have played. The pitch is drawn in perspective, so upper rows are
   narrower and the cards arc. */
function ptRowLayout(band, n) {
  const isGround = band === 'mid' || band === 'def';
  const gap = band === 'attack' ? 62.7 : (isGround ? (n >= 4 ? 110.6 : 130.6) : 0);
  const centerX = band === 'attack' ? 545.9 : 539.7;
  const baseY =
    band === 'attack' ? 345 :
    band === 'mid'    ? 583.07 :
    band === 'def'    ? (n >= 4 ? 831.15 : 850.96) :
                        1099.22;

  // Clamp the gap so a wide row can never run off the poster. A 5-man defence
  // or midfield (5-3-2, 5-4-1 are legal XIs the winner may well have played)
  // put the outer cards at x=-41.5 and right edge 1120.9 on a 1080 canvas.
  let g = gap;
  let rowW = n * PT_CARD_W + (n - 1) * g;
  const MAX_ROW_W = 1040;
  if (n > 1 && rowW > MAX_ROW_W) {
    g = (MAX_ROW_W - n * PT_CARD_W) / (n - 1);
    rowW = MAX_ROW_W;
  }
  const startX = centerX - rowW / 2;

  const out = [];
  for (let i = 0; i < n; i++) {
    const isOuter = i === 0 || i === n - 1;
    let dy = 0;
    if (band === 'attack') {
      // Centre card rides higher, following the pitch's vanishing point.
      const mid = (n - 1) / 2;
      dy = Math.abs(i - mid) < 0.6 ? -40 : 0;
    } else if (isGround) {
      dy = isOuter ? 0 : (n >= 4 ? 30 : 10);
    }
    out.push({ x: startX + i * (PT_CARD_W + g), y: baseY + dy });
  }
  return out;
}

/** "Facundo Sanguinetti" -> { surname: "SANGUINETTI", first: "Facundo" }
 *  `upper` is per-card, NOT global: the pitch posters are uppercase in Figma,
 *  the MVP list is Title Case in its comp. Same helper, two conventions. */
function ptSplitName(full, upper) {
  const cap = s => (upper === false ? s : s.toUpperCase());
  const parts = String(full || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return { surname: '', first: '' };
  if (parts.length === 1) return { surname: cap(parts[0]), first: '' };
  return { surname: cap(parts.slice(1).join(' ')), first: parts[0] };
}

/** Player-card points use a comma decimal ("20,4"); the header pill uses a period. */
function ptFormatPts(v) {
  return (Number(v) || 0).toFixed(1).replace('.', ',');
}

/** Step the surname down a size or two once it stops fitting the name slot. */
function ptNameClass(surname) {
  const n = (surname || '').length;
  if (n >= 12) return ' is-xlong';
  if (n >= 10) return ' is-long';
  return '';
}

function ptPlayerHtml(p, pos) {
  const name = ptSplitName(p.player_name);
  const posCode = (p.display_position || 'VOL').toUpperCase();
  const badge = p.team_id
    ? `<div class="pp-escudo"><img src="badges/${p.team_id}.png" ` +
      `onerror="this.parentElement.style.visibility='hidden'"></div>`
    : '';

  // Capitán y bidón en la esquina superior derecha, como estaban.
  let markers = '';
  if (p.is_captain) {
    markers += `<img class="pp-captain" src="icons/badge-captain.svg" alt="" ` +
      `style="left:${pos.x + 111.5}px; top:${pos.y - 12.99}px;">`;
  }
  if (p.bidon_id) {
    markers += `<img class="pp-bidon" src="icons/badge-bidon.svg" alt="" ` +
      `style="left:${pos.x + 110.76}px; top:${pos.y - 28.45}px;">`;
  }

  // Goles, asistencias y tarjetas: cuelgan del borde derecho, centrados sobre
  // el, apilados hacia abajo. Van fuera del .pp porque ese recorta.
  const eventos = buildEventIconsHtml(p.events, 'pp-ev');
  if (eventos) {
    // Medidas tomadas del diseño de la fecha 3: primera pelota centrada a 82
    // del borde de arriba (82 - 32/2 = 66) y centradas 2 px pasando el borde.
    markers += `<div class="pp-eventos" style="left:${pos.x + PT_CARD_W + 2}px; ` +
      `top:${pos.y + 66}px;">${eventos}</div>`;
  }

  return `<div class="pp" style="left:${pos.x}px; top:${pos.y}px;">` +
      fotoImgHtml(p.player_id, 'pp-foto') +
      `<div class="pp-tab"><img src="icons/tab-fantasy.svg" alt=""></div>` +
      `<div class="pp-panel">` +
        badge +
        `<div class="pp-pos pp-pos-${PT_POS_CLASS.has(posCode) ? posCode.toLowerCase() : 'vol'}">` +
          `${gnEscape(posCode)}</div>` +
        `<div class="pp-pts">${gnEscape(ptFormatPts(p.total_points))}</div>` +
        `<div class="pp-name${ptNameClass(name.surname)}"><b>${gnEscape(name.surname)}</b>` +
          `<span>${gnEscape(name.first)}</span></div>` +
      `</div>` +
      `<div class="pp-frame"></div>` +
    `</div>` + markers;
}

function buildPitchCard(kind, matchday, team, lineup) {
  const isIdeal = kind === 'ideal';
  const card = document.createElement('div');
  card.className = 'card card-pitch ' + (isIdeal ? 'pitch-ideal' : 'pitch-ganador');
  card.dataset.exportW  = '1080';
  card.dataset.exportH  = '1350';
  card.dataset.filename = (isIdeal ? 'equipo_ideal' : 'equipo_ganador') + '_fecha' + matchday;

  // Las lineas vienen ya ordenadas por el motor de posiciones: cada jugador en
  // el carril que le corresponde, no en el orden del ranking de puntos.
  let players = '';
  PT_BAND_ORDER.forEach(band => {
    const row = lineup[band] || [];
    if (!row.length) return;
    const layout = ptRowLayout(band, row.length);
    row.forEach((e, i) => { players += ptPlayerHtml(e.player, layout[i]); });
  });

  const total = (Number(team.total_points) || 0).toFixed(1);

  card.innerHTML =
    '<div class="pt-bg"></div>' +
    `<img class="pt-field" src="icons/${isIdeal ? 'pitch-ideal' : 'pitch-ganador'}.svg" alt="">` +
    '<img class="pt-wordmark" src="icons/wordmark-original.png" alt="">' +   // el logo original (con borde negro), el que pasó Luchi
    '<div class="pt-plaque"></div>' +
    '<div class="pt-title">' +
      `<div class="pt-title-1">${isIdeal ? 'EQUIPO IDEAL' : 'EQUIPO GANADOR'}</div>` +
      `<div class="pt-title-2${String(matchday).length > 1 ? ' is-wide' : ''}">FECHA ${matchday}</div>` +
    '</div>' +
    `<div class="pt-pts"><span class="pt-pts-n">${gnEscape(total)}</span>` +
      '<span class="pt-pts-u">PTS.</span></div>' +
    players;

  return card;
}

/* Panel de control debajo de cada póster. Vive fuera de la .card, así que no
   sale en el PNG exportado: es sólo para revisar la asignación acá. */
const PE_FIT_ES = {
  natural:     'natural',
  secundaria:  'secundaria',
  forzada:     'forzada',
  'sin-dato':  'sin dato',
};

function peSourceText(prof) {
  const bits = [];
  if (prof.realPosition) {
    bits.push(prof.realPosition + (prof.realSide ? ' / ' + prof.realSide : ''));
  }
  if (prof.played) {
    bits.push('Opta: puesto ' + prof.played.formation_place +
      (prof.played.formation_used ? ' en ' + prof.played.formation_used.split('').join('-') : ''));
  }
  if (!bits.length && prof.foot) bits.push('sólo pierna ' + (prof.foot === 'Left' ? 'izquierda' : 'derecha'));
  return bits.join(' · ') || 'sin datos de posición';
}

const PE_GRUPOS = [
  { fit: 'natural',    etiqueta: 'naturales' },
  { fit: 'secundaria', etiqueta: 'secundarias' },
  { fit: 'forzada',    etiqueta: 'forzadas' },
  { fit: 'sin-dato',   etiqueta: 'sin dato' },
];

/* Singular cuando hay uno solo: "1 forzada", no "1 forzadas". */
function peEtiqueta(g, n) {
  if (n !== 1) return g.etiqueta;
  return { naturales: 'natural', secundarias: 'secundaria',
           forzadas: 'forzada', 'sin dato': 'sin dato' }[g.etiqueta];
}

function peReportEl(lineup) {
  const wrap = document.createElement('div');
  wrap.className = 'pe-report';

  const filas = [];
  PT_BAND_ORDER.forEach(band => (lineup[band] || []).forEach(e => filas.push(e)));

  const presentes = PE_GRUPOS
    .map(g => ({ ...g, jugadores: filas.filter(e => e.fit === g.fit) }))
    .filter(g => g.jugadores.length);

  const cabecera = document.createElement('div');
  cabecera.className = 'pe-head';
  cabecera.innerHTML = '<b class="pe-form">' + gnEscape(lineup.formation) + '</b>';

  const detalle = document.createElement('div');
  detalle.className = 'pe-detalle';

  let abierto = null;
  const pintar = () => {
    cabecera.querySelectorAll('.pe-cont').forEach(b => {
      b.classList.toggle('is-abierto', b.dataset.fit === abierto);
    });
    if (!abierto) { detalle.innerHTML = ''; detalle.classList.remove('is-abierto'); return; }
    const g = presentes.find(x => x.fit === abierto);
    detalle.classList.add('is-abierto');
    detalle.innerHTML = '<table class="pe-table">' + g.jugadores.map(e =>
      '<tr class="pe-fit-' + e.fit + '">' +
        '<td class="pe-slot">' + gnEscape(e.label) + '</td>' +
        '<td class="pe-name">' + gnEscape(e.player.player_name || '') + '</td>' +
        '<td class="pe-src">' + gnEscape(peSourceText(e.prof)) + '</td>' +
      '</tr>').join('') + '</table>';
  };

  presentes.forEach(g => {
    const b = document.createElement('button');
    b.className = 'pe-cont pe-cont-' + g.fit;
    b.dataset.fit = g.fit;
    b.innerHTML = '<i></i>' + g.jugadores.length + ' ' + peEtiqueta(g, g.jugadores.length) +
      '<span class="pe-flecha">▾</span>';
    // El contador es el botón: no hay una flecha aparte para desplegar.
    b.addEventListener('click', () => { abierto = abierto === g.fit ? null : g.fit; pintar(); });
    cabecera.appendChild(b);
  });

  wrap.appendChild(cabecera);
  wrap.appendChild(detalle);

  // Si hay algún puesto forzado, arranca abierto ahí: es lo único que suele
  // necesitar que alguien lo mire. Si salió limpio, queda cerrado y calla.
  if (presentes.some(g => g.fit === 'forzada')) { abierto = 'forzada'; }
  pintar();

  return wrap;
}

/* Una fecha nueva invalida los pósters de la anterior: como ahora esperamos
   datos de posición, un click rápido entre fechas podía dejar el póster viejo. */
let ptRenderToken = 0;

async function renderPitchPosters(matchday, data) {
  const token = ++ptRenderToken;
  const container = document.getElementById('postersContainer');
  container.innerHTML = '';

  const specs = [
    { kind: 'ideal',   title: 'EQUIPO IDEAL (POSTER)',   team: data.winning_team },
    { kind: 'ganador', title: 'EQUIPO GANADOR (POSTER)', team: data.winner_team  },
  ];

  const ids = [];
  specs.forEach(s => (s.team && s.team.players || []).forEach(p => ids.push(p.player_id)));
  const ctx = await peFetchContext(matchday, ids);
  await capCargarEquipos();
  await capCargarSuplentes(matchday, ids);
  await capCargarEscritos();
  if (token !== ptRenderToken) return;

  specs.forEach(spec => {
    if (!spec.team || !(spec.team.players || []).length) return;
    const lineup = peBuildLineup(spec.team, ctx);

    const section = document.createElement('div');
    section.className = 'match-section';
    section.innerHTML = `<h3>${spec.title}<span class="pe-formation">${gnEscape(lineup.formation)}</span></h3>`;
    const row = document.createElement('div');
    row.className = 'cards-row cap-fila';
    const card = buildPitchCard(spec.kind, matchday, spec.team, lineup);
    row.appendChild(createCardWrapper(card, card.dataset.filename));
    // Las cajas de texto van al lado de la placa, no debajo: se copia el texto
    // mirando el flyer.
    row.appendChild(capPanel(spec.kind, matchday, spec.team, lineup));
    section.appendChild(row);
    section.appendChild(peReportEl(lineup));
    container.appendChild(section);
  });
}

// MVPs DE LA FECHA / SUPER SUPLENTES
// Both are a ranked top-5 over `v_fantasy_player_match_points`, which is
// anon-readable and — unlike get_matchday_recap's top_players, which the
// server rounds to 1dp — carries the unrounded score the design prints to
// two decimals, plus the is_starter flag the suplentes cut needs.
// ══════════════════════════════════════════════════════════════════════

const MV_VIEW = 'v_fantasy_player_match_points';

async function mvFetchTop(matchday, opts) {
  let q = db.from(MV_VIEW)
    .select('player_id, player_name, position_code, jersey_number, team_id, total_points, is_starter, normalized_minutes')
    .eq('competition_id', currentComp)
    .eq('season_id', currentSeason)
    .eq('matchday', matchday)
    .order('total_points', { ascending: false })
    .limit(opts.limit || 5);
  if (opts.benchOnly) q = q.eq('is_starter', false);
  const { data, error } = await q;
  if (error) throw error;
  return data || [];
}

/** The design prints two decimals with a comma ("23,77"). */
function mvFormatPts(v, dec) {
  return (Number(v) || 0).toFixed(dec == null ? 2 : dec).replace('.', ',');
}

// ── Jersey kit data (PORT-OF the app's canchita look) ──
// Per team: kit slug + chest-number colors from public.teams, and which kit
// the club ACTUALLY wore that fecha per OPTA F9 (get_fecha_kits over
// winning_lpf.match_kits) — kit_type 'home' draws the titular art, anything
// else ('away'/'third') the suplente art. Venue (v_fixtures home_id/away_id)
// is only the fallback guess for clubs with no worn-kit row yet (pre-kickoff
// or feed silence): clubs wear away kits at home and home kits away, so a
// real worn-kit row always wins over venue. Failure of the teams query must
// not lose the card: rows fall back to the legacy badge rendering.
async function mvFetchKits(matchday, teamIds) {
  if (!teamIds.length) return {};
  const seasonPartId = currentComp + '-' + currentSeason;
  const [wornRes, fixturesRes, teamsRes] = await Promise.all([
    db.rpc('get_fecha_kits', { p_season_part_id: seasonPartId, p_matchday: matchday })
      .then(res => (res.error ? null : res.data)).catch(() => null),
    db.from('v_fixtures')
      .select('home_id, away_id')
      .eq('competition_id', currentComp)
      .eq('season_id', currentSeason)
      .eq('matchday', matchday)
      .then(res => (res.error ? { data: [] } : res)).catch(() => ({ data: [] })),
    db.from('teams')
      .select('id, jersey_slug, jersey_number_color, jersey_stroke_color')
      .in('id', teamIds),
  ]);
  if (teamsRes.error) throw teamsRes.error;

  const worn = {};
  const wornColors = {};
  if (wornRes && wornRes.success === true && Array.isArray(wornRes.kits)) {
    wornRes.kits.forEach(k => {
      if (worn[k.team_id] === undefined) {
        worn[k.team_id] = k.kit_type === 'home' ? 'home' : 'alt';
        // Chest-number colors FOR THE KIT WORN, resolved server-side exactly
        // as the app does (home -> teams, alt -> the kit_alt collectibles
        // catalog). NULL stroke is a deliberate flat number.
        wornColors[k.team_id] = { number: k.number_color, stroke: k.stroke_color };
      }
    });
  } else {
    console.warn('get_fecha_kits unavailable — kit choice falls back to venue inference');
  }

  const side = {};
  (fixturesRes.data || []).forEach(f => {
    if (side[f.home_id] === undefined) side[f.home_id] = 'home';
    if (side[f.away_id] === undefined) side[f.away_id] = 'alt';
  });

  const kits = {};
  (teamsRes.data || []).forEach(t => {
    // Slug feeds an <img src> AND an inline onerror JS string, where
    // HTML-escaping alone can't protect the JS context — allowlist it the
    // way mvSafeHex does for colors (all 30 live slugs are [a-z0-9-]+).
    // Anything else keeps the badge rendering.
    if (!t.jersey_slug || !/^[a-z0-9-]+$/.test(t.jersey_slug)) return;
    // Worn-kit rows carry their own kit-correct colors; the teams columns
    // color only the fallback paths (no worn row -> home kit + home colors).
    const wc = wornColors[t.id];
    const numberColor = wc ? wc.number : t.jersey_number_color;
    const strokeColor = wc ? wc.stroke : t.jersey_stroke_color;
    kits[t.id] = {
      slug:        t.jersey_slug,
      kit:         worn[t.id] || side[t.id] || 'home',
      numberColor: mvSafeHex(numberColor, '#1D3A8C'),
      // NULL stroke is deliberate (some kits render the number flat) — never
      // substitute a default outline. App contract: JerseyKit.
      strokeColor: strokeColor ? mvSafeHex(strokeColor, null) : null,
    };
  });
  return kits;
}

// No client-side contrast correction: the kit-correct colors from
// get_fecha_kits (teams for home, kit_alt catalog for away/third) are the
// app's own answer to legibility. If a number reads badly, fix the catalog.

/** Only ever emit a #hex the CSS can't be broken/injected by. */
function mvSafeHex(v, fallback) {
  const s = String(v || '').trim().replace(/^#/, '');
  return /^[0-9A-Fa-f]{3}$|^[0-9A-Fa-f]{6}$/.test(s) ? '#' + s : fallback;
}

/** Missing alt art falls back to the home kit (app contract), then hides. */
function mvKitImgFallback(img, slug) {
  if (img.dataset.fell !== '1' && img.src.indexOf('/alt/') !== -1) {
    img.dataset.fell = '1';
    img.src = 'jerseys/' + slug + '.png';
  } else {
    img.style.display = 'none';
  }
}

// PORT-OF ds/JerseyKit + ds/OutlinedNumber — the app's EXACT number stack on
// the 140px-wide kit: 1-digit chest number 0.6x width, 2-digit 0.5x with
// 0.03x tracking and the half-tracking recentre (letter-spacing trails the
// last glyph too, in RN and CSS alike); lineHeight ceil(1.3x) so ascenders
// don't clip; stroke = 8 glyph copies offset by max(0.4, 0.012 x width) in
// the strokeOffsets token directions + one aligned stroke-color underlay
// (strokeUnderlay) so the collegiate font's inline slits read solid; fill
// copy on top. NULL stroke renders flat — zero copies, no default outline.
const MV_STROKE_OFFSETS = [
  { x: -1, y: 0 }, { x: 1, y: 0 }, { x: 0, y: -1 }, { x: 0, y: 1 },
  { x: -1, y: -1 }, { x: 1, y: -1 }, { x: -1, y: 1 }, { x: 1, y: 1 },
];

/* La camiseta que usó el equipo esa fecha (get_fecha_kits) con el dorsal
   dibujado como el componente de camiseta de Figma: Alumni 110px, tracking
   9%, borde OUTSIDE con los colores de cada club (RN_DORSAL), escalado a la
   caja de 140. Reemplaza al port de ds/JerseyKit del app, que dibujaba el
   número más chico y con otras reglas que las del diseño. */
function mvKitHtml(p, kit) {
  return '<div class="mv-kit">' + rnKitHtml(kit, p.team_id, p.jersey_number) + '</div>';
}

function mvBadgeHtml(p) {
  const badge = p.team_id
    ? `<img src="badges/${p.team_id}.png" onerror="this.style.display='none'">`
    : '';
  const num = (p.jersey_number === null || p.jersey_number === undefined)
    ? '' : `<div class="mv-club-num">${gnEscape(p.jersey_number)}</div>`;
  return `<div class="mv-club-badge">${badge}${num}</div>`;
}

function mvRowHtml(p, i, kits, dec) {
  const name = ptSplitName(p.player_name, false);
  const pos  = (p.position_code || 'VOL').toUpperCase();
  const rankClass = i < 3 ? 'mv-rank-' + (i + 1) : 'mv-rank-x';
  const top = 205.2 + i * 213;   // Figma (template top 5): filas en 205,2 / 418,2 / 631,2 / 844,2…

  const kit = kits && p.team_id != null ? kits[p.team_id] : null;
  const club = kit ? mvKitHtml(p, kit) : mvBadgeHtml(p);

  return `<div class="mv-row" style="top:${top}px;">` +
      `<div class="mv-rank ${rankClass}">${i + 1}°</div>` +
      `<div class="mv-photo">${fotoImgHtml(p.player_id, 'mv-foto')}</div>` +
      `<div class="mv-name${ptNameClass(name.surname)}"><span>${gnEscape(name.first)}</span>` +
        `<b>${gnEscape(name.surname)}</b></div>` +
      `<div class="mv-club">` +
        club +
        `<div class="mv-pos mv-pos-${pos.toLowerCase()}">${gnEscape(pos)}</div>` +
      `</div>` +
      `<div class="mv-pts"><span class="mv-pts-n">${gnEscape(mvFormatPts(p.total_points, dec))}</span>` +
        `<span class="mv-pts-u">PTS.</span></div>` +
    `</div>`;
}

/* Both cards start at the SAME display size; mvFitTitle shrinks whichever one
   needs it. A hardcoded 62px for the longer title inverted the DE/LA ratio
   (0.48 vs 0.33) and made the smaller type produce the wider block. */
const MV_TITLE_MAX_W = 994;
const MV_SPECS = {
  mvp:      { big: 'MVPs',            bigSize: 124, file: 'mvps' },
  suplente: { big: 'SÚPER SUPLENTES', bigSize: 124, file: 'super_suplentes' },
};

/** Scale a title block down until it fits the row width. Strokes and shadows
 *  are em-based, so they scale with it and the outline weight stays on-system. */
const MV_NAME_MAX_W = 246;   // de x=348 del nombre a x=604 de la etiqueta de posición, menos 10 de aire
function mvFitNames(card) {
  const scale = (card.getBoundingClientRect().width / 1080) || 1;
  card.querySelectorAll('.mv-name span, .mv-name b').forEach(el => {
    el.style.fontSize = '';
    const r = document.createRange(); r.selectNodeContents(el);
    const w = r.getBoundingClientRect().width / scale;
    if (w > MV_NAME_MAX_W) el.style.fontSize = Math.max(22, 47.4 * MV_NAME_MAX_W / w) + 'px';
  });
}

function mvFitTitle(card, maxW) {
  mvFitNames(card);   // todos los que dibujan una placa de filas pasan por acá después de insertarla
  // Título del template "top 5": "TOP 5" no se toca; se achican sólo los dos
  // renglones hasta entrar en los 475 px que tienen en el Figma.
  const lineas = card.querySelector('.mv-title.is-top5 .mv-title-lines');
  if (lineas) {
    const esc = (card.getBoundingClientRect().width / 1080) || 1;
    lineas.style.fontSize = '';
    const ancho = lineas.getBoundingClientRect().width / esc;
    if (ancho > 475) lineas.style.fontSize = (55.66 * 475 / ancho) + 'px';
    return;
  }
  maxW = maxW || MV_TITLE_MAX_W;
  const title = card.querySelector('.mv-title');
  const kids = [...title.children];
  if (!kids.length) return;
  // The card is rendered at preview scale, so MEASUREMENTS need undoing by that
  // factor — but getComputedStyle returns unscaled CSS px, so font sizes must
  // NOT be divided by it (doing so inflated 124px to 356px).
  const scale = (card.getBoundingClientRect().width / 1080) || 1;
  const left  = Math.min(...kids.map(k => k.getBoundingClientRect().left));
  const right = Math.max(...kids.map(k => k.getBoundingClientRect().right));
  const w = (right - left) / scale;
  if (w <= maxW) return;
  const k = maxW / w;
  kids.forEach(el => {
    el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * k) + 'px';
  });
  title.style.gap = ((title.classList.contains('is-top5') ? 35 : 31) * k) + 'px';
}

function buildMvpCard(kind, matchday, rows, kits, titulo) {
  // titulo (opcional): { big, small, fecha, file } pisa el título del spec.
  // Lo usa la placa "Top 5 del partido"; sin titulo es la placa de siempre.
  const spec = Object.assign({}, MV_SPECS[kind], titulo || {});
  const card = document.createElement('div');
  card.className = 'card card-mvp';
  card.dataset.exportW  = '1080';
  card.dataset.exportH  = '1350';
  card.dataset.filename = titulo && titulo.file ? titulo.file : spec.file + '_fecha' + matchday;

  // Comp measures DE/LA at 0.46 of the display size; deriving it keeps the two
  // cards in proportion instead of pinning it to a fixed px.
  const smallSize = Math.round(spec.bigSize * 0.46);

  // titulo.lineas = ['CLAUSURA 2026', 'ESTUDIANTES']: título del template "top 5"
  // del Figma ("TOP 5" grande + dos renglones). Sin lineas, el título de siempre.
  const tituloHtml = spec.lineas
    ? '<div class="mv-title is-top5">' +
        `<div class="mv-title-big">${gnEscape(spec.big)}</div>` +
        `<div class="mv-title-lines"><div>${gnEscape(spec.lineas[0] || '')}</div><div>${gnEscape(spec.lineas[1] || '')}</div></div>` +
      '</div>'
    : '<div class="mv-title">' +
        `<div class="mv-title-big" style="font-size:${spec.bigSize}px;">${spec.big}</div>` +
        (spec.small === '' ? '' : `<div class="mv-title-small" style="font-size:${smallSize}px;">${spec.small || 'DE<br>LA'}</div>`) +
        `<div class="mv-title-fecha" style="font-size:${spec.bigSize}px;">${spec.fecha || 'FECHA ' + matchday}</div>` +
      '</div>';

  card.innerHTML =
    '<div class="mv-bg"></div>' +
    tituloHtml +
    rows.map((p, i) => mvRowHtml(p, i, kits, spec.dec)).join('') +
    '<img class="mv-wordmark" src="icons/wordmark-original.png" alt="">';

  if (spec.color) mvFondoEquipo(card, spec.color);
  return card;
}

/* Fondo del template "top 5": los mismos hexágonos del póster (icons/bg-ganador.svg,
   1620 x 2308 puesto en x=-269 / y=-610) con el color del club en vez del celeste y
   blanco en vez del azul, más un velo negro al 30 %. */
let mvHexSvg = null;
async function mvFondoEquipo(card, color) {
  try {
    if (!mvHexSvg) mvHexSvg = await (await fetch('icons/bg-ganador.svg')).text();
    const svg = mvHexSvg.replace(/#C8D9F0/gi, color).replace(/#A2BFE8/gi, '#ffffff');
    const bg = card.querySelector('.mv-bg');
    bg.style.backgroundImage = 'linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.3)), url("data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))) + '")';
    bg.style.backgroundSize = 'auto, 1618px 2305.2px';
    bg.style.backgroundPosition = '0 0, -269px -610px';
    bg.style.backgroundRepeat = 'no-repeat';
  } catch (e) { console.warn('fondo del club', e); }
}

/* Nombre del club como va en un título (el template dice "ESTUDIANTES", no
   "ESTUDIANTES DE LA PLATA"). Lo que no está acá sale con el nombre completo;
   igual se puede escribir a mano en "renglón 2". */
const TOP5_NOMBRE_TITULO = {
  'estudiantes de la plata': 'ESTUDIANTES', 'estudiantes de rio iv': 'ESTUDIANTES RC', 'velez sarsfield': 'VÉLEZ', "newell's old boys": "NEWELL'S",
  'argentinos juniors': 'ARGENTINOS', 'boca juniors': 'BOCA', 'river plate': 'RIVER', 'racing club': 'RACING',
  'independiente rivadavia': 'INDEP. RIVADAVIA', 'gimnasia de mendoza': 'GIMNASIA MZA', 'gimnasia lp': 'GIMNASIA LP', 'atletico tucuman': 'ATL. TUCUMÁN',
};
function top5NombreTitulo(nombre) {
  const k = String(nombre || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  return TOP5_NOMBRE_TITULO[k] || String(nombre || '').toUpperCase();
}

/* Dos campos para escribir los renglones del título del template "top 5". */

}

// ══════════════════════════════════════════════════════════════════════
// RANKING DE GOLEADORES (componente de 322x464)
// Goles reales del torneo hasta la fecha elegida: goal_events de los
// partidos de v_fixtures, sin los goles en contra. Empates: menos penales
// primero. Nombre y equipo: el último partido del jugador en la vista de
// puntos. Se exporta a 3x para pegarla en otra pieza.
// ══════════════════════════════════════════════════════════════════════
async function glCargar(matchday) {
  const fixR = await db.from('v_fixtures').select('game_id').eq('competition_id', currentComp).eq('season_id', currentSeason).lte('matchday', matchday);
  const ids = (fixR.data || []).map(f => f.game_id);
  if (!ids.length) return [];
  const goles = [];
  for (let i = 0; i < ids.length; i += 60) {   // lotes: la URL no aguanta 150 ids
    const r = await db.schema('winning_lpf').from('goal_events').select('scorer_player_id, goal_type').in('game_id', ids.slice(i, i + 60));
    if (r.error) throw r.error;
    goles.push(...(r.data || []));
  }
  const por = {};
  goles.forEach(g => {
    if (!g.scorer_player_id || g.goal_type === 'Own') return;
    const p = por[g.scorer_player_id] = por[g.scorer_player_id] || { player_id: g.scorer_player_id, goles: 0, penales: 0 };
    p.goles++; if (g.goal_type === 'Penalty') p.penales++;
  });
  const top = Object.values(por).sort((a, b) => b.goles - a.goles || a.penales - b.penales).slice(0, 8);
  if (!top.length) return [];
  const nomR = await db.from(MV_VIEW).select('player_id, player_name, team_id, matchday')
    .eq('competition_id', currentComp).eq('season_id', currentSeason).in('player_id', top.map(p => p.player_id)).order('matchday', { ascending: false });
  const info = {};
  (nomR.data || []).forEach(r => { if (!info[r.player_id]) info[r.player_id] = r; });
  const sinNombre = top.filter(p => !info[p.player_id]).map(p => p.player_id);
  if (sinNombre.length) {
    const puR = await db.schema('winning_lpf').from('player_universe').select('player_id, known_name, first_name, last_name').in('player_id', sinNombre);
    (puR.data || []).forEach(r => { info[r.player_id] = { player_name: r.known_name || ((r.first_name || '') + ' ' + (r.last_name || '')).trim(), team_id: null }; });
  }
  return top.map(p => ({ ...p, nombre: (info[p.player_id] || {}).player_name || '', team_id: (info[p.player_id] || {}).team_id || null }))
    .sort((a, b) => b.goles - a.goles || a.penales - b.penales || a.nombre.localeCompare(b.nombre)).slice(0, 5);
}

// FICHA DE JUGADOR DESTACADO (322x486)
// Elegís el jugador (buscador por nombre o los mejores de la fecha) y las
// cuatro líneas de estadísticas. Los números son del torneo completo hasta
// hoy: player_match_stats de los partidos de v_fixtures + puntos de la vista.
// ══════════════════════════════════════════════════════════════════════
const FD_STATS = [
  ['pj', 'Partidos Jugados', s => s.pj], ['titular', 'Titular', s => s.game_started], ['min', 'Minutos Jugados', s => s.mins_played],
  ['goles', 'Goles', s => s.goals], ['asist', 'Asistencias', s => s.goal_assist], ['pen', 'Goles de Penal', s => s.att_pen_goal],
  ['cabeza', 'Goles de Cabeza', s => s.att_headed_goal], ['tl', 'Goles de Tiro Libre', s => s.att_freekick_goal], ['gt', 'Goles del Triunfo', s => s.winning_goal],
  ['remates', 'Remates', s => s.total_scoring_att], ['alarco', 'Remates al Arco', s => s.ontarget_scoring_att], ['clave', 'Pases Clave', s => s.total_att_assist],
  ['chances', 'Grandes Chances Creadas', s => s.big_chance_created], ['pases', 'Pases Completados', s => s.accurate_pass],
  ['ppct', '% de Pases', s => s.total_pass ? Math.round(100 * s.accurate_pass / s.total_pass) + '%' : '-'],
  ['regates', 'Regates Exitosos', s => s.won_contest], ['recup', 'Recuperaciones', s => s.ball_recovery], ['inter', 'Intercepciones', s => s.interception_won],
  ['quites', 'Quites Ganados', s => s.won_tackle], ['despejes', 'Despejes', s => s.effective_clearance], ['duelos', 'Duelos Ganados', s => s.duel_won],
  ['aereos', 'Duelos Aéreos Ganados', s => s.aerial_won], ['recibidas', 'Faltas Recibidas', s => s.was_fouled], ['faltas', 'Faltas Cometidas', s => s.fouls],
  ['penganados', 'Penales Ganados', s => s.penalty_won], ['amarillas', 'Amarillas', s => s.yellow_card], ['rojas', 'Rojas', s => s.red_card + s.second_yellow],
  ['atajadas', 'Atajadas', s => s.saves], ['recibidos', 'Goles Recibidos', s => s.goals_conceded], ['valla', 'Vallas Invictas', s => s.valla],
  ['pts', 'Puntos Winning', s => fjPuntos(s.pts)], ['prom', 'Promedio de Puntos', s => s.pj ? fjPuntos(s.pts / s.pj) : '-'], ['mejor', 'Mejor Puntaje', s => fjPuntos(s.mejor)],
];
const FD_CAMPOS = 'game_id, mins_played, game_started, goals, goal_assist, att_pen_goal, att_headed_goal, att_freekick_goal, winning_goal, total_scoring_att, ontarget_scoring_att, total_att_assist, big_chance_created, accurate_pass, total_pass, won_contest, ball_recovery, interception_won, won_tackle, effective_clearance, duel_won, aerial_won, was_fouled, fouls, penalty_won, yellow_card, red_card, second_yellow, saves, goals_conceded';
const FD_KEY = 'winning.recap.fd.lineas';
let fdFixturesCache = {};

async function fdFixtures() {
  const clave = currentComp + '-' + currentSeason;
  if (fdFixturesCache[clave]) return fdFixturesCache[clave];
  const { data } = await db.from('v_fixtures').select('game_id').eq('competition_id', currentComp).eq('season_id', currentSeason);
  return (fdFixturesCache[clave] = new Set((data || []).map(f => f.game_id)));
}
/* Todas las estadísticas del jugador en el torneo, sumadas. */
async function fdCargarStats(playerId) {
  const juegos = await fdFixtures();
  const [pmsR, ptsR] = await Promise.all([
    db.schema('winning_lpf').from('player_match_stats').select(FD_CAMPOS).eq('player_id', playerId),
    db.from(MV_VIEW).select('total_points, matchday').eq('competition_id', currentComp).eq('season_id', currentSeason).eq('player_id', playerId),
  ]);
  const s = { pj: 0, valla: 0, pts: 0, mejor: 0 };
  FD_CAMPOS.split(', ').forEach(c => { if (c !== 'game_id') s[c] = 0; });
  (pmsR.data || []).filter(r => juegos.has(r.game_id)).forEach(r => {
    // Un partido recién cargado puede venir con minutos en null pero con goles
    // y pases: cuenta si tiene algún dato. Sólo se descarta el que jugó 0'.
    const jugo = r.mins_played > 0 || (r.mins_played == null && Object.keys(r).some(c => c !== 'game_id' && Number(r[c]) > 0));
    if (!jugo) return;
    s.pj++;
    if (!r.goals_conceded) s.valla++;
    Object.keys(r).forEach(c => { if (c !== 'game_id' && typeof s[c] === 'number') s[c] += Number(r[c]) || 0; });
  });
  (ptsR.data || []).forEach(r => { const p = Number(r.total_points) || 0; s.pts += p; if (p > s.mejor) s.mejor = p; });
  return s;
}
function fdLineas() { let l = null; try { l = JSON.parse(localStorage.getItem(FD_KEY)); } catch (e) {} return Array.isArray(l) && l.length === 4 ? l : ['pj', 'goles', 'asist', 'min']; }

  return el;
