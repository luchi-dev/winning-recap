// ── CARD 3: MEJORES 5 JUGADORES ──
function buildCard3(match, matchday) {
  const card = document.createElement('div');
  card.className = 'card card-fantasy';

  // Row Y positions from Figma spec
  const rowTops = [492, 589.14, 685.61, 782.27, 879.23];

  // Format name as "SURNAME, Firstname"
  // known_name format is "FirstName LastName(s)" (e.g. "Santiago López García")
  function formatName(fullName) {
    const parts = fullName.trim().split(' ');
    if (parts.length === 1) return `<span class="player-name-last">${parts[0].toUpperCase()}</span>`;
    const firstName = parts[0];
    const lastName = parts.slice(1).join(' ');
    return `<span class="player-name-last">${lastName.toUpperCase()},</span> <span class="player-name-first">${firstName}</span>`;
  }

  const playersHtml = (match.top_players || []).map((p, i) => {
    const team = p.team_id === match.home_team.id ? match.home_team : match.away_team;
    const jerseyNumColor = '#' + (team.jersey_number_color || 'FFFFFF');
    const jerseyStrokeColor = '#' + (team.jersey_stroke_color || '000000');
    const posClass = 'pos-' + (p.position_code || 'vol').toLowerCase();
    const topPx = rowTops[i] || (492 + i * 97);

    // 8-direction text-shadow for jersey stroke (2px weight for visibility at this size)
    const sw = 2;
    const stroke = [
      [-sw,0],[sw,0],[0,-sw],[0,sw],[-sw,-sw],[sw,-sw],[-sw,sw],[sw,sw],
      [-sw,0,1],[sw,0,1],[0,-sw,1],[0,sw,1]
    ].map(([x,y,b]) => `${x}px ${y}px ${b||0}px ${jerseyStrokeColor}`).join(',');

    // Event icons (using app PNGs)
    let events = '';
    const e = p.events;
    const nonPenGoals = e.goals - (e.penalty_goals || 0);
    for (let g = 0; g < nonPenGoals; g++) events += `<img class="ev-icon" src="icons/goal.png">`;
    for (let g = 0; g < (e.penalty_goals || 0); g++) events += `<img class="ev-icon" src="icons/pengoal.png">`;
    for (let a = 0; a < e.assists; a++) events += `<img class="ev-icon" src="icons/assist.png">`;
    for (let y = 0; y < e.yellow_cards; y++) events += `<img class="ev-icon" src="icons/yellow-card.png">`;
    if (e.red_cards > 0) events += `<img class="ev-icon" src="icons/red-card.png">`;
    // El penal atajado no lleva ícono (a Luchi no le gusta icons/saved.png, 22-sep-2026).
    for (let og = 0; og < e.own_goals; og++) events += `<img class="ev-icon" src="icons/own-goal.png">`;

    return `
      <div class="player-row" style="top:${topPx}px;">
        <div class="pos-badge ${posClass}">${p.position_code}</div>
        <div class="jersey-badge" style="background:#${team.primary_color || '333'};">
          <img src="badges/${team.id}.png" onerror="this.style.display='none'">
          <span class="jersey-num" style="color:${jerseyNumColor}; text-shadow:${stroke};">${p.shirt_number}</span>
        </div>
        <div class="player-name">${formatName(p.name)}</div>
        <div class="ev-badges">${events}</div>
        <div class="rating-badge" style="background:${getPointTierColor(p.total_points)};">${p.total_points}</div>
      </div>
    `;
  }).join('');

  // Build bg-image div
  const bgImg = document.createElement('div');
  bgImg.className = 'bg-image';
  if (bgDataUrl) {
    bgImg.style.backgroundImage = `url(${bgDataUrl})`;
    bgImg.style.display = 'block';
  }
  card.appendChild(bgImg);

  card.innerHTML += `
    <div class="bg-overlay"></div>
    <div class="winning-logo">${WINNING_LOGO_HTML}</div>

    <div class="fan-subtitle">MEJORES 5 JUGADORES</div>
    <div class="fan-match-title">${match.home_team.name} VS ${match.away_team.name}</div>

    ${playersHtml}

    <div class="card-footer-text">ENCONTRÁ ESTOS Y MUCHOS MÁS DATOS DEL PARTIDO EN LA APP DE WINNING</div>
  `;

  return card;
}

// ── Background Upload ──
function handleBgUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    bgDataUrl = e.target.result;
    document.querySelectorAll('.bg-image').forEach(el => {
      el.style.backgroundImage = `url(${bgDataUrl})`;
      el.style.display = 'block';
    });
  };
  reader.readAsDataURL(file);
}

// Points tier color (matches mobile app PointsBadge tiers)
function getPointTierColor(points) {
  if (points === null || points === undefined) return '#999999';
  if (points < 0) return '#FFB5C0';
  if (points === 0) return '#CCCCCC';
  if (points >= 25) return '#1E4F91';
  if (points >= 20) return '#2F69B3';
  if (points >= 15) return '#4D82C5';
  if (points >= 10) return '#6E99D1';
  return '#92B1DC';
}

// ── Equipo Ideal ──
/* `clase` permite reusar la misma lista en las fichas individuales (ev-icon) y
   en el chip del poster (pp-ev), que necesitan tamanos distintos. */
function buildEventIconsHtml(events, clase) {
  if (!events) return '';
  const e = events;
  const c = clase || 'ev-icon';
  let out = '';
  // Todos los goles con la misma pelota. Antes el de penal usaba icons/pengoal.png,
  // que es la pelota oscura: sobre el chip negro del poster quedaba apagada y la
  // distincion no sumaba nada.
  for (let i = 0; i < (e.goals || 0); i++) out += `<img class="${c}" src="icons/goal.png">`;
  for (let i = 0; i < (e.assists || 0); i++) out += `<img class="${c}" src="icons/assist.png">`;
  for (let i = 0; i < (e.yellow_cards || 0); i++) out += `<img class="${c}" src="icons/yellow-card.png">`;
  if ((e.red_cards || 0) > 0) out += `<img class="${c}" src="icons/red-card.png">`;
  // El penal atajado no lleva ícono (a Luchi no le gusta icons/saved.png, 22-sep-2026).
  for (let i = 0; i < (e.own_goals || 0); i++) out += `<img class="${c}" src="icons/own-goal.png">`;
  return out;
}

// GANADORES DE LA FECHA
// Top 3 fantasy + top 3 prode for one fecha, as a 1080x1350 poster.
// Design: Figma node 356:3337 (file yBWeKejIuQFR4rAa6Q7A5U).
//
// Data comes from three anon-readable RPCs, no new backend surface:
//   tournaments.get_global_leaderboard_round     -> fantasy top 3
//   predictions.get_prediction_leaderboard_round -> prode top 3
//   public.get_user_full_profile                 -> username + supported club
// The leaderboard rows already carry the crest config and team name; only the
// @handle and "Hincha de X" line need the profile round-trip.
// ══════════════════════════════════════════════════════════════════════

function gnEscape(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── Prize ladder ──
// Prize AMOUNTS are a marketing decision that changes per fecha and lives
// nowhere in the DB, so they are UI inputs persisted to this browser. Amounts
// are the BASE prize (the published flyer table): a Pass* row renders the
// double automatically, so the marketer never hand-doubles.
//
// The TIER is NOT a marketing decision — the x2 pays only when the winner had
// the Winning Pass BEFORE the fecha's first kickoff (reglamento §15, the same
// premium.user_subscriptions check the winner emails run). 'Auto' (default)
// reads that verdict from public.get_ganadores_pass_status; the manual values
// remain as an explicit founder override for dispute cases — but an override
// is a fact about ONE fecha, so it is stored per fecha (tiersByFecha) and can
// never leak into another fecha's card.
const GN_DEFAULT_CONFIG = {
  pot: '$1.000.000',
  fantasy: [
    { prize: '200k', tier: 'Auto' },
    { prize: '75k',  tier: 'Auto' },
    { prize: '25k',  tier: 'Auto' },
  ],
  prode: [
    { prize: '100k', tier: 'Auto' },
    { prize: '60k',  tier: 'Auto' },
    { prize: '40k',  tier: 'Auto' },
  ],
  tiersByFecha: {},
};
// v2: v1 stored hand-doubled amounts + manual tiers; loading them under the
// base-amount/auto-tier semantics would double-double a prize. Fresh key.
// v3: v2 stored ONE global tier per slot, so an override set while exporting
// one fecha silently repainted every other fecha (the published fecha-4 card
// inherited fecha 3's Pass* rows exactly this way). v3 scopes tiers per fecha;
// migration keeps v2's amounts and deliberately DROPS its global tiers.
const GN_STORE_KEY = 'winning.recap.ganadores.v3';
const GN_LEGACY_V2_KEY = 'winning.recap.ganadores.v2';
const GN_TIERS = ['Auto', 'Básico', 'Pass*'];

function gnLoadConfig() {
  const base = () => JSON.parse(JSON.stringify(GN_DEFAULT_CONFIG));
  const takePrizes = (cfg, saved) => {
    cfg.pot = saved.pot || cfg.pot;
    ['fantasy', 'prode'].forEach(mode => {
      (saved[mode] || []).forEach((s, i) => {
        if (cfg[mode][i] && s && s.prize != null) cfg[mode][i].prize = s.prize;
      });
    });
  };
  try {
    const raw = localStorage.getItem(GN_STORE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const cfg = base();
      takePrizes(cfg, saved);
      const map = saved.tiersByFecha;
      if (map && typeof map === 'object') {
        Object.keys(map).forEach(k => {
          const t = map[k] || {};
          cfg.tiersByFecha[k] = {
            fantasy: [0, 1, 2].map(i => GN_TIERS.includes((t.fantasy || [])[i]) ? t.fantasy[i] : 'Auto'),
            prode:   [0, 1, 2].map(i => GN_TIERS.includes((t.prode   || [])[i]) ? t.prode[i]   : 'Auto'),
          };
        });
      }
      return cfg;
    }
    const rawV2 = localStorage.getItem(GN_LEGACY_V2_KEY);
    if (rawV2) {
      // Amounts survive the migration; v2's fecha-agnostic tiers do not — they
      // are exactly the stale state that mislabeled the fecha-4 card.
      const cfg = base();
      takePrizes(cfg, JSON.parse(rawV2));
      return cfg;
    }
  } catch (e) { /* unavailable or corrupt storage: fall through to defaults */ }
  return base();
}
function gnSaveConfig() {
  // The slots' in-memory `tier` is a view of the CURRENT fecha (gnSyncTiersToFecha);
  // only the per-fecha map is persisted, so tiers can never be read back unscoped.
  try {
    localStorage.setItem(GN_STORE_KEY, JSON.stringify({
      pot:          gnConfig.pot,
      fantasy:      gnConfig.fantasy.map(s => ({ prize: s.prize })),
      prode:        gnConfig.prode.map(s => ({ prize: s.prize })),
      tiersByFecha: gnConfig.tiersByFecha,
    }));
  } catch (e) {}
}

let gnConfig   = gnLoadConfig();
let gnData     = null;   // cached winners, so editing a prize re-renders without refetching
let gnMatchday = null;

function gnFechaKey() { return currentComp + '-' + currentSeason + ':' + gnMatchday; }

// Pull the on-screen fecha's tier overrides into the active slots (Auto when
// this fecha was never overridden). Runs on every fecha load — the mechanism
// that keeps one fecha's dispute override off every other fecha's card.
function gnSyncTiersToFecha() {
  const t = gnConfig.tiersByFecha[gnFechaKey()];
  ['fantasy', 'prode'].forEach(mode => gnConfig[mode].forEach((s, i) => {
    s.tier = t ? t[mode][i] : 'Auto';
  }));
}

// ── User escudo ──
// PORT-OF: winning-mobile/src/components/badge/UserBadge.tsx, via its web twin
// web/src/components/bracket/UserBadge.tsx. The pattern math is copied verbatim
// so the crest matches what the user sees in the app; only the frame (stroke +
// corner radius) takes the heavier proportions the Figma card draws.
const GN_PATTERNS = new Set([
  'solido', 'h2', 'h3', 'h4', 'h5', 'h6', 'h7', 'v2', 'v3', 'v4', 'v5', 'v6', 'v7',
  'g2x2', 'g3x3', 'g4x4', 'cruz', 'cruz_x', 'banda1', 'banda2', 'banda3', 'banda4',
]);
let gnEscudoSeq = 0;

function gnBands(size, p, s, n, vertical) {
  const step = size / n;
  let out = '';
  for (let i = 0; i < n; i++) {
    const fill = i % 2 === 0 ? p : s;
    out += vertical
      ? `<rect x="${i * step}" y="0" width="${step}" height="${size}" fill="${fill}"/>`
      : `<rect x="0" y="${i * step}" width="${size}" height="${step}" fill="${fill}"/>`;
  }
  return out;
}
function gnGrid(size, p, s, n) {
  const cell = size / n;
  let out = '';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      out += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}" fill="${(r + c) % 2 === 0 ? p : s}"/>`;
    }
  }
  return out;
}
function gnBanda(size, p, s, thick, fromRight) {
  const bw = size * (thick ? 0.4 : 0.25);
  const pts = fromRight
    ? `${size - bw},0 ${size},0 ${size},${bw} ${bw},${size} 0,${size} 0,${size - bw}`
    : `${bw},0 ${size},${size - bw} ${size},${size} ${size - bw},${size} 0,${bw} 0,0`;
  return `<rect x="0" y="0" width="${size}" height="${size}" fill="${p}"/>` +
         `<polygon points="${pts}" fill="${s}"/>`;
}
function gnPatternSvg(pattern, size, p, s) {
  if (pattern === 'solido') {
    const sw = size * 0.05, inset = size * 0.12, inner = size - inset * 2, r = size * 0.06;
    return `<rect x="0" y="0" width="${size}" height="${size}" fill="${p}"/>` +
      `<rect x="${inset}" y="${inset}" width="${inner}" height="${inner}" rx="${r}" ry="${r}" stroke="${s}" stroke-width="${sw}" fill="none"/>`;
  }
  if (pattern.charAt(0) === 'h') return gnBands(size, p, s, parseInt(pattern.slice(1), 10), false);
  if (pattern.charAt(0) === 'v') return gnBands(size, p, s, parseInt(pattern.slice(1), 10), true);
  if (pattern === 'g2x2') return gnGrid(size, p, s, 2);
  if (pattern === 'g3x3') return gnGrid(size, p, s, 3);
  if (pattern === 'g4x4') return gnGrid(size, p, s, 4);
  if (pattern === 'cruz') {
    const cw = size * 0.3, off = (size - cw) / 2;
    return `<rect x="0" y="0" width="${size}" height="${size}" fill="${p}"/>` +
      `<rect x="${off}" y="0" width="${cw}" height="${size}" fill="${s}"/>` +
      `<rect x="0" y="${off}" width="${size}" height="${cw}" fill="${s}"/>`;
  }
  if (pattern === 'cruz_x') {
    const half = size * 0.1;   // strokeWidth 20% of size, halved
    const d1 = `${half},0 ${size},${size - half} ${size},${size} ${size - half},${size} 0,${half} 0,0`;
    const d2 = `${size - half},0 ${size},0 ${size},${half} ${half},${size} 0,${size} 0,${size - half}`;
    return `<rect x="0" y="0" width="${size}" height="${size}" fill="${p}"/>` +
      `<polygon points="${d1}" fill="${s}"/><polygon points="${d2}" fill="${s}"/>`;
  }
  if (pattern === 'banda1') return gnBanda(size, p, s, false, false);
  if (pattern === 'banda2') return gnBanda(size, p, s, true,  false);
  if (pattern === 'banda3') return gnBanda(size, p, s, false, true);
  if (pattern === 'banda4') return gnBanda(size, p, s, true,  true);
  return '';
}
function gnEscudoSvg(badge, size) {
  const p = (badge && badge.primary_color)   || '#808080';
  const s = (badge && badge.secondary_color) || '#FFFFFF';
  const pattern = (badge && GN_PATTERNS.has(badge.pattern)) ? badge.pattern : 'solido';
  const stroke = size * 0.063;
  const radius = size * 0.118;
  const inner  = size - stroke;
  const id = 'gnEsc' + (++gnEscudoSeq);
  const frame = `x="${stroke / 2}" y="${stroke / 2}" width="${inner}" height="${inner}" rx="${radius}" ry="${radius}"`;
  // The pattern is clipped to the FULL outer box (outer corner radius), not to
  // the frame rect: clipping exactly at the frame's inner edge left a
  // rasterization seam between pattern and stroke — a white hairline ring in
  // the html-to-image export that read as "badge misaligned with white lines"
  // (CMO feedback, fecha 5). Clipped full-bleed, the pattern runs underneath
  // the whole stroke band and the frame paints over it seamlessly.
  const outerR = radius + stroke / 2;
  return `<svg class="gn-escudo" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">` +
    `<defs><clipPath id="${id}"><rect x="0" y="0" width="${size}" height="${size}" rx="${outerR}" ry="${outerR}"/></clipPath></defs>` +
    `<g clip-path="url(#${id})">${gnPatternSvg(pattern, size, p, s)}</g>` +
    `<rect ${frame} stroke="#000" stroke-width="${stroke}" fill="none"/>` +
    `</svg>`;
}

// ── Row shaping ──
// The headline is the fantasy team name, but a user who never renamed their
// team carries the auto-generated "Equipo de {username}", which reads as noise
// on a poster — those fall back to the username (what the design does on 4 of
// its 6 rows).
function gnHeadline(row, profile) {
  const team = (row.team_name || '').trim();
  const user = ((profile && profile.username) || row.display_name || '').trim();
  if (!team) return user.toUpperCase();
  if (user && team.toLowerCase() === 'equipo de ' + user.toLowerCase()) return user.toUpperCase();
  return team.toUpperCase();
}
function gnFormatPts(v) {
  const n = Number(v) || 0;
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

async function gnFetchWinners(matchday) {
  const seasonPartId = currentComp + '-' + currentSeason;

  const [fantasyRes, prodeRes, passRes] = await Promise.all([
    db.schema('tournaments').rpc('get_global_leaderboard_round', {
      p_season_part_id: seasonPartId, p_matchday: matchday, p_limit: 3, p_offset: 0,
    }),
    db.schema('predictions').rpc('get_prediction_leaderboard_round', {
      p_season_part_id: seasonPartId, p_matchday: matchday, p_limit: 3, p_offset: 0,
    }),
    // Server-verified "had the pass BEFORE the fecha's first kickoff" for these
    // same winners. Its failure must not lose the card: fail towards Básico
    // (never falsely paint gold) + a warning in the config panel.
    db.rpc('get_ganadores_pass_status', {
      p_season_part_id: seasonPartId, p_matchday: matchday,
    }).then(res => (res.error ? null : res.data)).catch(() => null),
  ]);
  if (fantasyRes.error) throw fantasyRes.error;
  if (prodeRes.error)   throw prodeRes.error;

  const passVerified = !!(passRes && Array.isArray(passRes.users));
  const passById = {};
  if (passVerified) {
    passRes.users.forEach(u => { passById[u.user_id] = u.had_pass_before_fecha === true; });
  } else {
    console.warn('get_ganadores_pass_status unavailable — Auto tiers fall back to Básico');
  }

  const fantasyRows = fantasyRes.data || [];
  const prodeRows   = prodeRes.data   || [];
  const allRows     = fantasyRows.concat(prodeRows);

  // A missing profile must not lose the winner — the card degrades to the
  // leaderboard's own display_name and drops the "Hincha de" line.
  const profiles = await Promise.all(allRows.map(r =>
    db.rpc('get_user_full_profile', { p_user_id: r.user_id, p_season_part_id: seasonPartId })
      .then(res => (res.error ? null : res.data))
      .catch(() => null)
  ));
  const byId = {};
  allRows.forEach((r, i) => { byId[r.user_id] = profiles[i]; });

  const shape = row => {
    const prof = byId[row.user_id];
    return {
      headline: gnHeadline(row, prof),
      handle:   '@' + ((prof && prof.username) || row.display_name || ''),
      club:     (prof && prof.supported_team_name) || null,
      points:   gnFormatPts(row.matchday_points),
      hadPass:  passVerified ? (passById[row.user_id] === true) : null,
      badge: {
        pattern:         row.badge_pattern,
        primary_color:   row.primary_color,
        secondary_color: row.secondary_color,
      },
    };
  };
  return {
    fantasy: fantasyRows.map(shape),
    prode:   prodeRows.map(shape),
    passVerified: passVerified,
  };
}

// A slot on 'Auto' takes the server verdict (null/unverified reads as Básico —
// never falsely gold); an explicit Básico/Pass* override always wins.
function gnResolveTier(winner, slot) {
  const t = slot.tier || 'Auto';
  if (t !== 'Auto') return t;
  return winner && winner.hadPass === true ? 'Pass*' : 'Básico';
}

// A Pass* row shows DOUBLE the configured base prize. Understands the formats
// the flyers actually use ('200k', '$1.000.000', '25000'); anything else is
// rendered untouched so a hand-written tie split ('20k c/u') survives.
/* "200k" -> 200000, "$1.000.000" -> 1000000, "1,5k" -> 1500.
   Devuelve null si no lo entiende, para poder avisar que el total esta
   incompleto en vez de mentir con un numero menor. */
function gnAMonto(v) {
  const t = String(v == null ? '' : v).trim();
  if (!t) return 0;
  let m = t.match(/^\$?\s*(\d+(?:[.,]\d+)?)\s*[kK]$/);
  if (m) return parseFloat(m[1].replace(',', '.')) * 1000;
  m = t.match(/^\$?\s*(\d{1,3}(?:\.\d{3})+|\d+)$/);
  if (m) return parseInt(m[1].replace(/\./g, ''), 10);
  return null;
}

/* Lo que realmente se paga: cada premio, duplicado donde corresponde. */
function gnTotalAPagar() {
  let total = 0, completo = true;
  ['fantasy', 'prode'].forEach(mode => {
    gnConfig[mode].forEach((slot, i) => {
      const base = gnAMonto(slot.prize);
      if (base == null) { completo = false; return; }
      const tier = gnResolveTier(gnData ? gnData[mode][i] : null, slot);
      total += tier === 'Pass*' ? base * 2 : base;
    });
  });
  return { total, completo };
}

function gnDoublePrize(v) {
  const s = String(v == null ? '' : v).trim();
  let m = s.match(/^(\$?\s*)(\d+(?:[.,]\d+)?)\s*([kK])$/);
  if (m) {
    const n = parseFloat(m[2].replace(',', '.')) * 2;
    return m[1] + (Number.isInteger(n) ? String(n) : String(n).replace('.', ',')) + m[3];
  }
  m = s.match(/^(\$?\s*)(\d{1,3}(?:\.\d{3})+|\d+)$/);
  if (m) {
    const hadDots = m[2].indexOf('.') !== -1;
    const n = parseInt(m[2].replace(/\./g, ''), 10) * 2;
    return m[1] + (hadDots ? n.toLocaleString('de-DE') : String(n));
  }
  return s;
}

// ── Card geometry (Figma 356:3337) ──
const GN_ROW_STEP = 225.18;
const GN_PILL_TOP = 400.55;
const GN_CARD_TOP = 467.3;
const GN_COL = {
  fantasy: { pillLeft: 76.46,  cardLeft: 38.93, pillH: 50.413 },
  prode:   { pillLeft: 599.84, cardLeft: 562.32, pillH: 57.671 },
};
const GN_CHIP_CLASS = ['gn-chip-gold', 'gn-chip-silver', 'gn-chip-bronze'];

function gnChipMark(mode) {
  return mode === 'fantasy'
    ? '<div class="gn-chip-mark gn-chip-mark-fantasy">' +
        '<img src="icons/chip-fantasy.svg" alt="">' +
        '<span class="gn-chip-word">FANTASY</span></div>'
    : '<div class="gn-chip-mark gn-chip-mark-prode">' +
        '<img src="icons/chip-prode-ball.svg" alt="">' +
        '<span class="gn-chip-word">PRODE</span></div>';
}

function gnRowHtml(mode, i, winner, slot) {
  const col     = GN_COL[mode];
  const pillTop = GN_PILL_TOP + i * GN_ROW_STEP;
  const cardTop = GN_CARD_TOP + i * GN_ROW_STEP;
  const tier    = gnResolveTier(winner, slot);
  const isPass  = tier === 'Pass*';
  const prize   = isPass ? gnDoublePrize(slot.prize) : slot.prize;

  const pill =
    `<div class="gn-pill ${isPass ? 'gn-pass' : 'gn-basico'}" ` +
         `style="left:${col.pillLeft}px; top:${pillTop}px; height:${col.pillH}px;">` +
      `<div class="gn-chip ${GN_CHIP_CLASS[i]}">${gnChipMark(mode)}` +
        `<div class="gn-chip-div"></div><div class="gn-chip-pos">${i + 1}°</div></div>` +
      `<div class="gn-prize">${gnEscape(prize)}</div>` +
      `<div class="gn-tier"><span class="gn-tier-drop">${gnEscape(tier)}</span>` +
        `<span class="gn-tier-outline gn-outlined">${gnEscape(tier)}</span>` +
        `<span class="gn-tier-fill">${gnEscape(tier)}</span></div>` +
    `</div>`;

  if (!winner) {
    return pill +
      `<div class="gn-winner" style="left:${col.cardLeft}px; top:${cardTop}px;">` +
        `<div class="gn-top"><div class="gn-id">` +
          `<div class="gn-name" style="color:#bbb;">SIN DATOS</div>` +
        `</div></div></div>`;
  }

  const card =
    `<div class="gn-winner" style="left:${col.cardLeft}px; top:${cardTop}px;">` +
      `<div class="gn-top">` +
        gnEscudoSvg(winner.badge, 41.637) +
        `<div class="gn-id">` +
          `<div class="gn-name">${gnEscape(winner.headline)}</div>` +
          `<div class="gn-handle">${gnEscape(winner.handle)}</div>` +
        `</div>` +
        `<div class="gn-pts"><span class="gn-pts-n">${gnEscape(winner.points)}</span>` +
          `<span class="gn-pts-u">PTS.</span></div>` +
      `</div>` +
      `<div class="gn-rule"></div>` +
      (winner.club ? `<div class="gn-club">Hincha de <b>${gnEscape(winner.club)}</b></div>` : '') +
    `</div>`;

  // Coin is emitted after the card so it paints on top of the corner.
  const coin = isPass
    ? `<div class="gn-coin" style="left:${col.cardLeft - 24.9}px; top:${cardTop - 21.3}px;">` +
        `<img class="gn-coin-disc" src="icons/pass-coin.svg" alt="">` +
        `<img class="gn-coin-mark" src="icons/pass-coin-mark.svg" alt="">` +
      `</div>`
    : '';

  return pill + card + coin;
}

function buildGanadoresCard(matchday, data, cfg) {
  const card = document.createElement('div');
  card.className = 'card card-ganadores';
  card.dataset.exportW  = '1080';
  card.dataset.exportH  = '1350';
  card.dataset.filename = 'ganadores_fecha' + matchday;

  let rows = '';
  for (let i = 0; i < 3; i++) {
    rows += gnRowHtml('fantasy', i, data.fantasy[i], cfg.fantasy[i]);
    rows += gnRowHtml('prode',   i, data.prode[i],   cfg.prode[i]);
  }

  card.innerHTML =
    '<div class="gn-bg"></div>' +
    '<div class="gn-plaque"></div>' +
    '<img class="gn-trophy" src="icons/trophy.svg" alt="">' +
    '<div class="gn-title">' +
      `<div class="gn-title-1">GANADORES Fecha ${matchday}</div>` +
      `<div class="gn-title-2">${gnEscape(cfg.pot)}</div>` +
    '</div>' +
    rows +
    '<div class="gn-note"><div class="gn-note-star">*</div>' +
      '<div class="gn-note-txt">PARA DUPLICAR TU PREMIO, DEBÉS OBTENER EL PASS ' +
      '<u>ANTES DEL COMIENZO DE LA FECHA. CONSEGUÍ TU PASS EN LA TIENDA</u></div></div>' +
    '<img class="gn-wordmark" src="icons/wordmark-original.png" alt="">';

  return card;
}

// ── Config panel + render loop ──
function gnSetPot(v)                { gnConfig.pot = v; gnSaveConfig(); gnRerender(); }
function gnSetSlot(mode, i, key, v) {
  gnConfig[mode][i][key] = v;
  if (key === 'tier') {
    const k = gnFechaKey();
    const t = gnConfig.tiersByFecha[k] ||
      { fantasy: ['Auto', 'Auto', 'Auto'], prode: ['Auto', 'Auto', 'Auto'] };
    t[mode][i] = v;
    if (t.fantasy.every(x => x === 'Auto') && t.prode.every(x => x === 'Auto')) {
      delete gnConfig.tiersByFecha[k];
    } else {
      gnConfig.tiersByFecha[k] = t;
    }
  }
  gnSaveConfig(); gnRerender();
  // Re-render the panel so the manual-override warning tracks the dropdowns.
  // Only on tier changes: rebuilding it mid-keystroke would blur the prize input.
  if (key === 'tier') renderGanadoresConfig();
}
function gnResetTiers() {
  delete gnConfig.tiersByFecha[gnFechaKey()];
  gnSyncTiersToFecha();
  gnSaveConfig(); renderGanadoresConfig(); gnRerender();
}

function renderGanadoresConfig() {
  const slot = (mode, i) => {
    const winner   = gnData ? gnData[mode][i] : null;
    const detected = winner && winner.hadPass === true ? 'Pass*' : 'Básico';
    const cur      = gnConfig[mode][i].tier || 'Auto';
    return '<div class="gn-config-row">' +
      `<label>${mode === 'fantasy' ? 'Fantasy' : 'Prode'} ${i + 1}°</label>` +
      `<input type="text" value="${gnEscape(gnConfig[mode][i].prize)}" ` +
        `oninput="gnSetSlot('${mode}', ${i}, 'prize', this.value)">` +
      `<select onchange="gnSetSlot('${mode}', ${i}, 'tier', this.value)">` +
        `<option value="Auto" ${cur === 'Auto' ? 'selected' : ''}>Auto (${detected})</option>` +
        `<option value="Básico" ${cur === 'Básico' ? 'selected' : ''}>Básico</option>` +
        `<option value="Pass*" ${cur === 'Pass*'  ? 'selected' : ''}>Pass*</option>` +
      '</select></div>';
  };

  const passWarning = gnData && gnData.passVerified === false
    ? '<div class="gn-config-note" style="color:#fdc826;">⚠ No se pudo verificar el ' +
      'Pass en el servidor — las filas en Auto se muestran como Básico. Recargá, o ' +
      'verificá a mano en premium.user_subscriptions antes de publicar.</div>'
    : '';

  // A manual tier silently ignores the server's pass check — the exporter must
  // see that BEFORE publishing (the mislabeled fecha-4 card shipped because
  // nothing said overrides were active).
  const overridden = [];
  ['fantasy', 'prode'].forEach(mode => gnConfig[mode].forEach((s, i) => {
    if ((s.tier || 'Auto') !== 'Auto') {
      overridden.push((mode === 'fantasy' ? 'Fantasy ' : 'Prode ') + (i + 1) + '° = ' + s.tier);
    }
  }));
  const overrideWarning = overridden.length
    ? '<div class="gn-config-note" style="color:#fdc826;">⚠ Tier MANUAL en esta fecha ' +
      '(ignora la verificación del servidor): ' + gnEscape(overridden.join(', ')) + '. ' +
      'Vale solo para esta fecha — <a href="#" onclick="gnResetTiers(); return false;" ' +
      'style="color:#fdc826;">volver todo a Auto</a>.</div>'
    : '';

  // Hay algo que mirar? Entonces se abre sola.
  const hayAviso = !!passWarning || !!overrideWarning;
  if (gnAbierto === null) gnAbierto = hayAviso;

  const monto = v => gnEscape(String(v || '').trim() || '—');
  const resumen =
    '<span class="gn-res">Pozo <b>' + monto(gnConfig.pot) + '</b></span>' +
    '<span class="gn-res">Fantasy <b>' +
      [0, 1, 2].map(i => monto(gnConfig.fantasy[i].prize)).join('</b> · <b>') + '</b></span>' +
    '<span class="gn-res">Prode <b>' +
      [0, 1, 2].map(i => monto(gnConfig.prode[i].prize)).join('</b> · <b>') + '</b></span>';

  const chip = hayAviso
    ? '<span class="gn-chip">' + (passWarning ? 'Pass sin verificar' : 'tier manual') + '</span>'
    : '';

  // Lo que sale de caja, ya con los Pass duplicados.
  const pagar = gnTotalAPagar();
  const totalTxt = '<span class="gn-res gn-total">A pagar <b>$' +
    pagar.total.toLocaleString('de-DE') + (pagar.completo ? '' : '+') + '</b>' +
    (pagar.completo ? '' : '<i title="Hay montos que no pude interpretar"> ?</i>') +
    '</span>';

  document.getElementById('ganadoresConfig').innerHTML =
    '<div class="gn-config' + (gnAbierto ? ' is-abierto' : '') + '">' +
      '<div class="gn-head" onclick="gnToggleConfig()">' +
        '<b class="gn-titulo">PREMIOS</b>' + resumen + totalTxt + chip +
        '<span class="gn-flecha">▾</span>' +
      '</div>' +
      '<div class="gn-cuerpo">' +
        passWarning +
        overrideWarning +
        '<div class="gn-config-row"><label>Pozo</label>' +
          `<input type="text" value="${gnEscape(gnConfig.pot)}" oninput="gnSetPot(this.value)"></div>` +
        [0, 1, 2].map(i => slot('fantasy', i)).join('') +
        [0, 1, 2].map(i => slot('prode', i)).join('') +
        '<div class="gn-config-note">Los montos son el premio BASE: en Auto el servidor ' +
        'verifica si el ganador tenía el Pass ANTES del primer partido de la fecha y una ' +
        'fila Pass* muestra el doble sola (dorado + moneda). Los montos quedan guardados ' +
        'en este navegador para la próxima fecha; los tiers manuales valen SOLO para la ' +
        'fecha en pantalla.</div>' +
      '</div>' +
    '</div>';
}

/* How far a line of text must move DOWN to sit optically centred in its own
   line box. Figma trims its text boxes to cap-height (text-box-trim), which is
   why these rules carry a line-height SMALLER than the font-size — 34.446 on a
   43.686px face. CSS has no such trim, so centring the line box leaves the
   glyphs riding high. Derived from real font metrics, so it stays correct after
   the shrink-to-fit below changes the size. */
const _gnCtx = document.createElement('canvas').getContext('2d');
function gnOpticalDy(el) {
  const cs = getComputedStyle(el);
  _gnCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const m = _gnCtx.measureText((el.textContent || '').trim());
  if (!m.actualBoundingBoxAscent) return 0;          // font not ready / empty
  const boxH = parseFloat(cs.lineHeight);
  if (!boxH) return 0;
  const halfLeading = (boxH - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2;
  const baseline = halfLeading + m.fontBoundingBoxAscent;
  const inkCentre = baseline + (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
  return boxH / 2 - inkCentre;
}

/* Shrink the prize to fit rather than ellipsise it (a clamp is still needed —
   a long value used to push the tier label off the card — but "40..." is a
   useless prize), then optically centre the whole pill row so the prize, the
   tier label and the rank numeral share one baseline. */
function gnFitPill(card) {
  card.querySelectorAll('.gn-pill').forEach(pill => {
    const prize = pill.querySelector('.gn-prize');
    if (prize) {
      prize.style.fontSize = '';
      prize.style.transform = '';
      // Measure the glyphs directly rather than via scrollWidth: with overflow
      // visible (required, or the tall glyphs get clipped) scrollWidth no longer
      // reports the overrun reliably. The stroke widens both sides.
      const inkWidth = () => {
        const cs = getComputedStyle(prize);
        _gnCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const stroke = parseFloat(cs.webkitTextStrokeWidth) || 0;
        return _gnCtx.measureText((prize.textContent || '').trim()).width + stroke;
      };
      const room = () => {
        const cs = getComputedStyle(prize);
        return prize.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
      };
      let size = parseFloat(getComputedStyle(prize).fontSize);
      let guard = 40;
      while (inkWidth() > room() && size > 20 && guard--) {
        size -= 1;
        prize.style.fontSize = size + 'px';
      }
    }
    // Nudge each Canaro run by its own metric-derived delta; they differ
    // (prize 5.18 / tier 3.68 / rank 4.43), so one shared value won't do.
    [prize, pill.querySelector('.gn-chip-pos')].forEach(el => {
      if (!el) return;
      const dy = gnOpticalDy(el);
      if (dy) el.style.transform = `translateY(${dy.toFixed(2)}px)`;
    });
    // The tier stacks three spans; move the container so their drop offset holds.
    const tier = pill.querySelector('.gn-tier');
    const fill = pill.querySelector('.gn-tier-fill');
    if (tier && fill) {
      const dy = gnOpticalDy(fill);
      if (dy) tier.style.transform = `translateY(${dy.toFixed(2)}px)`;
    }
  });

  /* Winner identity lines shrink rather than ellipsise. A long team name
     ("LA LECHE FORTINERA") was losing 29px off its right edge, which is the
     same failure as a truncated prize — the poster names a winner, so it has
     to name them in full. */
  card.querySelectorAll('.gn-name, .gn-handle, .gn-club').forEach(el => {
    el.style.fontSize = '';
    const base = parseFloat(getComputedStyle(el).fontSize);
    let size = base, guard = 30;
    const tooWide = () => {
      const cs = getComputedStyle(el);
      _gnCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      return _gnCtx.measureText((el.textContent || '').trim()).width > el.clientWidth;
    };
    while (tooWide() && size > base * 0.6 && guard--) {
      size -= 0.5;
      el.style.fontSize = size + 'px';
    }
  });
}

function gnRerender() {
  if (!gnData || gnMatchday == null) return;
  const container = document.getElementById('ganadoresContainer');
  container.innerHTML = '';

  const section = document.createElement('div');
  section.className = 'match-section';
  section.innerHTML = '<h3>GANADORES DE LA FECHA</h3>';

  const row = document.createElement('div');
  row.className = 'cards-row cap-fila';
  const card = buildGanadoresCard(gnMatchday, gnData, gnConfig);
  row.appendChild(createCardWrapper(card, 'ganadores_fecha' + gnMatchday));

  // Texto corto para acompañar la placa (captions.json, clave 'ganadores'):
  // dos líneas escritas al cierre de la fecha por tools/captions.js.
  const escritos = capEscritos('ganadores', gnMatchday);
  if (escritos.length) {
    const panel = document.createElement('div');
    panel.className = 'cap-panel' + (escritos.length > 1 ? ' is-escritos' : '');   // dos opciones, una al lado de la otra
    escritos.forEach(c => panel.appendChild(capCaja('ganadores', gnMatchday, c.red, gnEscape(c.titulo), c.texto,
      capVersiones(c), { placa: 'ganadores', opcion: c.opcion })));
    row.appendChild(panel);
  }

  section.appendChild(row);
  container.appendChild(section);
  // Needs layout AND loaded fonts: measureText silently falls back to a system
  // font if Canaro isn't in yet, which would bake in a wrong nudge for a
  // first-time visitor. Re-run once the faces resolve.
  gnFitPill(card);
  if (document.fonts && document.fonts.status !== 'loaded') {
    document.fonts.ready.then(() => gnFitPill(card));
  }
}

async function loadGanadores(matchday) {
  gnAbierto = null;   // cada fecha decide de nuevo si se abre
  const container = document.getElementById('ganadoresContainer');
  container.innerHTML = '<div class="spinner">Cargando ganadores...</div>';
  gnMatchday = matchday;
  gnSyncTiersToFecha();
  gnData     = null;

  try {
    gnData = await gnFetchWinners(matchday);
    await capCargarEscritos();   // el texto que acompaña la placa, si la fecha lo tiene
  } catch (err) {
    console.error('Ganadores load failed:', err);
    container.innerHTML =
      '<div class="spinner">Error al cargar ganadores: ' + gnEscape(err.message || err) + '</div>';
    return;
  }

  if (!gnData.fantasy.length && !gnData.prode.length) {
    gnData = null;
    container.innerHTML =
      '<div class="spinner">Sin ganadores para esta fecha (todavia no hay snapshots).</div>';
    return;
  }

  renderGanadoresConfig();
  gnRerender();
}
