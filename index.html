<style>
@font-face {
  font-family: 'Canaro';
  src: url('fonts/Canaro-Bold.ttf') format('truetype');

}
/* Ganadores card weights. Canaro has no "Book" cut in this repo — the design
   calls for it on the @handle and "Hincha de" lines, so Medium stands in. */
/* Canaro Book (400): el nombre de pila en las filas tipo MVPs / Top 5 del Figma. */
@font-face {
  font-family: 'CanaroLibro';
  src: url('fonts/Canaro-Book.ttf') format('truetype');

}

  font-family: 'CanaroBlack';

  font-style: normal;
}

  font-family: 'CanaroBlackIt';

}

  font-family: 'CanaroBook';

  font-family: 'CanaroExtraBold';

}

  font-family: 'HelvNeue';
  src: url('fonts/HelveticaNeueRoman.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'HelvNeue';
  src: url('fonts/HelveticaNeueLight.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
}
/* Jersey chest numbers — same face the app's JerseyKit uses. */

  font-family: 'AlumniCollegiate';
  src: url('fonts/AlumniSansCollegiateOne-Regular.ttf') format('truetype');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: #111;
  color: #fff;
  min-height: 100vh;
}

/* ── Page Layout ── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 40px;
  background: #1a1a2e;
  border-bottom: 2px solid #333;
}
.page-header h1 { font-size: 20px; font-weight: 700; color: #92B1DC; }

.selector-view { padding: 40px; max-width: 900px; margin: 0 auto; }
.selector-view h2 { font-size: 28px; margin-bottom: 24px; }

.competition-row {
  display: flex; gap: 12px; margin-bottom: 24px;
}
.comp-btn {
  padding: 10px 24px; border: 2px solid #92B1DC; border-radius: 8px;
  background: transparent; color: #92B1DC; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.comp-btn.active { background: #92B1DC; color: #000; }
.comp-btn:hover { background: #92B1DC; color: #000; }

.matchday-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 12px; margin-top: 16px;
}
.md-btn {
  padding: 20px 12px; border: 2px solid #333; border-radius: 8px;
  background: #1a1a2e; color: #fff; font-size: 18px; font-weight: 700;
  cursor: pointer; text-align: center; transition: all 0.2s;
}
.md-btn:hover { border-color: #92B1DC; background: #222; }

/* ── Cards View ── */
.cards-view { padding: 24px 40px; display: none; }

.nav-fecha:disabled { opacity: 0.3; cursor: default; }
.match-toggle {

.match-disenos { display: inline-flex; gap: 4px; margin-left: 6px; }
.match-diseno {

}
.match-diseno:hover { background: #23232f; color: #ddd; }
.match-diseno.is-on { background: #2b3a55; border-color: #3f5580; color: #fff; }
.match-pendiente {

.cards-toolbar {

#bgUpload { display: none; }

/* ── PLAYER CARD ──
   Flex row: [main card (top + bottom pill)] + [extras column (captain/bidón/events)]
   - Top block (146 × 158): transparent interior with thin white frame so
     the user can drop a photo layer behind the exported PNG in Figma.
   - Bottom pill sizes to content; no fixed main width.
   - Extras column holds captain badge, bidón badge and event icons on the
     right side of the card, so the downloaded PNG includes everything.
*/

/* Jersey = team badge PNG (matches mobile app + recap Card 3 pattern) */

/* Loading */
.spinner { text-align: center; padding: 40px; color: #92B1DC; font-size: 18px; }

/* No predictions */
.card .no-data {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 28px; color: rgba(255,255,255,0.3); text-transform: uppercase;
}

/* ══════════════════════════════════════════════════════════════════════
   CARD 4: GANADORES DE LA FECHA (1080 x 1350)
   Geometry transcribed from Figma node 356:3337 (Social Media Clausura,
   file yBWeKejIuQFR4rAa6Q7A5U). Blocks are absolutely positioned at the
   designed coordinates; content that varies with real data (names, point
   values, prize labels) sizes itself inside those blocks.
   ══════════════════════════════════════════════════════════════════════ */
.card-ganadores { background: #1a1a1a; }
.card-ganadores .gn-bg {
  position: absolute; left: 0; top: 0; width: 1080px; height: 1350px;
  background-image: url('background.png');
  background-size: cover; background-position: center;
}

/* ── Header plaque ── */
.card-ganadores .gn-plaque {
  position: absolute; left: 207px; top: 113px;
  width: 666.185px; height: 220px;
  background: #fff;
  border: 5.301px solid #000; border-radius: 35.341px;
  box-shadow: 0 9.304px 0 0 rgba(0,0,0,0.25),
              inset 0 -34.767px 0 0 rgba(96,96,96,0.1);
}
.card-ganadores .gn-trophy {
  position: absolute; left: 256.5px; top: 152.6px;
  width: 129.8px; height: 140.3px; object-fit: contain;
}
.card-ganadores .gn-title {
  position: absolute; left: 423.84px; top: 152.5px;
  color: #f3f3f3; white-space: nowrap;
}
/* Figma carries a black STROKE on the display text that its code export drops
   (it only emits the offset shadow), so every "app voice" label here restates
   it. paint-order keeps the stroke outside the glyph instead of eating into
   the letterform. */
.card-ganadores .gn-title-1,
.card-ganadores .gn-title-2,
.card-ganadores .gn-prize,
.card-ganadores .gn-tier-outline,
.card-ganadores .gn-pts,
.card-ganadores .gn-note-txt {
  paint-order: stroke fill;
  -webkit-text-stroke-color: #000;
}
.card-ganadores .gn-title-1 {
  font-family: 'CanaroBlack'; font-size: 38.267px; line-height: 70.721px;
  text-shadow: 0 2.755px 0 #000; -webkit-text-stroke-width: 3.4px;
}
.card-ganadores .gn-title-2 {
  font-family: 'CanaroBlackIt'; font-size: 67.351px; line-height: 70.721px;
  text-shadow: 0 2.755px 0 #000; -webkit-text-stroke-width: 4.6px;
}

/* ── Rank pill (black bar: chip | prize | tier) ── */
.card-ganadores .gn-pill {
  position: absolute; width: 403.694px;
  background: #000; border-radius: 30.518px;
  display: flex; align-items: center; justify-content: space-between;
}
/* Stretch to the pill instead of letting the "1°" glyph set the height: at
   line-height 1 a 37.2px numeral plus 12.1px padding made a 61.4px chip inside
   a 50.4px pill, bulging out of every row. In Figma the chip height is driven
   by the mark stack (prode 33.472 + 24.198 padding = 57.67 = the pill), and
   the numeral is text-box-trimmed so it never contributes its full line box. */
.card-ganadores .gn-chip {
  align-self: stretch;
  display: flex; align-items: center; justify-content: center;
  gap: 11.086px; padding: 0 11.573px;
  border-radius: 16.834px; flex: none;
}
.card-ganadores .gn-chip-gold   { background: #fcc726; }
.card-ganadores .gn-chip-silver { background: #9a9a9a; }
.card-ganadores .gn-chip-bronze { background: #e17400; }
.card-ganadores .gn-chip-mark {
  display: flex; flex-direction: column; align-items: center; flex: none;
}
.card-ganadores .gn-chip-mark img { display: block; object-fit: contain; }
.card-ganadores .gn-chip-mark-fantasy img { width: 38.524px; height: 16.157px; }
/* Figma crops the ball to a 31.4x27.4 frame; contain keeps it round instead. */
.card-ganadores .gn-chip-mark-prode  img { width: 27.386px; height: 27.386px; }
.card-ganadores .gn-chip-word {
  font-family: 'CanaroBlack'; color: #000; line-height: 1; white-space: nowrap;
}
.card-ganadores .gn-chip-mark-fantasy .gn-chip-word { font-size: 7.805px; margin-top: 3.9px; }
.card-ganadores .gn-chip-mark-prode   .gn-chip-word { font-size: 6.17px;  margin-top: 1.5px; }
.card-ganadores .gn-chip-div {
  width: 2.33px; height: 26.214px; background: #000;
  border-radius: 11.651px; flex: none;
}
/* min-width equalises 1°/2°/3°, which otherwise vary the chip width and drift
   the prize label a few px between rows. */
.card-ganadores .gn-chip-pos {
  font-family: 'CanaroBlack'; font-size: 37.214px; color: #000;
  line-height: 1; flex: none; min-width: 46px; text-align: center;
}
/* min-width:0 is load-bearing: a nowrap flex item defaults to min-content, so
   a longer prize than "400k" (e.g. "1.500.000", reachable straight from the
   prize inputs) pushed the tier label clean outside the pill and off the card. */
.card-ganadores .gn-prize {
  font-family: 'CanaroBlackIt'; font-size: 43.686px;
  line-height: 34.446px; text-align: center; white-space: nowrap;
  /* NO overflow:hidden here. line-height (34.446) is deliberately smaller than
     font-size (43.686) — Figma trims its text boxes to cap height — so the
     glyphs legitimately overflow their own line box by ~8.8px top and bottom.
     Clipping sliced the tops off the digits, and because a transform moves an
     element together with its clip box, the optical nudge could never fix it.
     min-width:0 still lets the item shrink so the tier label can't be pushed
     out; gnFitPill guarantees the horizontal fit instead of an ellipsis. */
  flex: 1; min-width: 0;
  padding: 0 6px; -webkit-text-stroke-width: 3.6px;
}
/* The tier label stacks its own drop shadow as a second copy behind the fill.
   It cannot use text-shadow: the Pass* fill is a gradient painted via
   background-clip:text, and Chrome paints the element's background BELOW its
   text shadow — so a text-shadow lands on top of the gradient and swallows it. */
.card-ganadores .gn-tier {
  position: relative; width: 131.652px; height: 40.777px; flex: none;
}
.card-ganadores .gn-tier span {
  position: absolute; left: 0; width: 100%;
  font-family: 'CanaroBlackIt'; font-size: 32.042px; line-height: 40.777px;
  text-align: center; white-space: nowrap;
}
.card-ganadores .gn-tier .gn-tier-drop { color: #000; }
/* The outline is its own layer rather than a stroke on the fill: a stroke on a
   background-clip:text element picks up the gradient instead of staying black. */
.card-ganadores .gn-tier .gn-tier-outline {
  top: 0; color: #000; -webkit-text-stroke-width: 3.2px;
}
.card-ganadores .gn-tier .gn-tier-fill { top: 0; }

/* Pass rows print gold-on-black with a deeper drop; Básico rows print grey. */
.card-ganadores .gn-pass .gn-prize { color: #fdc826; text-shadow: 0 7.391px 0 #000; }
.card-ganadores .gn-pass .gn-tier .gn-tier-drop { top: 7.391px; }
.card-ganadores .gn-pass .gn-tier .gn-tier-fill {
  color: transparent;
  background-image: linear-gradient(113.257deg, #FFCC55 24.931%, #FFEBBD 56.125%, #FFCC55 79.917%);
  -webkit-background-clip: text; background-clip: text;
}
.card-ganadores .gn-basico .gn-prize { color: #e3e3e3; text-shadow: 0 4.245px 0 #000; }
.card-ganadores .gn-basico .gn-tier .gn-tier-drop { top: 4.245px; }
.card-ganadores .gn-basico .gn-tier .gn-tier-fill { color: #e3e3e3; }

/* ── Winner card ── */
.card-ganadores .gn-winner {

/* Escudo | name+handle | points, as a flex row rather than three absolutes:
   the points badge grows with the score (a 172.2 is far wider than a 40) and a
   fixed name max-width let a long team name slide under it. */
.card-ganadores .gn-top {
  /* top was 12.69 — the name's cap height visually hugged the card edge
     (CMO feedback, fecha 5: "más padding entre el nombre y arriba").
     +5px keeps every element above the 71.96px rule: escudo bottom 63.1,
     handle bottom 66.8, points badge bottom 67.1. */
  position: absolute; left: 24.64px; right: 25.7px; top: 17.69px;
  display: flex; align-items: flex-start; gap: 12.61px;
}
.card-ganadores .gn-escudo { flex: none; margin-top: 3.73px; }
.card-ganadores .gn-id { flex: 1; min-width: 0; }
.card-ganadores .gn-name {
  font-family: 'Canaro'; font-size: 22.731px; line-height: 30.927px;

.card-ganadores .gn-handle {

.card-ganadores .gn-rule {

}
.card-ganadores .gn-club {
  position: absolute; left: 25.54px; top: 78.62px; max-width: 427px;

.card-ganadores .gn-pts {

     widths (134.9 for a bare "40", 155.2 for a "172.2") — any wider and it
     steals room from the name and forces a premature ellipsis. */
  flex: none; margin-top: 2.72px; height: 46.658px;
  min-width: 134.903px; padding: 0 11px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;

  box-shadow: 0 0 26.982px -1.597px rgba(145,145,145,0.3),
              inset 0 -20.755px 0 0 rgba(255,255,255,0.25);
  font-family: 'CanaroBlack'; color: #f3f3f3;
  text-shadow: 0 1.272px 0 #000; white-space: nowrap;

}

.card-ganadores .gn-pts .gn-pts-u { font-size: 14.69px; margin-left: 5px; }

/* Pass coin — overlaps the winner card's top-left corner on Pass* rows.
   Two layers: the gold disc plus the Fantasy "11" mark struck into its face.
   The disc alone reads as a blank token. */
.card-ganadores .gn-coin {
  position: absolute; width: 52.7px; height: 54.5px; transform: rotate(15deg);
}
.card-ganadores .gn-coin-disc {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain;
}
.card-ganadores .gn-coin-mark {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);

/* ── Footnote + wordmark ── */
.card-ganadores .gn-note {
  position: absolute; left: 50%; top: 1099px; transform: translateX(-50%);

}
.card-ganadores .gn-note-star {

}
.card-ganadores .gn-note-txt {

  width: 841.545px; line-height: 1.15; flex: none;

/* The 2px black text-stroke lays 1px inside each edge of a ~1.3px auto rule and

.card-ganadores .gn-note-txt u {

  width: 329.63px; height: 35.48px;
}

/* ── Header plaque ── */
/* En Figma el borde del cartel es OUTSIDE: los 4.666 px van por FUERA de la caja
   de 586 x 138. Acá el borde cuenta dentro de la caja (border-box), así que la
   caja se agranda 4.666 por lado (y el radio también) para que mida lo mismo. */
.card-pitch .pt-plaque {
  position: absolute; left: 242.164px; top: 107.744px;
  width: 595.498px; height: 147.512px;
  background: #fff; border: 4.666px solid #000; border-radius: 35.771px;
  box-shadow: 0 8.188px 0 0 rgba(0,0,0,0.25),
              inset 0 -30.599px 0 0 rgba(96,96,96,0.1);
}
/* Como en el Figma de Luchi (templates para automatizar, "Equipo Ganador Fecha 1"
   y el texto suelto "EQUIPO GANADOR FECHA 10"): las dos líneas arrancan SIEMPRE
   en el mismo borde izquierdo (x=275.9, 29 px adentro del cartel, igual que el
   margen de la pastilla a la derecha) y van alineadas a la izquierda. Antes el
   bloque se anclaba por la derecha y con fechas de dos dígitos el borde
   izquierdo quedaba en escalera y a 8 px del cartel. */
.card-pitch .pt-title {
  position: absolute; left: 275.9px; top: 117.8px;
  text-align: left; white-space: nowrap;
  paint-order: stroke fill; -webkit-text-stroke-color: #000;
}
.card-pitch .pt-title-1 {
  font-family: 'CanaroBlack'; line-height: 67.357px; color: #fff;
  text-shadow: 0 2.624px 0 #000; -webkit-text-stroke-width: 4.6px;   /* Figma: 2.3 px OUTSIDE = 4.6 centrado */
}
.pitch-ideal   .pt-title-1 { font-size: 36.446px; }
.pitch-ganador .pt-title-1 { font-size: 28.45px; }
.card-pitch .pt-title-2 {
  font-family: 'CanaroBlack'; font-size: 65.022px; line-height: 59.717px;
  color: #a2bfe8; text-shadow: 0 2.624px 0 #000; -webkit-text-stroke-width: 4.6px;
}
/* "FECHA 10" a tamaño completo mide 315 px y se metería 14 px adentro de la
   pastilla (que no se mueve: x=576.9). Baja a 58 px: queda de 281 px, con 20 px
   de aire, casi el mismo ancho que "EQUIPO GANADOR". El borde sigue la escala. */
.card-pitch .pt-title-2.is-wide {
  font-size: 58px; line-height: 55.1px; -webkit-text-stroke-width: 4.6px;
}
.card-pitch .pt-pts {
  position: absolute; left: 576.88px; top: 147.52px;
  width: 227.953px; height: 69.121px;
  display: flex; align-items: center; justify-content: center;
  border: 4.696px solid #000; border-radius: 24.017px;
  box-shadow: 0 0 39.681px -2.348px rgba(145,145,145,0.3),
              inset 0 -30.524px 0 0 rgba(255,255,255,0.25);
  font-family: 'CanaroBlack'; color: #f3f3f3; white-space: nowrap;
  text-shadow: 0 1.87px 0 #000;
  /* Figma: borde OUTSIDE de 1.775 px en todo el texto (número y PTS.) = 3.55 centrado. */
  paint-order: stroke fill; -webkit-text-stroke-color: #000; -webkit-text-stroke-width: 3.55px;
}
.pitch-ideal   .pt-pts { background: #fed13d; }
.pitch-ganador .pt-pts { background: #4b8fed; }
/* Altura de cada línea medida píxel a píxel contra el Figma (21-sep-2026):
   "EQUIPO …" estaba 4-5 px alto y "FECHA N" 6-8 px bajo, o sea con demasiado
   aire entre las dos. Con dos dígitos (58 px) FECHA apoya en la misma línea de
   base que la de un dígito. */
.pitch-ganador .pt-title-1 { position: relative; top: 5px; }
.pitch-ideal   .pt-title-1 { position: relative; top: 3.5px; }
.pitch-ganador .pt-title-2 { position: relative; top: -7.5px; }
.pitch-ideal   .pt-title-2 { position: relative; top: -5.5px; }
.pitch-ganador .pt-title-2.is-wide { top: -4px; }
.pitch-ideal   .pt-title-2.is-wide { top: -1px; }
/* El puntaje quedaba 12 px del borde de arriba y 24 del de abajo (la fuente
   trae más aire abajo que arriba): se baja para que quede centrado en la pastilla. */
.card-pitch .pt-pts-n, .card-pitch .pt-pts-u { position: relative; top: 5px; }
.card-pitch .pt-pts-n { font-size: 46.96px; }
.card-pitch .pt-pts-u { font-size: 21.604px; margin-left: 7px; }

.card-pitch .pp-pts {

  font-family: 'CanaroBlack'; font-size: 25.046px; line-height: 17.219px;

.card-pitch .pp-name {
  position: absolute; left: 2px; right: 15.65px; top: 28.17px;

     caps (MODICA, FERNANDEZ) overhang the top and descenders (Agustin, Jordy)

/* ══ RANKING DE GOLEADORES ════════════════════════════════════════════

.card-gl .gl-nombre { position: absolute; left: 74px; right: 40px; top: 0; line-height: 44px; font-family: 'CanaroBook', 'Canaro', sans-serif; font-weight: 500; font-size: 18.7px; white-space: nowrap; overflow: hidden; }

/* ══ FICHA DE JUGADOR DESTACADO ═══════════════════════════════════════
   Grupo "ficha jugador distinta" del Figma (templates para automatizar,
   nodo 1146-9685): 322x486. Foto redonda arriba, tarjeta blanca con nombre,
   torneo y cuatro líneas de estadísticas que se eligen a mano. Se exporta a
   3x (966x1458). La sombra externa de la tarjeta no entra en el recorte.  */
.card-fd { width: 322px; height: 486px; transform: scale(0.83); background: transparent; font-family: 'Canaro', sans-serif; overflow: visible; }
.card-fd .fd-card { position: absolute; left: 0; top: 82px; width: 322px; height: 404px; background: #fff; border-radius: 28.6px; box-shadow: inset 0 0 0 4px #292929; overflow: hidden; }
.card-fd .fd-nombre { position: absolute; left: 10px; width: 302px; top: 58px; text-align: center; font-family: 'CanaroBlack', 'Canaro', sans-serif; font-weight: 900; font-size: 31.9px; line-height: 35px; color: #fff;
  -webkit-text-stroke: 4px #000; paint-order: stroke fill; text-shadow: 0 2px 0 #000; white-space: nowrap; }
.card-fd .fd-torneo { position: absolute; left: 0; width: 322px; top: 95px; text-align: center; font-family: 'CanaroBlack', 'Canaro', sans-serif; font-weight: 900; font-size: 21.7px; line-height: 24px; color: #000; }
.card-fd .fd-fila { position: absolute; left: 23px; width: 276px; height: 53px; border-bottom: 1px solid #000; }
.card-fd .fd-fila:last-of-type, .card-fd .fd-fila.fd-ultima { border-bottom: none; }
.card-fd .fd-label { position: absolute; left: 12px; top: 0; line-height: 53px; font-family: 'CanaroBook', 'Canaro', sans-serif; font-weight: 500; font-size: 17.3px; color: #000; white-space: nowrap; }
.card-fd .fd-valor { position: absolute; right: 12px; top: 0; line-height: 53px; font-family: 'CanaroExtraBold', 'Canaro', sans-serif; font-weight: 800; font-size: 28.1px; color: #000; }
.card-fd .fd-pie { position: absolute; left: 0; top: 364px; width: 322px; height: 40px; background: #292929; box-shadow: inset 0 -2px 2px rgba(255,255,255,.10); }
.card-fd .fd-pie img { position: absolute; left: 90px; top: 11px; width: 142px; height: 14px; }
.card-fd .fd-foto { position: absolute; left: 103px; top: 0; width: 118px; height: 118px; border-radius: 50%; background: #d9d9d9 center / cover no-repeat; box-shadow: inset 0 0 0 3px #000; overflow: hidden; }
/* El recorte de cara entra entero, centrado y apoyado abajo, sin agrandarse. */
.card-fd .fd-foto img { position: absolute; left: 0; bottom: 0; width: 118px; height: 112px; object-fit: contain; object-position: center bottom; }
.card-fd .fd-escudo { position: absolute; left: 184px; top: 71px; width: 40px; height: 51px; object-fit: contain; filter: drop-shadow(0 0 1px #000); }
.fd-ctl { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: 11px; color: #9a9aa8; margin-top: 6px; width: 324px; }
.fd-ctl input, .fd-ctl select { font: 11px system-ui; background: #222; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 2px 4px; width: 100%; }
.fd-ctl .fd-rapidos { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.fd-ctl .fd-rapidos button { font: 10px system-ui; padding: 1px 6px; background: #222; color: #bbb; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
.fd-ctl .fd-rapidos button:hover { background: #333; color: #fff; }
.fd-ctl label.fd-subir { cursor: pointer; text-decoration: underline; }
.fd-ctl input[type=file] { display: none; }

}
.card-mvp .mv-title {
  position: absolute; left: 0; right: 0; top: 49.5px;
  display: flex; align-items: center; justify-content: center; gap: 31px;
  paint-order: stroke fill; -webkit-text-stroke-color: #000;
}
.card-mvp .mv-title-big {

  text-shadow: 0 0.065em 0 #000; -webkit-text-stroke-width: 0.129em; white-space: nowrap;
}
.card-mvp .mv-title-fecha {

}
.card-mvp .mv-title-small {

/* ── Ranked row ── */
/* Medidas del frame "top 5" del Figma de Luchi (templates para automatizar,
   nodo 1102:16743), leídas por API el 21-sep-2026. Antes estaban copiadas a ojo
   de una captura. Las coordenadas de los hijos son relativas al interior de la
   fila (Figma − 50 − 5 de borde en x; − tope de fila − 5 en y). */
.card-mvp .mv-row {
  position: absolute; left: 50px; width: 982px; height: 166px;
  background: #fff; border: 5px solid #000; border-radius: 29.3px;
  box-shadow: 0 7.7px 0 0 rgba(0,0,0,0.25),
              inset 0 -28.8px 0 0 rgba(96,96,96,0.1);
}
.card-mvp .mv-rank {
  position: absolute; left: 24.2px; top: calc(50% + 9.5px); transform: translateY(-50%);   /* medido contra el Figma: el número va 9,5 px más abajo que el centro de la caja de texto */
  text-align: left;
  font-family: 'CanaroBlack'; font-size: 86.6px; line-height: 1;
}
.card-mvp .mv-rank-1 { color: #FCC726; }
.card-mvp .mv-rank-2 { color: #9A9A9A; }
.card-mvp .mv-rank-3 { color: #E17400; }
.card-mvp .mv-rank-x { color: #000; }
/* La fila mide 166 con borde de 5 y una sombra interna de 22 abajo, asi que el
   gris arranca a los 139: ahi termina la foto, apoyada en la linea donde el
   boton pasa de gris a blanco.

   Y arranca ARRIBA del boton, en -35, de modo que la cabeza asoma sobre el
   fondo oscuro en vez de quedar encerrada. Entre fila y fila hay 49 px de aire
   (215 de paso menos 166 de alto), asi que 35 entran sin tocar la fila de
   arriba. 139 - (-35) = 174 de alto. La fila no recorta lo que se desborda. */
/* (Figma, 21-sep-2026: la foto mide 144 x 187,6 y apoya en el borde de abajo
   de la fila, no en la línea del gris.) */
.card-mvp .mv-photo {
  position: absolute; left: 124.1px; top: -32.2px; width: 144.1px; height: 187.6px;
}
/* Anclada abajo: así todas las cabezas quedan a la misma altura sobre la base
   de la fila, sin importar el encuadre que traiga cada recorte. */
.card-mvp .mv-foto {
  width: 100%; height: 100%;
  object-fit: contain; object-position: center bottom;
  display: block;
}
/* Figma: Canaro 47,4 px, interlínea 43,3, tracking −1,9; nombre en Book y
   apellido en Bold. El ancho libre hasta la etiqueta de posición es de ~246 px: lo que no
   entra lo achica mvFitNames. */
.card-mvp .mv-name {
  position: absolute; left: 293px; top: 38.7px;
  width: 246px; letter-spacing: -1.9px; color: #000;
}
/* No overflow:hidden — it sliced the accent off "Álvarez" and the descenders
   off "Depietri" / "Aguirre". Horizontal fit comes from the size tiers. */
.card-mvp .mv-name span,
.card-mvp .mv-name b {
  display: block; white-space: nowrap;
}
.card-mvp .mv-name span { font-family: 'CanaroLibro', 'Canaro', sans-serif; font-weight: 400; font-size: 47.4px; line-height: 43.3px; }
.card-mvp .mv-name b    { font-family: 'Canaro', sans-serif; font-weight: 700; font-size: 47.4px; line-height: 43.3px; }

/* Club mark: the square club logo, not a kit illustration, with the player's
   shirt number over it (same pairing the per-player cards already use). */
/* Fixed-height box: the badge + a stacked pill overflowed the 166px row and
   the tag hung outside it. Comp puts the club mark at row-x 543 and the points
   pill at 740, so 543 + 188 leaves a real gap instead of colliding. */
.card-mvp .mv-club {
  position: absolute; left: 549.6px; top: 0;
  width: 190px; height: 156px;
}
/* Jersey kit (PORT-OF the app's ds/JerseyKit): kit art with the chest number
   in the club's number colors. Geometry ratios copied from JerseyKit —
   height 0.97x width, chest bias ~4% of height, 1-digit number 0.6x width /
   2-digit 0.5x width with 0.03x tracking. The number's per-club fill/stroke
   colors come from public.teams (jersey_number_color / jersey_stroke_color;
   NULL stroke = flat number by design — never substitute a default outline). */
/* Figma: camiseta de 152,6 x 133 en x=622,6 / y=fila+18,8. */
.card-mvp .mv-kit {
  position: absolute; left: 18px; top: 13.8px;
  width: 152.6px; height: 133px; z-index: 1;
}
.card-mvp .mv-kit img {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  object-fit: contain; display: block;
}
.card-mvp .mv-kit-num {
  position: absolute; left: 0; right: 0; top: 0; bottom: 5px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'AlumniCollegiate';
}
/* PORT-OF ds/OutlinedNumber (the app's faux text stroke): the stroke is 8
   offset copies of the glyphs behind the fill, plus one aligned underlay so
   the collegiate font's inline slits read as solid stroke color
   (strokeUnderlay) — never -webkit-text-stroke, which outlines the slit
   edges instead. Absolute layers inherit the flex centering for their static
   position, mirroring the RN centered wrap + absolute layers. */
/* position:relative on the in-flow fill copy is LOAD-BEARING: RN paints
   strictly by child order, but on web the absolute stroke/underlay copies
   would otherwise paint above the non-positioned fill — the underlay then
   exactly covers the fill and the number renders stroke-colored only
   (invisible when the stroke matches the shirt). Positioned + last in DOM
   = fill on top, matching the RN stack. */
.card-mvp .mv-kit-num span { white-space: nowrap; position: relative; }
.card-mvp .mv-kit-num .mv-kit-num-layer {
  position: absolute; left: 0; right: 0; text-align: center;
}
/* Legacy fallback when a team has no kit art (unknown slug/new club):
   badge in a rounded box with the number scrimmed over it. */
.card-mvp .mv-club-badge {
  position: absolute; left: 35px; top: 19px;
  width: 118px; height: 118px;
  border: 3.6px solid #000; border-radius: 18px; overflow: hidden;
  background: #fff; box-sizing: border-box;
}
.card-mvp .mv-club-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-mvp .mv-club-num {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  font-family: 'CanaroBlack'; font-size: 46px; line-height: 1; text-align: center;
  color: #fff; paint-order: stroke fill;
  -webkit-text-stroke-color: #000; -webkit-text-stroke-width: 2.6px;
  /* Scrim: the numeral vanished over striped/line-art crests. */
  text-shadow: 0 0 12px rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.9);
}
/* The comp tucks the position tab BEHIND the kit — the jersey art has
   transparent corners, so the tab peeks out under the hem (the kit carries
   z-index 1 above; the tab stays unindexed). With the legacy badge fallback
   the tab stacks under the opaque box instead, same as before. */
/* Figma (template top 5): la etiqueta va ADELANTE de la camiseta, abajo a la
   izquierda: 63,9 x 39 en x=604,6 / y=fila+111, Helvetica Neue Bold 21,3. */
.card-mvp .mv-pos {
  position: absolute; left: 0; top: 106px; z-index: 2;
  width: 63.9px; height: 39px; border-radius: 1.8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'HelvNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 700; font-size: 21.3px; line-height: 1; color: #fff;
}
.card-mvp .mv-pos-arq  { background: #ffa47c; }
.card-mvp .mv-pos-def  { background: #f9be2c; }
.card-mvp .mv-pos-vol  { background: #7eb367; }
.card-mvp .mv-pos-del  { background: #e75b5e; }
.card-mvp .mv-pos-flex { background: #000; }
/* Figma: pastilla de 218 x 65 en x=786, borde 4,42 adentro, radio 22,6; número
   Canaro Black 44,25 con borde OUTSIDE 1,67 (= 3,34 en CSS) y sombra 0/1,8. */
.card-mvp .mv-pts {
  position: absolute; right: 23px; top: 50%; transform: translateY(-50%);
  height: 65px; min-width: 218px; padding: 0 14px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
  background: #4b8fed; border: 4.42px solid #000; border-radius: 22.6px;
  box-shadow: inset 0 -28.8px 0 0 rgba(255,255,255,0.25);
  font-family: 'CanaroBlack'; color: #f3f3f3; white-space: nowrap;
  text-shadow: 0 1.8px 0 #000;
  paint-order: stroke fill; -webkit-text-stroke-color: #000; -webkit-text-stroke-width: 3.34px;
}
.card-mvp .mv-pts-n, .card-mvp .mv-pts-u { position: relative; top: 4px; }   /* la fuente trae más aire abajo: así queda centrado */
.card-mvp .mv-pts-n { font-size: 44.25px; }
.card-mvp .mv-pts-u { font-size: 20.36px; margin-left: 7px; }

/* Título del template "top 5": "TOP 5" grande + dos renglones a la derecha
   ("CLAUSURA 2026" / "ESTUDIANTES"), todo blanco. Bordes OUTSIDE 7,76 y 3,51 del
   Figma = 0,126em en CSS; sombras 8,9 y 4 = 0,072em. En em para que mvFitTitle
   pueda achicar todo junto cuando el nombre del club es largo. */
.card-mvp .mv-title.is-top5 { top: 50px; height: 99px; gap: 35px; }
.card-mvp .mv-title.is-top5 .mv-title-big { position: relative; top: 11.5px; font-size: 123.05px; -webkit-text-stroke-width: 0.126em; text-shadow: 0 0.072em 0 #000; }
.card-mvp .mv-title-lines {
  position: relative; top: 7px;
  font-family: 'CanaroBlack'; font-size: 55.66px; line-height: 1.103; color: #fff; white-space: nowrap; text-align: left;
  -webkit-text-stroke-width: 0.126em; text-shadow: 0 0.072em 0 #000;
}
.card-mvp .mv-title-lines div { display: block; }
.card-mvp .mv-wordmark {
  position: absolute; left: 50%; top: 1270.59px; transform: translateX(-50%);
  /* 327 x 28.896 is Figma's POSITIONING frame; the art is nested inside it at
     negative insets and overflows to 329.63 x 35.48 (the asset's true size).
     Sizing the img to the frame + object-fit:contain letterboxed it to 268px. */
  width: 329.63px; height: 35.48px;
}

/* ══════════════════════════════════════════════════════════════════════
   CARD 9: COMIENZA LA FECHA (1080 x 1350)
   Opening-day fixture list. Like the MVP cards this is transcribed from the
   reference render rather than Figma (the MCP is rate-limited on this seat),
   so it reuses the tokens captured from the sibling nodes and wants an
   eye-test. Club marks are the square logos, not kit illustrations.
   ══════════════════════════════════════════════════════════════════════ */
.card-fixtures { background: #1a1a1a; }
.card-fixtures.export-transparent { background: transparent; }
.card-fixtures.export-transparent .fx-bg { display: none; }
.card-fixtures .fx-bg {
  position: absolute; left: 0; top: 0; width: 1080px; height: 1350px;
  background-image: url('background.png');
  background-size: cover; background-position: center;
}
.card-fixtures .fx-title {
  position: absolute; left: 0; right: 0; top: 120px; text-align: center;
  paint-order: stroke fill; -webkit-text-stroke-color: #000;
}
/* Stroke and shadow are proportional to font-size across the Figma-exported
   headings (stroke ~0.066-0.088 em, shadow 0.0406 em); these were the thinnest
   strokes-per-em in the file before being brought onto that curve. */
.card-fixtures .fx-title-1 {
  font-family: 'CanaroBlack'; font-size: 78px; line-height: 82px; color: #fff;
  text-shadow: 0 3.2px 0 #000; -webkit-text-stroke-width: 6.9px;
}
.card-fixtures .fx-title-2 {
  font-family: 'CanaroBlack'; font-size: 118px; line-height: 112px; color: #a2bfe8;
  text-shadow: 0 4.8px 0 #000; -webkit-text-stroke-width: 7.8px;
}

/* ── Fixture row ── */
/* Row tokens derived from the two Figma-exported plaques, whose internal ratios
   are invariant across both nodes (border/radius .1500, shadow/border 1.755,
   inset/border 6.558). pt-plaque is 138.18 tall to this row's 140, so scaling
   it by 1.0132 and deriving from the ratios agree to sub-pixel. */
.card-fixtures .fx-row {
  position: absolute; left: 39px; width: 1002px;
  background: #fff; border: 4.73px solid #000; border-radius: 31.5px;
  box-shadow: 0 8.3px 0 0 rgba(0,0,0,0.25),
              inset 0 -31px 0 0 rgba(96,96,96,0.1);
}
/* Bare crest, no box: crest art is a shaped transparent PNG, and the old
   white box + black border showed uneven white margins around every crest
   ("los escudos quedan siempre con un margen blanco atrás" — CMO, fecha 5).
   Same treatment as the resultado card's badge-home/away. */
.card-fixtures .fx-badge {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 110px; height: 110px;
  display: flex; align-items: center; justify-content: center;
}
.card-fixtures .fx-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
/* Text fallback so a missing crest doesn't leave a silently-empty white box —
   invisible as a defect once the card is exported to PNG. */
.card-fixtures .fx-badge span {
  font-family: 'CanaroBlack'; font-size: 30px; line-height: 1; color: #111;
}
.card-fixtures .fx-badge-home { left: 40px; }
.card-fixtures .fx-badge-away { right: 40px; }
.card-fixtures .fx-mid {
  position: absolute; left: 170px; right: 170px; top: 50%;
  transform: translateY(-50%); text-align: center;
}
.card-fixtures .fx-teams {
  font-family: 'CanaroBlack'; font-size: 64px; line-height: 70px; color: #fff;
  text-shadow: 0 3px 0 #000; white-space: nowrap;
  paint-order: stroke fill; -webkit-text-stroke-color: #000; -webkit-text-stroke-width: 4px;
}
/* Explicit stroke: inheriting the parent's 4px at 38px font gives a .105
   stroke-per-em against a .066-.088 house range, and the counters close up. */
.card-fixtures .fx-teams .fx-vs { font-size: 38px; -webkit-text-stroke-width: 3px; }
/* Was solid #111 at 23px — the secondary line rendered denser and wider than
   the hollow-outlined fixture name above it. */
.card-fixtures .fx-meta {
  margin-top: 6px;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 700; font-size: 21px; line-height: 25px; color: #4a4a4a;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-fixtures .fx-wordmark {
  position: absolute; left: 50%; top: 1270.59px; transform: translateX(-50%);
  /* 327 x 28.896 is Figma's POSITIONING frame; the art is nested inside it at
     negative insets and overflows to 329.63 x 35.48 (the asset's true size).
     Sizing the img to the frame + object-fit:contain letterboxed it to 268px. */
  width: 329.63px; height: 35.48px;
}

/* ── Prize config panel (page chrome, never exported) ── */
.gn-config {
  background: #1a1a2e; border: 1px solid #333; border-radius: 8px;
  padding: 16px 20px; margin-bottom: 20px;
}
.gn-config h4 { font-size: 13px; color: #92B1DC; margin-bottom: 12px; letter-spacing: 1px; }
.gn-config-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.gn-config-row label { font-size: 12px; color: #888; width: 78px; }
.gn-config input, .gn-config select {
  background: #111; border: 1px solid #444; border-radius: 4px;
  color: #fff; padding: 6px 8px; font-size: 13px; font-family: inherit;
}
.gn-config input { width: 110px; }
.gn-config select { width: 100px; }
.gn-config .gn-config-note { font-size: 11px; color: #666; margin-top: 8px; line-height: 1.5; }
/* ── Cajas de texto para redes, al lado del póster ── */
.cap-fila { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
.cap-panel {
  display: flex; flex-direction: column; gap: 14px;
  flex: 1 1 380px; min-width: 340px; max-width: 560px;
}
/* Captions escritos (captions.json): las versiones una al lado de la otra, en dos columnas. */
.cap-panel.is-escritos {
  display: grid; grid-template-columns: repeat(2, minmax(300px, 1fr)); align-items: start;
  flex: 1 1 720px; max-width: none;
}
.cap-panel.is-escritos .cap-informe { grid-column: 1 / -1; }
.cap-caja {
  background: #16161f; border: 1px solid #2b2b3a; border-radius: 8px; padding: 10px 12px;
}
.cap-head {
  display: flex; align-items: center; justify-content: space-between;
  color: #92B1DC; font-size: 12px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 8px;
}
.cap-acciones { display: flex; gap: 6px; }
.cap-btn {
  border: 1px solid #444; background: #222; color: #bbb;
  border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer;
}
.cap-btn:hover { background: #2c2c2c; color: #fff; }
.cap-btn.is-ok { background: #2f6b41; border-color: #2f6b41; color: #fff; }
/* Botones Completa / Corta: el activo se ve como pestaña elegida */
.cap-versiones { display: inline-flex; gap: 0; margin-right: 6px; }
.cap-versiones .cap-btn { border-radius: 0; }
.cap-versiones .cap-btn:first-child { border-radius: 4px 0 0 4px; }
.cap-versiones .cap-btn:last-child { border-radius: 0 4px 4px 0; }
.cap-btn.is-activa { background: #92B1DC; border-color: #92B1DC; color: #0d0d13; font-weight: 700; }
/* Publicar en X: negro como la red; verde cuando salió, rojo si falló */
.cap-btn.cap-x { background: #000; border-color: #555; color: #fff; font-weight: 700; }
.cap-btn.cap-x:hover { background: #222; }
.cap-btn.cap-x:disabled { opacity: .7; cursor: wait; }
.cap-btn.cap-x.is-error { background: #7a1f1f; border-color: #7a1f1f; }
/* Panel de publicación automática */
.auto-panel { background: #16161f; border: 1px solid #2b2b3a; border-radius: 8px; padding: 12px 16px; max-width: 720px; }
.auto-ayuda { color: #999; font-size: 12px; margin: 4px 0 10px; }
.auto-fila { display: flex; align-items: center; gap: 18px; padding: 8px 0; border-top: 1px solid #22222e; flex-wrap: wrap; }
.auto-nombre { flex: 1 1 260px; color: #eee; font-size: 14px; font-weight: 700; }
.auto-nombre small { display: block; color: #888; font-weight: 400; font-size: 12px; }
.auto-fila label { color: #ccc; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.auto-acciones { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.auto-estado { color: #92B1DC; font-size: 12px; }
/* Publicar en Instagram: violeta como la red */
.cap-btn.cap-ig { background: #6b2fa3; border-color: #8a4fc4; color: #fff; font-weight: 700; }
.cap-btn.cap-ig:hover { background: #7d3bbd; }
.cap-btn.cap-ig:disabled { opacity: .7; cursor: wait; }
.cap-btn.cap-ig.is-error { background: #7a1f1f; border-color: #7a1f1f; }
.cap-txt {
  width: 100%; box-sizing: border-box; resize: vertical; overflow: hidden;
  min-height: 90px; border: 1px solid #333; border-radius: 6px;
  background: #0d0d13; color: #eee; padding: 10px 11px;
  font-family: inherit; font-size: 13px; line-height: 1.55;
}
.cap-txt:focus { outline: none; border-color: #92B1DC; }
.cap-cuenta { text-align: right; font-size: 11px; color: #777; margin-top: 5px; }
.cap-cuenta.is-pasado { color: #f87171; font-weight: 700; }
/* ── Goles, asistencias y tarjetas en el chip del poster ──
   Centrados sobre el borde derecho (translateX -50%) y apilados. z-index 6 para
   quedar por encima del marco negro del chip, que esta en 5. */
.card-pitch .pp-eventos {
  position: absolute; z-index: 6;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  pointer-events: none;
}
.card-pitch .pp-ev {
  width: 32px; height: 32px; display: block;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
}

/* ── Fotos de jugadores (fotos/<player_id>.png, fondo transparente) ── */
/* Sin z-index a propósito: la foto va primera en el DOM y el panel negro la
   tapa por orden de pintado. Poniéndole z-index se treparía por encima. */
.card-pitch .pp-foto {
  /* El width: 100% es obligatorio: un <img> absoluto NO se estira con
     left + right, se queda en su ancho natural y queda pegado a la izquierda. */
  position: absolute; left: 0; width: 100%;
  /* Anclada al panel negro, no al borde de la tarjeta. El panel empieza a los
     129.92 px y le tapa apenas 6: antes le comía 22 y todos quedaban cortados
     en la mandíbula, sin cuello. 212.891 - (129.92 + 6) = 76.971. */
  bottom: 76.971px; height: 134px;
  object-fit: contain; object-position: center bottom;
}
/* Llena el marco blanco de 146x158; el chip de posición y el escudo van encima
   porque vienen después en el DOM. */

/* ── Checklist de fotos faltantes (sólo pantalla, no sale en ningún PNG) ── */
.foto-report {
  margin: 0 0 24px; padding: 12px 14px;
  background: #241d16; border: 1px solid #4a3a24; border-radius: 8px;
  font-size: 12px; line-height: 1.5; max-width: 760px;
}
.foto-report.is-ok { background: #16211a; border-color: #2c4a35; }
.foto-head { color: #EAB939; margin-bottom: 8px; }
.foto-report.is-ok .foto-head { color: #4ade80; margin-bottom: 0; }
.foto-head code {
  background: #000; padding: 1px 5px; border-radius: 3px; color: #ddd;
}
.foto-table { border-collapse: collapse; width: 100%; }
.foto-table td { padding: 3px 12px 3px 0; vertical-align: top; }
.foto-name { color: #fff; white-space: nowrap; }
.foto-file code { color: #92B1DC; }
.foto-link { color: #777; }
.foto-link:hover { color: #92B1DC; }

/* ── Premios de la placa de Ganadores ──
   Arranca en una línea con el resumen. Se abre sola sólo si hay algo que
   revisar: el Pass sin verificar o un tier puesto a mano. */
.gn-head {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px;
  padding: 9px 12px; cursor: pointer;
  background: #16161f; border: 1px solid #2b2b3a; border-radius: 8px;
  font-size: 12px; color: #9a9aa8;
}
.gn-head:hover { background: #1b1b26; }
.gn-titulo { color: #92B1DC; letter-spacing: 0.5px; }
.gn-res b { color: #fff; font-weight: 700; }
/* El total va separado y en verde: es plata que sale, no un dato mas. */
.gn-total {
  margin-left: 4px; padding: 2px 10px;
  background: #16281a; border: 1px solid #2c4a35; border-radius: 999px;
}
.gn-total b { color: #7ede9a; }
.gn-total i { color: #EAB939; font-style: normal; }
.gn-chip {
  background: #4a3a10; color: #EAB939; border: 1px solid #6b551a;
  border-radius: 999px; padding: 2px 10px; font-size: 11px;
}
.gn-flecha { margin-left: auto; font-size: 10px; opacity: .5; }
.gn-config.is-abierto .gn-flecha { opacity: 1; transform: rotate(180deg); }
.gn-cuerpo { display: none; }
.gn-config.is-abierto .gn-cuerpo {
  display: block; margin-top: 6px; padding: 12px;
  background: #101018; border: 1px solid #2b2b3a; border-radius: 8px;
}

/* ── Panel de asignación de puestos (sólo pantalla, no sale en el PNG) ──
   Arranca en una línea. Los tres contadores son los botones: cada uno abre su
   grupo. El color vive sólo acá arriba; dentro de la lista los chips van en
   gris, porque si abriste "forzadas" repetir el rojo once veces no agrega nada
   y era justamente lo que abrumaba. */
.pe-report {
  margin: 12px 0 4px; max-width: 760px;
  font-size: 12px; line-height: 1.5;
}
.pe-head {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  padding: 8px 12px;
  background: #16161f; border: 1px solid #2b2b3a; border-radius: 8px;
}
.pe-form {
  color: #fff; font-size: 13px; letter-spacing: 0.5px; margin-right: 4px;
}
.pe-cont {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid transparent; background: transparent;
  color: #9a9aa8; font-size: 12px; font-family: inherit;
  padding: 3px 9px; border-radius: 999px; cursor: pointer;
}
.pe-cont:hover { background: #20202c; color: #ddd; }
.pe-cont i {
  width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none;
}
.pe-cont-natural    i { background: #4ade80; }
.pe-cont-secundaria i { background: #EAB939; }
.pe-cont-forzada    i { background: #f87171; }
.pe-cont-sin-dato   i { background: #6b7280; }
.pe-flecha { font-size: 9px; opacity: 0; transition: opacity .12s; }
.pe-cont:hover .pe-flecha { opacity: .5; }
.pe-cont.is-abierto {
  background: #20202c; border-color: #3a3a4c; color: #fff;
}
.pe-cont.is-abierto .pe-flecha { opacity: 1; transform: rotate(180deg); }

.pe-detalle { display: none; }
.pe-detalle.is-abierto {
  display: block; margin-top: 6px; padding: 8px 12px;
  background: #101018; border: 1px solid #2b2b3a; border-radius: 8px;
}
/* separate + border-spacing en vez de collapse: con las celdas pegadas los
   chips de posicion se tocaban entre si y formaban una barra vertical continua,
   que era justo lo que abrumaba. Asi cada uno queda suelto. */
.pe-table { border-collapse: separate; border-spacing: 0 6px; width: 100%; }
.pe-table td { padding: 4px 12px 4px 0; vertical-align: middle; }
/* td.pe-slot y no .pe-slot a secas: ".pe-table td" pesa mas y le estaba
   metiendo 12px de padding derecho DENTRO del chip, que por eso salia ancho y
   con el nombre pegado. */
.pe-table td.pe-slot {
  width: 52px; text-align: center; font-weight: 700; font-size: 11px;
  letter-spacing: 0.3px; border-radius: 4px; padding: 4px 0;
  color: #111;
}
/* El aire entre el chip y el nombre va acá, en la celda de al lado, para no
   ensanchar el chip. */
.pe-table td.pe-name { padding-left: 18px; }

.pe-fit-natural    td.pe-slot { background: #4ade80; }
.pe-fit-secundaria td.pe-slot { background: #EAB939; }
.pe-fit-forzada    td.pe-slot { background: #f87171; }
.pe-fit-sin-dato   td.pe-slot { background: #6b7280; color: #fff; }
/* width 1% deja que la celda se encoja a su contenido, asi el dato de origen
   queda pegado al nombre en vez de irse al otro extremo de la fila. */
.pe-name { color: #fff; white-space: nowrap; width: 1%; }
.pe-src  { color: #6f6f7d; }
.pe-formation {
  display: inline-block; margin-left: 10px; padding: 2px 9px;
  border-radius: 11px; background: #EAB939; color: #111;
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px; vertical-align: 2px;
}

/* ══ PLACA RESULTADO — DISEÑO NUEVO ═══════════════════════════════════
   Medidas del frame "resultado partido ejemplo" del Figma (Social Media
   Clausura, nodo 1075-14503), leídas por la API. Verificada contra el
   export de Figma: 0,53% de pixeles distintos (ver prueba-resultado.html).
   Las cifras del marcador son los PNG exportados de Figma
   (icons/marcador/0..9.png): HTML no dibuja sus sombras internas.        */
.card-rn { background: #101319; font-family: 'Canaro', sans-serif; }
.card-rn .rn-foto, .card-fj .rn-foto { position: absolute; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #101319; }
/* Exportación sin fondo: el PNG descargado lleva sólo los elementos, para
   apoyarlo sobre cualquier fondo. Con foto la foto sigue tapando todo; sin
   foto no se dibuja ni el color de fondo ni el degradé a negro. */
.card-rn.export-transparent, .card-fj.export-transparent { background: transparent; }
.card-rn.export-transparent .rn-foto, .card-fj.export-transparent .rn-foto { background-color: transparent; }
.card-rn.export-transparent .rn-foto:not([style*="background-image"]) + .rn-scrim { display: none; }
.card-rn.moviendo { cursor: grab; }
.card-rn.moviendo:active { cursor: grabbing; }
/* El degradé de Figma: transparente hasta el 48,08%, negro puro abajo. */
.card-rn .rn-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 48.08%, rgba(0,0,0,1) 100%); }
/* Escudos: imágenes de 167 de ancho centradas en y=923. */
.card-rn .rn-escudo { position: absolute; top: 796px; width: 167px; height: 254px; }
.card-rn .rn-escudo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card-rn .rn-escudo-local  { left: 144px; }
.card-rn .rn-escudo-visita { left: 769px; }
/* Camiseta con dorsal: el componente de Figma ("Component 1", página
   Components) es un marco de 198x172; el dorsal es Alumni 110px, 91% de
   interlínea, 9% de tracking, borde OUTSIDE por club (RN_DORSAL). Se
   dibuja a 198 y se escala a la caja de 167.                              */
.rn-kit { --rn-kit-escala: 0.84343; position: absolute; left: 0; top: 50%; width: 198px; height: 172px; transform-origin: 0 0; transform: translateY(-50%) scale(var(--rn-kit-escala)); }
.rn-kit img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.rn-kit-num { position: absolute; left: 0; width: 198px; height: 100px; font-family: 'AlumniCollegiate'; font-size: 110px; line-height: 100px; letter-spacing: 9.9px; text-indent: 9.9px; text-align: center; white-space: nowrap; paint-order: stroke fill; }
/* En MVPs / Top 5 la camiseta mide 152,6 (Figma): misma camiseta y mismo dorsal, más chicos.
   top:0 y sin translateY: con el centrado heredado asomaba 15 px por arriba de la fila. */
.card-mvp .mv-kit .rn-kit { --rn-kit-escala: 0.7707; top: 0; transform: scale(var(--rn-kit-escala)); }
/* Marcador: marcos de 192x203 en x=341 y x=547, y=822. */
.card-rn .rn-cifra { position: absolute; top: 822px; height: 203px; display: flex; }
.card-rn .rn-cifra-local  { right: 547px; justify-content: flex-end; }
.card-rn .rn-cifra-visita { left: 547px; }
.card-rn .rn-cifra img { width: 193px; height: 203px; display: block; }
.card-rn .rn-cifra img + img { margin-left: -40px; }
.card-rn .rn-barra { position: absolute; left: 538px; top: 878px; width: 3px; height: 91px; background: #f3f3f3; border-radius: 3px; box-shadow: 0 0 0 2.82px #000, 0 3.3px 0 2.82px #000; }
/* Eventos: dos columnas de 390, iconos por fuera en x=105 y x=938. */
.card-rn .rn-eventos { position: absolute; top: 1062px; display: flex; flex-direction: column; gap: 19px; }
.card-rn .rn-eventos-local  { left: 105px; width: 477px; }
.card-rn .rn-eventos-visita { left: 538px; width: 435px; }
.card-rn .rn-fila { position: relative; width: 100%; min-height: 33px; }
.card-rn .rn-ico { position: absolute; top: 0; }
.card-rn .rn-eventos-local  .rn-ico { left: 0; }
.card-rn .rn-eventos-visita .rn-ico { left: 400px; }
.card-rn .rn-ico img { display: block; }
.card-rn .rn-ico-gol     { width: 32px; height: 33px; }
.card-rn .rn-ico-tarjeta { width: 29px; height: 33px; }
.card-rn .rn-ico-doble   { width: 35px; height: 33px; }
/* Canaro Bold 23,36 / 20, blanco, sin borde. Se achica sólo si no entra en dos renglones. */
.card-rn .rn-txt { width: 390px; padding-top: 7px; font-family: 'Canaro', sans-serif; font-weight: 700; font-size: 23.36px; line-height: 20px; color: #fff; text-transform: uppercase; }
.card-rn .rn-eventos-local  .rn-txt { margin-left: 42px; }
.card-rn .rn-eventos-visita .rn-txt { text-align: right; }
.card-rn .rn-wordmark, .card-fj .rn-wordmark, .card-pv .rn-wordmark, .card-hs .rn-wordmark { position: absolute; left: 376px; top: 1269px; width: 330px; }
.card-rn .rn-wordmark img, .card-fj .rn-wordmark img, .card-pv .rn-wordmark img, .card-hs .rn-wordmark img { width: 100%; display: block; }

/* ══ PREVIA DEL PARTIDO ═══════════════════════════════════════════════
   Frame "Estudian gimnasia pre partido" del Figma (Contenido Fechas, nodo
   658-7487), sin la foto de fondo: sólo la pastilla del partido, el texto de
   abajo y el logo, con fondo transparente al descargar. El gris de pantalla es
   para poder mirarla. Lo que HTML no hace: la sombra interna del texto del
   título de la pastilla (va con borde y sombra normal).                    */
.card-pv { background: #1e1e1e; font-family: 'Canaro', sans-serif; }
.card-pv.export-transparent { background: transparent; }
/* Pastilla: 1000x173 en (40,56), borde 4,3 negro adentro, sombra interna gris abajo. */
.card-pv .pv-pill { position: absolute; left: 40px; top: 56px; width: 1000px; height: 173px; background: #f8f8f8; border-radius: 34.5px; overflow: hidden;
  box-shadow: inset 0 0 0 4.3px #000, inset 0 -29px 0 rgba(96,96,96,.10); }
/* Camisetas: el componente de 198x172 escalado a 131x114, en x=33 y x=836 dentro de la pastilla. */
.card-pv .pv-kit { position: absolute; top: 29px; width: 131px; height: 114px; }
.card-pv .pv-kit-local  { left: 33px; }
.card-pv .pv-kit-visita { left: 836px; }   /* espejo de la local: 1000 - 33 - 131 */
/* El translateY va DESPUÉS de la escala (en px escalados): con el orden de .rn-kit
   la camiseta sube 86*(1-escala) = 29px y queda pegada arriba de la pastilla. */
.card-pv .pv-kit .rn-kit { --rn-kit-escala: 0.6616; transform: scale(var(--rn-kit-escala)) translateY(-50%); }
.card-pv .pv-kit img.pv-escudo { position: absolute; inset: 6px; width: auto; height: auto; max-width: 119px; max-height: 102px; margin: auto; object-fit: contain; }
/* "Estudiantes vs Gimnasia": Canaro Bold 52,9, blanco con borde negro 3,3 y sombra 0/4. */
.card-pv .pv-titulo { position: absolute; left: 181px; width: 639px; top: 44px; text-align: center; font-family: 'Canaro', sans-serif; font-weight: 700; font-size: 52.9px; line-height: 44px; color: #f3f3f3;
  -webkit-text-stroke: 6.6px #000; paint-order: stroke fill; text-shadow: 0 4px 0 #000; white-space: nowrap; }
/* "14/08 | 16:45 HS | Estadio": Canaro Medium 24, negro. */
.card-pv .pv-meta { position: absolute; left: 100px; width: 800px; top: 100px; text-align: center; font-family: 'CanaroBook', 'Canaro', sans-serif; font-weight: 500; font-size: 24px; line-height: 28px; color: #000; white-space: nowrap; }
/* Texto libre: Canaro Black 64,6 / 66, blanco con borde negro 4,1 y sombra 0/5; hasta dos líneas, apoyado sobre la línea de equipos. */
.card-pv .pv-texto { position: absolute; left: 75px; width: 931px; bottom: 209px; text-align: center; font-family: 'CanaroBlack', 'Canaro', sans-serif; font-weight: 900; font-size: 64.6px; line-height: 66px; color: #fff;
  -webkit-text-stroke: 8.2px #000; paint-order: stroke fill; text-shadow: 0 5px 0 #000; text-transform: uppercase; }
/* "ESTUDIANTES VS GIMNASIA": Canaro Black 65,8, borde negro 5,6 y sombra 0/6; cada equipo en su color. */
.card-pv .pv-vs { position: absolute; left: 40px; width: 1000px; top: 1158px; text-align: center; font-family: 'CanaroBlack', 'Canaro', sans-serif; font-weight: 900; font-size: 65.8px; line-height: 70px; color: #fff;
  -webkit-text-stroke: 11.2px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000; text-transform: uppercase; white-space: nowrap; }
/* ══ HISTORIAL ════════════════════════════════════════════════════════
   Frame "historail template" del Figma (Social Media Clausura, página
   "templates para automatizar", nodo 1174-9908), sin las dos fotos, la raya
   blanca ni el degradé: eso lo pone Luchi en Figma; se descarga con fondo
   transparente. Lo que HTML no hace: las sombras internas del texto de los
   números (van con borde y sombra normal). Los escudos del Figma tienen un
   tamaño por club; acá van en una caja uniforme apoyada abajo.            */
.card-hs { background: #1e1e1e; font-family: 'CanaroBlack', 'Canaro', sans-serif; font-weight: 900; color: #fff; }
.card-hs.export-transparent { background: transparent; }
/* Fondo: dos fotos de 541x1350 (x=0 y x=539), separador blanco de 12 en x=534 y
   el mismo degradé que la placa resultado. La base oscura va en un HIJO: la
   exportación pisa el fondo de la raíz con transparente. */
.card-hs .hs-fondo { position: absolute; inset: 0; background: #1e1e1e; display: none; }
.card-hs.hs-con-foto .hs-fondo { display: block; }
.card-hs .hs-foto { position: absolute; top: 0; width: 541px; height: 1350px; background-size: cover; background-position: center; background-repeat: no-repeat; }
.card-hs .hs-foto-local  { left: 0; }
.card-hs .hs-foto-visita { left: 539px; }
.card-hs .hs-foto:not([style*="background-image"])::after { position: absolute; inset: 24px 24px 760px; border: 6px dashed #555; border-radius: 28px; display: flex; align-items: center; justify-content: center;
  font-family: system-ui, sans-serif; font-weight: 600; font-size: 40px; color: #777; }
.card-hs .hs-foto-local:not([style*="background-image"])::after  { content: 'foto LOCAL'; }
.card-hs .hs-foto-visita:not([style*="background-image"])::after { content: 'foto VISITANTE'; }
.card-hs.export-transparent .hs-foto::after { display: none; }
.card-hs .hs-sep { position: absolute; left: 534px; top: 0; width: 12px; height: 1350px; background: #fff; }
.card-hs .hs-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 48.08%, rgba(0,0,0,1) 100%); }
.card-hs.hs-sin-marco .hs-sep, .card-hs.hs-sin-marco .hs-scrim { display: none; }
.card-hs.moviendo { cursor: grab; }
.card-hs.moviendo:active { cursor: grabbing; }
.hs-foto-ctl { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #9a9aa8; margin-top: 6px; width: 324px; }
.hs-foto-ctl .hs-fila { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hs-foto-ctl b { color: #cfcfe0; font-weight: 600; min-width: 62px; }
.hs-foto-ctl button, .hs-foto-ctl .hs-subir { font: 10px system-ui; padding: 1px 6px; background: #222; color: #bbb; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
.hs-foto-ctl .hs-subir input { display: none; }
.hs-foto-ctl input[type=range] { width: 70px; }
.card-hs .hs-t { position: absolute; text-align: center; white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke-color: #000; }
/* Escudos: caja de 215 apoyada en y=865, centrada en x=351,5 y x=744,5 (el de Central mide 233 con su borde transparente). */
.card-hs .hs-escudo { position: absolute; top: 650px; width: 215px; height: 215px; }
.card-hs .hs-escudo img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; display: block; }
.card-hs .hs-escudo-local  { left: 244px; }
.card-hs .hs-escudo-visita { left: 637px; }
/* "E": Canaro Black 161,75 / 166, borde 10,2 outside, sombra 0/11,6. */
.card-hs .hs-e { left: 455.7px; width: 200px; top: 721px; font-size: 161.75px; line-height: 166px; -webkit-text-stroke-width: 20.4px; text-shadow: 0 11.6px 0 #000; }
/* Cajas 157,5x136,1 en x=273/477/667, y=886: borde 6,27 adentro, sombra interna abajo. */
.card-hs .hs-caja { position: absolute; top: 886.4px; width: 157.5px; height: 136.1px; background: #fff; border-radius: 32px;
  box-shadow: inset 0 0 0 6.27px #000, inset 0 -24.7px 0 0 rgba(0,0,0,.25), 0 0 53px -3px rgba(145,145,145,.30); }

// ── Supabase ──
const SUPABASE_URL = 'https://ketwxvbrhqbemlflmadu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtldHd4dmJyaHFiZW1sZmxtYWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjA4MDcsImV4cCI6MjA4NjQzNjgwN30.-qXPLMSFEiRORNk5EUKrD16VDiMXtv-VfcDSWpzWzsg';
// UMD build exposes window.supabase with { createClient }
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── State ──
let currentComp = 384;
let currentSeason = 2026;
let bgDataUrl = null;

// ── Winning Logo (PNG) ──

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  buildMatchdayGrid();
  irAFechaVigente();
  document.querySelectorAll('.comp-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.comp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentComp = parseInt(btn.dataset.comp);
      document.getElementById('seasonLabel').textContent =
        (currentComp === 384 ? 'Apertura' : 'Clausura') + ' ' + currentSeason;
    });

});

/* Al abrir o recargar la página se entra directo a la fecha vigente: la del
   último partido que ya empezó (torneo incluido). Entre fecha y fecha queda la
   que terminó, hasta que arranca la siguiente. "Volver" lleva al selector. */
async function irAFechaVigente() {
  try {
    const { data } = await db.from('v_fixtures').select('competition_id, matchday, kickoff_ts')
      .eq('season_id', currentSeason).in('competition_id', [384, 724]).gte('matchday', 1).lte('matchday', 16)
      .lte('kickoff_ts', new Date().toISOString()).order('kickoff_ts', { ascending: false }).limit(1);
    const f = data && data[0];
    if (!f || fechaActual != null) return;   // ya eligió una fecha a mano mientras cargaba
    const bt = document.querySelector('.comp-btn[data-comp="' + f.competition_id + '"]');
    if (bt) bt.click();
    loadFecha(f.matchday);
  } catch (e) { console.warn('No pude averiguar la fecha vigente', e); }
}

function buildMatchdayGrid() {
  const grid = document.getElementById('matchdayGrid');
  for (let i = 1; i <= 16; i++) {
    const btn = document.createElement('button');
    btn.className = 'md-btn';
    btn.textContent = 'Fecha ' + i;
    btn.addEventListener('click', () => loadFecha(i));
    grid.appendChild(btn);
  }
}

// ── Navigation ──
function showSelector() {
  document.getElementById('selectorView').style.display = 'block';
  document.getElementById('cardsView').style.display = 'none';
}

function navFecha(paso) {
  if (fechaActual == null) return;
  const n = fechaActual + paso;
  if (n < 1 || n > 16) return;
  loadFecha(n);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pintarNavFecha() {
  const prev = document.getElementById('fechaPrev');
  const next = document.getElementById('fechaNext');
  if (prev) prev.disabled = !(fechaActual > 1);
  if (next) next.disabled = !(fechaActual < 16);
}

/* Las flechas del teclado hacen lo mismo, salvo que estés escribiendo en un
   caption o en un monto: ahí las flechas son para mover el cursor. */
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (document.getElementById('cardsView').style.display === 'none') return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navFecha(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); navFecha(1); }
});

/* Fichas de partido: una lista con un renglón por partido. Cada uno se
   despliega solo y recién ahí se arman sus placas (son más de 100 por fecha).
   Qué partidos están abiertos se recuerda mientras la página esté abierta; al
   recargar arrancan todos cerrados. */
const DISENO_KEY = 'winning.recap.disenoPartidos';
let disenoPartidos = 'antiguas';
let partidosDeLaFecha = { matchday: null, matches: [] };
const partidosAbiertos = new Set();
const partidoClave = (matchday, m) => currentComp + '-' + matchday + '-' + m.home_team.id + '-' + m.away_team.id;
try {
  disenoPartidos = localStorage.getItem(DISENO_KEY) || 'antiguas';
  localStorage.removeItem('winning.recap.verPartidos');   // preferencia vieja
} catch (e) { /* incógnito */ }

/* El botón de arriba: si hay alguno abierto los cierra todos; si no, abre todos. */
function togglePartidos() {
  const { matchday, matches } = partidosDeLaFecha;
  const abiertos = matches.filter(m => partidosAbiertos.has(partidoClave(matchday, m)));
  if (abiertos.length) { abiertos.forEach(m => partidosAbiertos.delete(partidoClave(matchday, m))); pintarPartidos(); }
  else abrirTodosPartidos();
}
async function abrirTodosPartidos() {
  const { matchday, matches } = partidosDeLaFecha;
  matches.forEach(m => partidosAbiertos.add(partidoClave(matchday, m)));
  await pintarPartidos();
}

function setDisenoPartidos(cual) {
  if (disenoPartidos === cual) return;
  disenoPartidos = cual;
  try { localStorage.setItem(DISENO_KEY, cual); } catch (e) { /* incógnito */ }
  pintarPartidos();
}

/* El diseño de siempre: resultado, predicciones y fantasy por partido. */
function armarPartidoAntiguas(row, match, matchday) {

  // Card 1: Resultado
  row.appendChild(createCardWrapper(
    buildCard1(match, matchday),
    `resultado_f${matchday}_${match.home_team.short_name}_vs_${match.away_team.short_name}`
  ));

  // Card 2: Predicciones
  if (match.predictions) {
    row.appendChild(createCardWrapper(
      buildCard2(match, matchday),
      `predicciones_f${matchday}_${match.home_team.short_name}_vs_${match.away_team.short_name}`
    ));
  }

  // Card 3: Top 5 Fantasy
  if (match.top_players && match.top_players.length > 0) {
    row.appendChild(createCardWrapper(
      buildCard3(match, matchday),
      `fantasy_f${matchday}_${match.home_team.short_name}_vs_${match.away_team.short_name}`
    ));
  }

}
