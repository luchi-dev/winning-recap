/* MVPs DEL DÍA: una fecha se juega en varios días y se postea un top 5 por
   cada uno. La vista de puntos no trae game_id, así que el día de cada jugador
   sale de cruzar player_match_stats con los partidos de ese día (hora
   argentina = kickoff − 3 h). Devuelve [{ dia, nombre, rows, faltan }]. */
const MV_DIAS = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
async function mvCargarDias(matchday) {
  const fixR = await db.from('v_fixtures').select('game_id, kickoff_ts, opta_period')
    .eq('competition_id', currentComp).eq('season_id', currentSeason).eq('matchday', matchday);
  const dias = {};
  (fixR.data || []).forEach(f => {
    const d = new Date(new Date(f.kickoff_ts).getTime() - 3 * 3600e3);
    const k = d.toISOString().slice(0, 10);
    (dias[k] = dias[k] || { dia: k, nombre: MV_DIAS[d.getUTCDay()], juegos: [], faltan: 0 }).juegos.push(f.game_id);
    if (f.opta_period !== 'FullTime') dias[k].faltan++;
  });
  const jugados = Object.values(dias).filter(d => d.faltan < d.juegos.length).sort((a, b) => a.dia < b.dia ? -1 : 1);
  if (jugados.length < 2) return [];   // fecha de un solo día: es la misma placa que MVPs de la fecha
  const [ptsR, pmsR] = await Promise.all([
    db.from(MV_VIEW).select('player_id, player_name, position_code, jersey_number, team_id, total_points, is_starter, normalized_minutes')
      .eq('competition_id', currentComp).eq('season_id', currentSeason).eq('matchday', matchday),
    db.schema('winning_lpf').from('player_match_stats').select('game_id, player_id').in('game_id', jugados.flatMap(d => d.juegos)),
  ]);
  if (ptsR.error) throw ptsR.error;
  const juegoDe = {}; (pmsR.data || []).forEach(r => { juegoDe[r.player_id] = r.game_id; });
  jugados.forEach(d => {
    d.rows = (ptsR.data || []).filter(p => d.juegos.includes(juegoDe[p.player_id]))
      .sort((a, b) => b.total_points - a.total_points).slice(0, 5);
  });
  return jugados.filter(d => d.rows.length);
}

async function loadMvpCards(matchday) {
  const container = document.getElementById('mvpContainer');
  container.innerHTML = '<div class="spinner">Cargando MVPs...</div>';

  let mvps, subs, dias = [];
  try {
    [mvps, subs] = await Promise.all([
      mvFetchTop(matchday, { limit: 5 }),
      mvFetchTop(matchday, { limit: 5, benchOnly: true }),
    ]);
    try { dias = await mvCargarDias(matchday); } catch (e) { console.warn('MVPs del día', e); }
  } catch (err) {
    console.error('MVP load failed:', err);
    container.innerHTML =
      '<div class="spinner">Error al cargar MVPs: ' + gnEscape(err.message || err) + '</div>';
    return;
  }

  // Qué jugadores de estas dos placas tienen recorte. Va antes de dibujar.
  const todos = mvps.concat(subs, ...dias.map(d => d.rows));
  await fotoPreloadIds(todos.map(p => p.player_id));

  // Kit art + colors + home/away kit choice. Best-effort: a failure here
  // degrades every row to the legacy badge, never loses the card.
  let kits = {};
  try {
    const teamIds = [...new Set(todos.map(p => p.team_id).filter(id => id != null))];
    kits = await mvFetchKits(matchday, teamIds);
  } catch (err) {
    console.warn('Jersey kit data unavailable — MVP rows fall back to badges:', err);
  }

  container.innerHTML = '';
  const specs = [
    { kind: 'mvp',      title: 'MVPs DE LA FECHA',  rows: mvps },
    { kind: 'suplente', title: 'SUPER SUPLENTES',   rows: subs },
  ];
  specs.forEach(s => {
    if (!s.rows.length) return;
    const section = document.createElement('div');
    section.className = 'match-section';
    section.innerHTML = `<h3>${s.title}</h3>`;
    const row = document.createElement('div');
    row.className = 'cards-row';
    const card = buildMvpCard(s.kind, matchday, s.rows, kits);
    row.appendChild(createCardWrapper(card, card.dataset.filename));
    section.appendChild(row);
    container.appendChild(section);
    mvFitTitle(card);   // needs layout, so after insertion
    if (document.fonts && document.fonts.status !== 'loaded') {
      document.fonts.ready.then(() => mvFitTitle(card));   // width depends on the face
    }
  });

  // MVPs del día: una placa por cada día de la fecha que ya tiene partidos jugados.
  if (dias.length) {
    const section = document.createElement('div');
    section.className = 'match-section';
    section.innerHTML = '<h3>MVPs DEL DÍA</h3>';
    const row = document.createElement('div');
    row.className = 'cards-row';
    dias.forEach(d => {
      const archivo = 'mvps_f' + matchday + '_' + d.nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      const titulo = { big: 'MVPs', small: 'DEL', fecha: d.nombre, file: archivo };
      const card = buildMvpCard('mvp', matchday, d.rows, kits, titulo);
      const w = createCardWrapper(card, archivo);
      const nota = document.createElement('div'); nota.className = 'rn-sinfoto';
      nota.textContent = 'fecha ' + matchday + ' · ' + d.dia.split('-').reverse().slice(0, 2).join('/') + ' · ' + d.juegos.length + ' partido(s)' + (d.faltan ? ' · OJO: faltan terminar ' + d.faltan : '');
      w.appendChild(nota);
      row.appendChild(w);
    });
    section.appendChild(row);
    container.appendChild(section);
    row.querySelectorAll('.card-mvp').forEach(card => { mvFitTitle(card); document.fonts.ready.then(() => mvFitTitle(card)); });
  }

  if (!container.children.length) {
    container.innerHTML = '<div class="spinner">Sin datos de jugadores para esta fecha.</div>';
  }
}

// COMIENZA LA FECHA
// The fecha's OPENING day only — a Clausura fecha is spread across up to six
// days, and the title only makes sense for the first one.
//
// DANGER: fixtures.kickoff_local is stored in UTC despite the name. Argentina
// is UTC-3 with no DST, so both the clock time AND the calendar day have to be
// converted — a 00:15Z kickoff is 21:15 the PREVIOUS day in Buenos Aires, and
// reading the raw column would put it on the wrong card entirely.
// ══════════════════════════════════════════════════════════════════════

const FX_TZ = 'America/Argentina/Buenos_Aires';
const fxDayFmt  = new Intl.DateTimeFormat('en-CA', { timeZone: FX_TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const fxDateFmt = new Intl.DateTimeFormat('es-AR', { timeZone: FX_TZ, day: 'numeric', month: 'numeric' });
const fxTimeFmt = new Intl.DateTimeFormat('es-AR', { timeZone: FX_TZ, hour: '2-digit', minute: '2-digit', hour12: false });

let fxStadiumCache = null;   // team_id -> stadium name

async function fxLoadStadiums() {
  if (fxStadiumCache) return fxStadiumCache;
  // teams.stadium_id has no FK to stadiums, so PostgREST can't embed it —
  // two reads and a join here instead.
  const [teamsRes, stadRes] = await Promise.all([
    db.from('teams').select('id, stadium_id'),
    db.from('stadiums').select('id, name'),
  ]);
  if (teamsRes.error) throw teamsRes.error;
  if (stadRes.error)  throw stadRes.error;
  const byStadium = {};
  (stadRes.data || []).forEach(s => { byStadium[s.id] = s.name; });
  fxStadiumCache = {};
  (teamsRes.data || []).forEach(t => { fxStadiumCache[t.id] = byStadium[t.stadium_id] || null; });
  return fxStadiumCache;
}

function fxBadge(team, side) {
  const id = team && team.id;
  const alt = gnEscape((team && (team.short_name || team.name) || '').slice(0, 4));
  return `<div class="fx-badge fx-badge-${side}">` +
    (id ? `<img src="badges/${id}.png" onerror="this.insertAdjacentHTML('afterend','<span>${alt}</span>');this.remove();">`
        : `<span>${alt}</span>`) +
    `</div>`;
}

/* Centre the row block between the title's ink and the wordmark. The previous
   formula's centring term collapsed to exactly zero at n=4, so the anchor was
   unmediated and left an 84px gap above the block against 195px below it. */
const FX_TITLE_BOTTOM = 331;
const FX_WORDMARK_TOP = 1272;

function fxLayout(n) {
  const H   = n >= 5 ? 140 : 168;
  const GAP = n >= 5 ? 28  : 34;
  const blockH = n * H + (n - 1) * GAP;
  const start = FX_TITLE_BOTTOM + ((FX_WORDMARK_TOP - FX_TITLE_BOTTOM) - blockH) / 2;
  return { H, STEP: H + GAP, start };
}

function fxRowHtml(m, stadiums, i, n) {
  const { H, STEP, start } = fxLayout(n);
  const top = start + i * STEP;

  const kickoff = new Date(m.kickoff_local);
  const home = m.home_team || {}, away = m.away_team || {};
  const venue = stadiums[home.id];
  const meta = [
    fxDateFmt.format(kickoff),
    fxTimeFmt.format(kickoff) + ' HS',
    venue ? venue.toUpperCase() : null,
  ].filter(Boolean).join(' | ');

  return `<div class="fx-row" style="top:${top}px; height:${H}px;">` +
      fxBadge(home, 'home') +
      `<div class="fx-mid">` +
        `<div class="fx-teams">${gnEscape(home.short_name || home.name || '?')}` +
          `<span class="fx-vs"> vs </span>${gnEscape(away.short_name || away.name || '?')}</div>` +
        `<div class="fx-meta">${gnEscape(meta)}</div>` +
      `</div>` +
      fxBadge(away, 'away') +
    `</div>`;
}

function buildFixturesCard(matchday, matches, stadiums) {
  const card = document.createElement('div');
  card.className = 'card card-fixtures';
  card.dataset.exportW  = '1080';
  card.dataset.exportH  = '1350';
  card.dataset.filename = 'comienza_fecha' + matchday;

  card.innerHTML =
    '<div class="fx-bg"></div>' +
    '<div class="fx-title">' +
      '<div class="fx-title-1">COMIENZA LA</div>' +
      `<div class="fx-title-2">FECHA ${matchday}</div>` +
    '</div>' +
    matches.map((m, i) => fxRowHtml(m, stadiums, i, matches.length)).join('') +
    '<img class="fx-wordmark" src="icons/wordmark-original.png" alt="">';

  return card;
}

async function renderFixturesCard(matchday, data) {
  const container = document.getElementById('fixturesContainer');
  container.innerHTML = '';

  const all = (data.matches || []).filter(m => m.kickoff_local);
  if (!all.length) return;

  // Group by Buenos Aires calendar day, then keep the earliest day.
  const byDay = {};
  all.forEach(m => {
    const key = fxDayFmt.format(new Date(m.kickoff_local));
    (byDay[key] = byDay[key] || []).push(m);
  });
  const firstDay = Object.keys(byDay).sort()[0];
  const dayMatches = byDay[firstDay].sort(
    (a, b) => new Date(a.kickoff_local) - new Date(b.kickoff_local));

  let stadiums = {};
  try {
    stadiums = await fxLoadStadiums();
  } catch (err) {
    console.warn('Stadium lookup failed; rendering without venues.', err);
  }

  const section = document.createElement('div');
  section.className = 'match-section';
  section.innerHTML = `<h3>COMIENZA LA FECHA — ${dayMatches.length} partido(s) del ${firstDay}</h3>`;
  const row = document.createElement('div');
  row.className = 'cards-row';
  const card = buildFixturesCard(matchday, dayMatches, stadiums);
  row.appendChild(createCardWrapper(card, card.dataset.filename));
  section.appendChild(row);
  container.appendChild(section);
}

// ── Export ──
/* La placa como PNG (data URL), exactamente igual que "Descargar PNG" pero sin
   bajar el archivo. La usa tools/publicar-x.js desde Chrome sin cabeza para
   publicar en X la misma imagen que se ve acá. */
async function recapExportar(filename) {
  const w = document.querySelector('.card-wrapper[data-filename="' + filename + '"]');
  if (!w) throw new Error('no está la placa ' + filename);
  return exportarCard(w.querySelector('.card, .pcard'));
}
window.recapExportar = recapExportar;

/* Abre un partido de la fecha cargada (arma sus placas) con el diseño pedido.
   La usa tools/publicar-auto.js para la placa de resultado al pitazo. */
async function recapAbrirPartido(gameId, diseno) {
  if (diseno && (diseno === 'nuevas' || diseno === 'antiguas')) disenoPartidos = diseno;
  const { matchday, matches } = partidosDeLaFecha || {};
  const i = (matches || []).findIndex(m => Number(m.game_id) === Number(gameId));
  if (i < 0) throw new Error('el partido ' + gameId + ' no está en la fecha cargada');
  const section = document.querySelectorAll('#matchesContainer .match-acordeon')[i];
  if (!section) throw new Error('no está la sección del partido ' + gameId);
  await abrirPartido(section, matches[i], matchday);
  return true;
}
window.recapAbrirPartido = recapAbrirPartido;

async function downloadCard(cardEl, filename) {
  const dataUrl = await exportarCard(cardEl);
  if (!dataUrl) return;
  const link = document.createElement('a');
  link.download = filename + '.png';
  link.href = dataUrl;
  link.click();
}

async function exportarCard(cardEl) {
  const isPlayerCard = cardEl.classList.contains('pcard');
  const isPoster     = !isPlayerCard;

  // Player cards: measure actual rendered bounds (width varies per surname length)
  // Poster cards: fixed 1080 x 1350 canvas
  let exportW, exportH;
  if (isPlayerCard) {
    const rect = cardEl.getBoundingClientRect();
    // ceil so we never clip a sub-pixel
    exportW = Math.ceil(rect.width);
    exportH = Math.ceil(rect.height);
  } else {
    exportW = parseInt(cardEl.dataset.exportW || '1080', 10);
    exportH = parseInt(cardEl.dataset.exportH || '1350', 10);
  }
  // Default 2x: the 1080-canvas posters exported at 1x read "pixel AF" once
  // Instagram re-encodes them (CMO feedback, fecha 5) — text antialiasing at
  // 1 CSS px per image px is visibly steppy. 2160x2700 downscales crisp.
  // Player cards keep their explicit 4x override.
  const exportPR = parseFloat(cardEl.dataset.exportPixelRatio || '2');

  // Temporarily remove scale and resize parent for export
  const origTransform = cardEl.style.transform;
  const origParentW   = cardEl.parentElement.style.width;
  const origParentH   = cardEl.parentElement.style.height;
  const origParentOv  = cardEl.parentElement.style.overflow;

  cardEl.style.transform = 'none';
  cardEl.parentElement.style.width    = exportW + 'px';
  cardEl.parentElement.style.height   = exportH + 'px';
  cardEl.parentElement.style.overflow = 'visible';

  // Poster cards: transparent-bg export when no background uploaded
  const hasBg = bgDataUrl !== null && !cardEl.classList.contains('card-rn') && !cardEl.classList.contains('card-fj') && !cardEl.classList.contains('card-pv') && !cardEl.classList.contains('card-hs') && !cardEl.classList.contains('card-ce');
  if (isPoster && !hasBg) {
    cardEl.classList.add('export-transparent');
    const overlay = cardEl.querySelector('.bg-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  let dataUrl = null;
  try {
    dataUrl = await htmlToImage.toPng(cardEl, {
      width: exportW,
      height: exportH,
      pixelRatio: exportPR,
      backgroundColor: (isPoster && hasBg) ? undefined : 'transparent',
      style: { transform: 'none' },
    });
  } catch (err) {
    console.error('Export failed:', err);
    alert('Error al exportar: ' + err.message);
  }

  // Restore
  if (isPoster && !hasBg) {
    cardEl.classList.remove('export-transparent');
    const overlay = cardEl.querySelector('.bg-overlay');
    if (overlay) overlay.style.display = '';
  }
  cardEl.style.transform                 = origTransform;
  cardEl.parentElement.style.width       = origParentW;
  cardEl.parentElement.style.height      = origParentH;
  cardEl.parentElement.style.overflow    = origParentOv;
  return dataUrl;
}

async function downloadAll() {
  // offsetParent null = está escondido. Exportar eso falla, asi que se saltea.
  const cards = [...document.querySelectorAll('.card, .pcard')]
    .filter(c => c.offsetParent !== null);
  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    let safeName;

    if (card.dataset.filename) {
      safeName = card.dataset.filename;
    } else if (card.classList.contains('pcard')) {
      safeName = 'player_' + i;
    } else {
      // Poster card: derive filename from match section + card type
      const section = card.closest('.match-section');
      const h3 = section ? section.querySelector('h3').textContent : 'card';
      const type = card.classList.contains('card-resultado')    ? 'resultado' :
                   card.classList.contains('card-predicciones') ? 'predicciones' : 'fantasy';
      safeName = type + '_' + h3.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 40);
    }

    await downloadCard(card, safeName);
    if (i < cards.length - 1) await new Promise(r => setTimeout(r, 400));
  }
}
