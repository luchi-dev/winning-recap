/* "Hernán de la Fuente" -> "H. DE LA FUENTE". */
function rnNombre(nombre) {
  const p = String(nombre || '').trim().split(/\s+/);
  if (p.length < 2) return (p[0] || '').toUpperCase();
  return (p[0][0] + '. ' + p.slice(1).join(' ')).toUpperCase();
}

/* Filas de un equipo: goles, amarillas, rojas, dobles amarillas. Un gol en
   contra viene con el team_id del que lo recibe a favor, así que cae del
   lado correcto solo. Al expulsado por doble no se le repite la amarilla. */
function rnFilas(p, teamId) {
  const goles = p.goles.filter(g => g.team === teamId)
    .map(g => rnNombre(g.nombre) + ' ' + g.minute + "'" + (g.tipo === 'Penalty' ? ' (P)' : g.tipo === 'Own' ? ' (E/C)' : ''));
  const dobles = p.tarjetas.filter(t => t.team === teamId && t.tipo === 'SecondYellow');
  const conDoble = new Set(dobles.map(t => t.nombre));
  const amarillas = p.tarjetas.filter(t => t.team === teamId && t.tipo === 'Yellow' && !conDoble.has(t.nombre))
    .map(t => rnNombre(t.nombre) + ' ' + t.minute + "'");
  const rojas = p.tarjetas.filter(t => t.team === teamId && t.tipo === 'StraightRed').map(t => rnNombre(t.nombre));
  const doblesTxt = dobles.map(t => rnNombre(t.nombre));
  const filas = [];
  if (goles.length)     filas.push({ ico: 'gol',     img: 'icons/goal.png',          txt: goles.join(', ') });
  if (amarillas.length) filas.push({ ico: 'tarjeta', img: 'icons/yellow-card.png',   txt: amarillas.join(', ') });
  if (rojas.length)     filas.push({ ico: 'tarjeta', img: 'icons/red-card.png',      txt: rojas.join(', ') });
  if (doblesTxt.length) filas.push({ ico: 'doble',   img: 'icons/second-yellow.png', txt: doblesTxt.join(', ') });
  return filas;
}
function rnColumnaHtml(filas) {
  return filas.map(f => `<div class="rn-fila"><span class="rn-ico"><img class="rn-ico-${f.ico}" src="${f.img}"></span>` +
    `<div class="rn-txt">${gnEscape(f.txt)}</div></div>`).join('');
}
/* Las cifras del marcador, un PNG exportado de Figma por dígito. */
function rnCifraHtml(lado, valor) {
  const d = valor == null ? [] : String(valor).split('').filter(x => /\d/.test(x));
  return `<div class="rn-cifra rn-cifra-${lado}">` + d.map(x => `<img src="icons/marcador/${x}.png" alt="${x}">`).join('') + '</div>';
}
/* Camiseta (titular o la alternativa que usó esa fecha) con el dorsal del
   mejor puntaje fantasy del equipo en el partido. */
function rnKitHtml(kit, teamId, numero) {
  const src = 'jerseys/' + (kit.kit === 'alt' ? 'alt/' : '') + encodeURIComponent(kit.slug) + '.png';
  const img = `<img src="${src}" onerror="mvKitImgFallback(this, '${gnEscape(kit.slug)}')">`;
  // Los colores de Figma son los de la camiseta titular. Con la alternativa
  // se usan los del catálogo de kits (get_fecha_kits), que son los correctos
  // para esa camiseta; la tipografía y el grosor siguen siendo los de Figma.
  let d = RN_DORSAL[teamId];
  if (d && kit.kit === 'alt' && kit.numberColor) {
    d = { ...d, fill: kit.numberColor, stroke: kit.strokeColor || null, w: kit.strokeColor ? (d.w || 3) : 0 };
  }
  let num = '';
  if (d && numero != null) {
    const borde = d.stroke ? `-webkit-text-stroke:${(d.w * 2).toFixed(1)}px ${d.stroke};` : '';
    num = `<div class="rn-kit-num" style="top:${d.y}px; color:${d.fill}; ${borde}">${gnEscape(numero)}</div>`;
  }
  return `<div class="rn-kit">${img}${num}</div>`;
}
/* Si una fila no entra en dos renglones, achica ESA fila hasta que entre. */
function rnAjustarTexto(card) {
  const escala = card.getBoundingClientRect().width / 1080 || 1;
  card.querySelectorAll('.rn-txt').forEach(el => {
    let tam = 23.36;
    while (el.getBoundingClientRect().height / escala > 7 + 20 * 2 + 1 && tam > 14) {
      tam -= 0.5; el.style.fontSize = tam + 'px'; el.style.lineHeight = (tam * 20 / 23.36) + 'px';
    }
  });
}

/* Escudos: originales (escudos/), de la app (badges/) o camisetas (jerseys/). */
const RN_ESCUDOS_KEY = 'winning.recap.escudos';
function rnModoEscudos() { try { return localStorage.getItem(RN_ESCUDOS_KEY) || 'original'; } catch (e) { return 'original'; } }
function rnSetModoEscudos(m) { try { localStorage.setItem(RN_ESCUDOS_KEY, m); } catch (e) {} pintarPartidos(); }

function buildResultadoNueva(p, opts) {
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'card card-rn';
  el.dataset.exportPixelRatio = '1';   // PNG de 1080x1350 exactos
  const modo = rnModoEscudos();
  const escudo = (lado, id) => {
    let adentro;
    if (modo === 'camiseta' && opts.kits && opts.kits[id]) adentro = rnKitHtml(opts.kits[id], id, (opts.mejores || {})[id]);
    else adentro = `<img src="${modo === 'app' ? 'badges/' : 'escudos/'}${id}.png" onerror="this.style.display='none'">`;
    return `<div class="rn-escudo rn-escudo-${lado}">${adentro}</div>`;
  };
  el.innerHTML =
    `<div class="rn-foto" style="${opts.foto ? `background-image:url('${opts.foto}')` : ''}"></div>` +
    '<div class="rn-scrim"></div>' +
    escudo('local', p.home.id) + escudo('visita', p.away.id) +
    rnCifraHtml('local', p.home.score) + '<span class="rn-barra"></span>' + rnCifraHtml('visita', p.away.score) +
    '<div class="rn-eventos rn-eventos-local">' + rnColumnaHtml(rnFilas(p, p.home.id)) + '</div>' +
    '<div class="rn-eventos rn-eventos-visita">' + rnColumnaHtml(rnFilas(p, p.away.id)) + '</div>' +
    `<div class="rn-wordmark">${WINNING_LOGO_HTML}</div>`;
  return el;
}

// ── Datos de la fecha (una consulta por fecha, con caché) ─────────────
const rnCache = {};
async function rnCargarDatos(matchday) {
  const clave = currentComp + '-' + currentSeason + '-' + matchday;
  if (rnCache[clave]) return rnCache[clave];
  const fixR = await db.from('v_fixtures').select('game_id, home_id, away_id, home_score, away_score')
    .eq('competition_id', currentComp).eq('season_id', currentSeason).eq('matchday', matchday);
  const fixtures = fixR.data || [];
  const ids = fixtures.map(f => f.game_id);
  const teamIds = [...new Set(fixtures.flatMap(f => [f.home_id, f.away_id]))];
  if (!ids.length) return (rnCache[clave] = { fixtures, porJuego: {} });
  const lpf = t => db.schema('winning_lpf').from(t);
  const [golR, tarR, pmsR, ptsR, kits] = await Promise.all([
    lpf('goal_events').select('game_id, team_id, scorer_player_id, minute, goal_type').in('game_id', ids),
    lpf('card_events').select('game_id, team_id, player_id, minute, card_type').in('game_id', ids),
    lpf('player_match_stats').select('game_id, team_id, player_id, mins_played').in('game_id', ids),
    db.from(MV_VIEW).select('player_id, player_name, position_code, team_id, jersey_number, total_points')
      .eq('competition_id', currentComp).eq('season_id', currentSeason).eq('matchday', matchday),
    mvFetchKits(matchday, teamIds).catch(() => ({})),
  ]);
  const pids = [...new Set([...(golR.data || []).map(g => g.scorer_player_id), ...(tarR.data || []).map(c => c.player_id)].filter(Boolean))];
  const nomR = pids.length ? await lpf('player_universe').select('player_id, first_name, last_name, known_name').in('player_id', pids) : { data: [] };
  const nombre = {};
  (nomR.data || []).forEach(r => { nombre[r.player_id] = (r.first_name && r.last_name) ? r.first_name + ' ' + r.last_name : (r.known_name || ''); });
  const pts = {}; (ptsR.data || []).forEach(r => { pts[r.player_id] = r; });

  const porJuego = {};
  fixtures.forEach(f => { porJuego[f.game_id] = { fixture: f, goles: [], tarjetas: [], mejores: {} }; });
  (golR.data || []).forEach(g => porJuego[g.game_id] && porJuego[g.game_id].goles.push(
    { team: g.team_id, minute: g.minute, tipo: g.goal_type, nombre: nombre[g.scorer_player_id] || '' }));
  (tarR.data || []).forEach(c => porJuego[c.game_id] && porJuego[c.game_id].tarjetas.push(
    { team: c.team_id, minute: c.minute, tipo: c.card_type, nombre: nombre[c.player_id] || '' }));
  // Mejor puntaje fantasy de cada equipo en cada partido -> su dorsal.
  (pmsR.data || []).forEach(r => {
    const j = porJuego[r.game_id], p = pts[r.player_id];
    if (!j || !p || p.jersey_number == null) return;
    const m = j.mejores[r.team_id];
    if (!m || p.total_points > m.puntos) j.mejores[r.team_id] = { numero: p.jersey_number, puntos: p.total_points };
  });
  // Todos los que jugaron cada partido, del mejor puntaje fantasy al peor, para la
  // ficha de jugador (los 5 primeros son también la placa Top 5 del partido).
  // Un partido recién cargado puede traer mins_played vacío: ahí cuenta tener puntos.
  (pmsR.data || []).forEach(r => {
    const j = porJuego[r.game_id], p = pts[r.player_id];
    if (!j || !p) return;
    const jugo = r.mins_played != null ? r.mins_played > 0 : !!Number(p.total_points);
    if (!jugo) return;
    (j.jugadores = j.jugadores || []).push({ player_id: r.player_id, nombre: p.player_name || '', pos: p.position_code, numero: p.jersey_number, team: r.team_id, puntos: p.total_points });
  });
  Object.values(porJuego).forEach(j => { j.jugadores = (j.jugadores || []).sort((a, b) => b.puntos - a.puntos); });
  Object.values(porJuego).forEach(j => { j.mejoresNum = {}; Object.keys(j.mejores).forEach(t => { j.mejoresNum[t] = j.mejores[t].numero; }); });
  return (rnCache[clave] = { fixtures, porJuego, kits });
}

// ── Foto por partido: fotos-partido/<game_id>-original.jpg, movible ────
const rnFotoKey = id => 'winning.recap.fotoPos.' + id;
function rnFotoLeer(id) { let p = null; try { p = JSON.parse(localStorage.getItem(rnFotoKey(id))); } catch (e) {} return Object.assign({ x: 50, y: 50, zoom: 1 }, p || {}); }
function rnFotoGuardar(id, p) {
  try { localStorage.setItem(rnFotoKey(id), JSON.stringify(p)); localStorage.setItem(rnFotoKey(id) + '.op' + rnOpActual(id), JSON.stringify(p)); } catch (e) {}
}
const rnFotoNat = {};
function rnFotoAplicar(card, id) {
  const p = rnFotoLeer(id), el = card.querySelector('.rn-foto'), n = rnFotoNat[id];
  if (!el) return;
  el.style.backgroundPosition = p.x + '% ' + p.y + '%';
  // 1x = la foto llena el marco. Más de 1 agranda; menos de 1 achica y deja
  // bandas oscuras (la foto entera se ve, pero no llena la placa).
  if (Math.abs(p.zoom - 1) > 0.001 && n) { const esc = Math.max(1080 / n.w, 1350 / n.h) * p.zoom; el.style.backgroundSize = Math.round(n.w * esc) + 'px ' + Math.round(n.h * esc) + 'px'; }
  else el.style.backgroundSize = 'cover';
  const w = card.parentElement && card.parentElement.parentElement;
  const lbl = w && w.querySelector('.rn-foto-pos'); if (lbl) lbl.textContent = ((p.x === 50 && p.y === 50) ? 'centrada' : Math.round(p.x) + '% / ' + Math.round(p.y) + '%') + (p.zoom > 1 ? ' · ' + p.zoom.toFixed(2) + 'x' : '');
  const sl = w && w.querySelector('.rn-foto-zoom'); if (sl && Math.abs(+sl.value - p.zoom) > 0.005) sl.value = p.zoom;
}
/* Comprueba si hay foto para el partido; resuelve con su tamaño o null. */
function rnFotoExiste(id) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { rnFotoNat[id] = { w: img.naturalWidth, h: img.naturalHeight }; res(true); };
    img.onerror = () => res(false);
    img.src = 'fotos-partido/' + id + '-original.jpg';
  });
}
/* Aplica la opción k a la placa: cambia la foto, el encuadre sugerido y el texto. */
function rnAplicarOpcion(wrapper, card, id, k) {
  const ops = rnOpciones(id); if (!ops.length) return;
  k = Math.max(0, Math.min(ops.length - 1, k));
  try { localStorage.setItem(rnOpKey(id), JSON.stringify(k)); } catch (e) {}
  const op = ops[k];
  const foto = card.querySelector('.rn-foto');
  delete foto.dataset.aMano;
  foto.style.backgroundImage = `url('${op.archivo}')`;
  delete rnFotoNat[id];
  // Encuadre: si no hay uno guardado por Luchi para esta opción, el sugerido.
  let guardado = null; try { guardado = JSON.parse(localStorage.getItem(rnFotoKey(id) + '.op' + k)); } catch (e) {}
  rnFotoGuardar(id, guardado || op.pos || { x: 50, y: 50, zoom: 1 });
  const img = new Image(); img.onload = () => { rnFotoNat[id] = { w: img.naturalWidth, h: img.naturalHeight }; rnFotoAplicar(card, id); }; img.src = op.archivo;
  rnFotoAplicar(card, id);
  const info = wrapper.querySelector('.rn-foto-info'); if (info) info.outerHTML = rnFotoInfoHtml(id);
  const lbl = wrapper.querySelector('.rn-op-lbl'); if (lbl) lbl.textContent = 'opción ' + (k + 1) + ' de ' + ops.length;
}

function rnOpcionesControles(wrapper, card, id, matchday) {
  const ops = rnOpciones(id);
  const ctl = document.createElement('div');
  ctl.className = 'rn-opciones';
  ctl.innerHTML =
    (ops.length > 1 ? '<button type="button" class="rn-op-prev">‹</button><span class="rn-op-lbl">opción ' + (rnOpActual(id) + 1) + ' de ' + ops.length + '</span><button type="button" class="rn-op-next">otra foto ›</button>' : '') +
    '<button type="button" class="rn-gusto" title="Guarda esta foto y este encuadre como buenos">me gustó ★</button>' +
    '<button type="button" class="rn-nosirve" title="Marca esta foto como mala">no sirve ✕</button>' +
    '<label class="rn-subir">subir archivo<input type="file" accept="image/*"></label>' +
    '<button type="button" class="rn-link">pegar link</button>';
  wrapper.appendChild(ctl);
  const prev = ctl.querySelector('.rn-op-prev'), next = ctl.querySelector('.rn-op-next');
  if (prev) prev.addEventListener('click', () => rnAplicarOpcion(wrapper, card, id, (rnOpActual(id) - 1 + ops.length) % ops.length));
  if (next) next.addEventListener('click', () => rnAplicarOpcion(wrapper, card, id, (rnOpActual(id) + 1) % ops.length));
  const marcar = (bt, tipo) => { const n = rnRegistrar(tipo, id, matchday, card); bt.classList.add('rn-marcado'); bt.textContent = (tipo === 'gusto' ? 'me gustó ★ ' : 'no sirve ✕ ') + '(guardado)'; setTimeout(() => { bt.classList.remove('rn-marcado'); bt.textContent = tipo === 'gusto' ? 'me gustó ★' : 'no sirve ✕'; }, 1800); };
  ctl.querySelector('.rn-gusto').addEventListener('click', e => marcar(e.target, 'gusto'));
  ctl.querySelector('.rn-nosirve').addEventListener('click', e => marcar(e.target, 'no_sirve'));
  // A mano: archivo (seguro para exportar) o link (puede fallar al exportar si el sitio no lo permite).
  const ponerAMano = (src, origen) => {
    const foto = card.querySelector('.rn-foto');
    foto.style.backgroundImage = `url('${src}')`; foto.dataset.aMano = origen;
    delete rnFotoNat[id]; rnFotoGuardar(id, { x: 50, y: 50, zoom: 1 });
    const img = new Image(); img.onload = () => { rnFotoNat[id] = { w: img.naturalWidth, h: img.naturalHeight }; rnFotoAplicar(card, id); }; img.src = src;
    rnFotoAplicar(card, id);
    const info = wrapper.querySelector('.rn-foto-info'); if (info) info.innerHTML = '<b>Foto puesta a mano:</b> ' + gnEscape(origen);
  };
  ctl.querySelector('input[type=file]').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => ponerAMano(r.result, f.name); r.readAsDataURL(f);
  });
  ctl.querySelector('.rn-link').addEventListener('click', () => {
    const u = prompt('Pegá el link de la foto (termina en .jpg, .png o .webp):'); if (!u) return;
    ponerAMano(u.trim(), u.trim().replace(/^https?:\/\/(www\.)?/, '').slice(0, 60));
  });
  // La descarga también se registra (es la señal más fuerte).
  const dl = wrapper.querySelector('.download-btn');
  if (dl) dl.addEventListener('click', () => rnRegistrar('descarga', id, matchday, card));
}

function rnFotoControles(wrapper, card, id) {
  const ctl = document.createElement('div');
  ctl.className = 'rn-foto-ctl';
  ctl.innerHTML = '<label><input type="checkbox" class="rn-foto-mover"> mover / rueda = zoom</label>' +
    '<label>zoom <input type="range" class="rn-foto-zoom" min="0.5" max="3" step="0.01" value="1"></label>' +
    '<button type="button" class="rn-foto-centrar">centrar</button><span class="rn-foto-pos"></span>';
  wrapper.appendChild(ctl);
  const chk = ctl.querySelector('.rn-foto-mover');
  chk.addEventListener('change', () => card.classList.toggle('moviendo', chk.checked));
  ctl.querySelector('.rn-foto-centrar').addEventListener('click', () => { try { localStorage.removeItem(rnFotoKey(id)); } catch (e) {} rnFotoAplicar(card, id); });
  const setZoom = z => { const p = rnFotoLeer(id); p.zoom = Math.max(0.5, Math.min(3, +z || 1)); rnFotoGuardar(id, p); rnFotoAplicar(card, id); };
  ctl.querySelector('.rn-foto-zoom').addEventListener('input', e => setZoom(e.target.value));
  let arr = null;
  card.addEventListener('mousedown', e => {
    if (!chk.checked) return;
    const n = rnFotoNat[id]; if (!n) return;
    const esc = Math.max(1080 / n.w, 1350 / n.h) * rnFotoLeer(id).zoom;
    arr = { x0: e.clientX, y0: e.clientY, pos: rnFotoLeer(id), sobraX: n.w * esc - 1080, sobraY: n.h * esc - 1350, vista: card.getBoundingClientRect().width / 1080 };
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!arr) return;
    const dx = (e.clientX - arr.x0) / arr.vista, dy = (e.clientY - arr.y0) / arr.vista;
    const x = Math.abs(arr.sobraX) > 1 ? Math.max(0, Math.min(100, arr.pos.x - dx / arr.sobraX * 100)) : 50;
    const y = Math.abs(arr.sobraY) > 1 ? Math.max(0, Math.min(100, arr.pos.y - dy / arr.sobraY * 100)) : 50;
    rnFotoGuardar(id, Object.assign(rnFotoLeer(id), { x, y })); rnFotoAplicar(card, id);
  });
  window.addEventListener('mouseup', () => { arr = null; });
  card.addEventListener('wheel', e => { if (!chk.checked) return; e.preventDefault(); setZoom(rnFotoLeer(id).zoom * (e.deltaY < 0 ? 1.05 : 1 / 1.05)); }, { passive: false });
  rnFotoAplicar(card, id);
}

/* De dónde salió cada foto: fotos-partido/elegidas.json, escrito por el
   buscador (o por la elección a mano). */
let rnElegidas = null;
async function rnCargarElegidas() {
  if (rnElegidas) return rnElegidas;
  try { rnElegidas = await (await fetch('fotos-partido/elegidas.json?' + Date.now())).json(); }
  catch (e) { rnElegidas = {}; }
  return rnElegidas;
}
/* Las opciones de foto de un partido: lo que dejó el buscador (varias) o,
   si la foto se puso a mano antes, esa sola. */
function rnOpciones(id) {
  const e = (rnElegidas || {})[id];
  if (!e) return [];
  if (Array.isArray(e.opciones) && e.opciones.length) return e.opciones;
  return [{ archivo: 'fotos-partido/' + id + '-original.jpg', medio: e.medio, tam: e.tam, escala: e.escala, que: e.que, porque: e.porque, como: e.como, url: e.url, nota: e.nota, pos: e.pos }];
}
const rnOpKey = id => 'winning.recap.fotoOp.' + id;
function rnOpActual(id) {
  const ops = rnOpciones(id); if (!ops.length) return 0;
  let k = null; try { k = JSON.parse(localStorage.getItem(rnOpKey(id))); } catch (e) {}
  if (k === null || k === undefined) k = ((rnElegidas || {})[id] || {}).elegida || 0;
  // "elegida" es un índice. Si el registro trae otra cosa (pasó el 19-sep: un nombre
  // de archivo), se usa la primera en vez de romper el partido entero.
  k = Number.isInteger(k) ? k : 0;
  return Math.max(0, Math.min(ops.length - 1, k));
}

/* Registro de opiniones: descarga / me gustó / no sirve, con la foto y el
   encuadre del momento. Es la señal para mejorar el buscador. */
function rnRegistrar(tipo, id, matchday, card) {
  let lista = []; try { lista = JSON.parse(localStorage.getItem('winning.recap.opiniones')) || []; } catch (e) {}
  const k = rnOpActual(id), op = rnOpciones(id)[k] || {};
  const foto = card.querySelector('.rn-foto');
  const aMano = foto && foto.dataset.aMano ? foto.dataset.aMano : null;
  lista.push({ ts: new Date().toISOString(), tipo, game_id: id, fecha: matchday, comp: currentComp,
    opcion: aMano ? 'a mano' : (k + 1), medio: aMano || op.medio || null, archivo: aMano ? null : (op.archivo || null),
    sin_foto: !(foto && foto.style.backgroundImage), pos: rnFotoLeer(id) });
  try { localStorage.setItem('winning.recap.opiniones', JSON.stringify(lista)); } catch (e) {}
  return lista.length;
}
function rnExportarRegistro() {
  let lista = []; try { lista = JSON.parse(localStorage.getItem('winning.recap.opiniones')) || []; } catch (e) {}
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(lista, null, 1));
  a.download = 'opiniones-fotos.json'; a.click();
}

function rnFotoInfoHtml(id) {
  const e = rnOpciones(id)[rnOpActual(id)] || (rnElegidas || {})[id];
  if (!e) return '<div class="rn-foto-info"><b>Sin registro:</b> esta foto se puso a mano y no quedó anotado de dónde salió.</div>';
  const linkNota = e.fuente || (typeof e.nota === 'string' && /^https?:/.test(e.nota) ? e.nota : '');
  const nota = linkNota ? ` · <a href="${gnEscape(linkNota)}" target="_blank" rel="noopener">ver nota</a>` : '';
  const partes = [];
  if (e.que) partes.push(`<b>Qué se ve:</b> ${gnEscape(e.que)}`);
  if (e.porque) partes.push(`<span class="rn-porque"><b>Por qué esta:</b> ${gnEscape(e.porque)}</span>`);
  partes.push(`<b>Fuente:</b> ${gnEscape(e.medio || '?')} · ${gnEscape(e.tam || '')}` +
    (e.escala ? (e.escala <= 1.001 ? ' · no se estira' : ' · se estira ' + e.escala + 'x') : '') + nota);
  if (e.como) partes.push(`<b>Cómo se encontró:</b> ${gnEscape(e.como)}`);
  return '<div class="rn-foto-info">' + partes.join('<br>') + '</div>';
}

/* Opciones de las fichas nuevas: qué escudos usar y el registro de opiniones. */
function rnBarraOpciones() {
  const barra = document.createElement('div');
  barra.className = 'rn-barra-opciones';
  const modo = rnModoEscudos();
  barra.innerHTML = '<span>Escudos:</span>' + [['original', 'originales'], ['app', 'escudos de la app'], ['camiseta', 'camisetas con dorsal']]
    .map(([v, t]) => `<label><input type="radio" name="rnEscudos" value="${v}"${modo === v ? ' checked' : ''}> ${t}</label>`).join('') +
    '<button type="button" class="rn-exportar" style="margin-left:auto;font:11px system-ui;padding:2px 8px;background:#222;color:#aaa;border:1px solid #555;border-radius:3px;cursor:pointer" onclick="rnExportarRegistro()">descargar registro de opiniones</button>';
  barra.querySelectorAll('input').forEach(r => r.addEventListener('change', () => rnSetModoEscudos(r.value)));
  return barra;
}

/* Los datos de la fecha se piden una sola vez aunque se abran varios partidos juntos. */
const rnDatosEnCurso = {};
function rnCargarDatosUnaVez(matchday) {
  const k = currentComp + '-' + currentSeason + '-' + matchday;
  return rnDatosEnCurso[k] || (rnDatosEnCurso[k] = rnCargarDatos(matchday).catch(e => { delete rnDatosEnCurso[k]; throw e; }));
}

/* El diseño nuevo, para UN partido: previa, historial, top 5 por equipo, la
   placa resultado con foto (si hay) y SIEMPRE una sin foto, ficha y top 5. */
async function armarPartidoNuevas(row, match, matchday) {
  row.innerHTML = '<div class="match-pendiente">Cargando goles, tarjetas y dorsales…</div>';
  let datos;
  try { datos = await rnCargarDatosUnaVez(matchday); await rnCargarElegidas(); }
  catch (e) { row.innerHTML = '<div class="match-pendiente">No pude cargar los datos del partido: ' + gnEscape(e.message) + '</div>'; return; }
  if (!row.isConnected) return;   // cambiaron de fecha o de diseño mientras cargaba
  row.innerHTML = '';
  const fx = datos.fixtures.find(f => f.home_id === match.home_team.id && f.away_id === match.away_team.id);
  const j = fx && datos.porJuego[fx.game_id];
  if (!j) {
    row.innerHTML = '<div class="match-pendiente">No encontré este partido en el fixture.</div>';
    return;
  }
  const p = { home: { id: fx.home_id, score: match.home_score ?? fx.home_score }, away: { id: fx.away_id, score: match.away_score ?? fx.away_score }, goles: j.goles, tarjetas: j.tarjetas };
  const base = { kits: datos.kits, mejores: j.mejoresNum };
  const nombreArchivo = 'resultado_f' + matchday + '_' + match.home_team.short_name + '_vs_' + match.away_team.short_name;
  await pvAgregar(row, fx, j, match, datos, matchday);
  await hsAgregar(row, fx, match, matchday);
  await top5EquipoAgregar(row, fx, match, datos, matchday);
  const ops = rnOpciones(fx.game_id);
  const hayFoto = ops.length ? true : await rnFotoExiste(fx.game_id);
  if (hayFoto) {
    const k = rnOpActual(fx.game_id);
    const archivo = ops.length ? ops[k].archivo : 'fotos-partido/' + fx.game_id + '-original.jpg';
    // Sin encuadre guardado, arranca con el sugerido por el buscador.
    if (ops.length && !localStorage.getItem(rnFotoKey(fx.game_id)) && ops[k].pos) rnFotoGuardar(fx.game_id, ops[k].pos);
    const conFoto = buildResultadoNueva(p, { ...base, foto: archivo });
    const w = createCardWrapper(conFoto, nombreArchivo);
    rnFotoControles(w, conFoto, fx.game_id);
    if (!rnFotoNat[fx.game_id]) { const img = new Image(); img.onload = () => { rnFotoNat[fx.game_id] = { w: img.naturalWidth, h: img.naturalHeight }; rnFotoAplicar(conFoto, fx.game_id); }; img.src = archivo; }
    rnOpcionesControles(w, conFoto, fx.game_id, matchday);
    w.insertAdjacentHTML('beforeend', rnFotoInfoHtml(fx.game_id));
    row.appendChild(w);
  }
  const sinFoto = buildResultadoNueva(p, base);
  const w2 = createCardWrapper(sinFoto, nombreArchivo + '_sinfoto');
  const dl2 = w2.querySelector('.download-btn'); if (dl2) dl2.addEventListener('click', () => rnRegistrar('descarga', fx.game_id, matchday, sinFoto));
  const nota = document.createElement('div'); nota.className = 'rn-sinfoto';
  nota.textContent = hayFoto ? 'versión sin foto' : 'sin foto (no hay fotos-partido/' + fx.game_id + '-original.jpg)';
  w2.appendChild(nota);
  row.appendChild(w2);
  await fjAgregar(row, fx, j, match, datos, matchday);
  await top5Agregar(row, fx, j, match, datos, matchday);
  document.fonts.ready.then(() => row.querySelectorAll('.card-rn').forEach(rnAjustarTexto));
}

// ══════════════════════════════════════════════════════════════════════
// FICHA DE JUGADOR — partido jugado
// Réplica del frame "Jugador ficha de partido jugado" (Figma, página
// "templates para automatizar"). Por partido: el mejor puntaje fantasy del
// partido, con un selector para cambiar por cualquiera de los seis mejores.
// La foto, por ahora, es la misma del partido (fotos-partido/), con los
// mismos controles; el encuadre se guarda aparte ('fj' + game_id).
// ══════════════════════════════════════════════════════════════════════

const FJ_POS = { ARQ: 'arquero', DEF: 'defensor', VOL: 'volante', DEL: 'delantero' };

/* "Tomás Galván" -> { pila: "Tomás", apellido: "GALVÁN" }.
   "Mateo Pérez Curci" -> "Mateo" / "PÉREZ CURCI" (el primer nombre y el resto). */
function fjPartirNombre(nombre) {
  const p = String(nombre || '').trim().split(/\s+/);
  if (p.length < 2) return { pila: '', apellido: (p[0] || '').toUpperCase() };
  return { pila: p[0], apellido: p.slice(1).join(' ').toUpperCase() };
}
/* "Almada" = "almada" = "ALMADÁ": para el buscador de jugadores. */
const fjSinAcentos = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
/* 14.1 -> "14,1" (una decimal, como en el diseño). */
function fjPuntos(v) { return (Math.round((Number(v) || 0) * 10) / 10).toFixed(1).replace('.', ','); }

/* El contenido de la tarjeta blanca. Se vuelve a pintar al cambiar de jugador. */
function fjCardHtml(jug, p, opts) {
  const n = fjPartirNombre(jug.nombre);
  const kit = opts.kits && opts.kits[jug.team];
  const camiseta = kit ? rnKitHtml(kit, jug.team, jug.numero)
    : `<img class="fj-escudo-grande" src="badges/${jug.team}.png" onerror="this.style.display='none'">`;
  return '<div class="fj-top"><img src="icons/ficha-w.svg" alt=""></div>' +
    '<div class="fj-banda"></div>' +
    `<div class="fj-kit">${camiseta}</div>` +
    `<div class="fj-fila-equipo"><span class="fj-equipo">${gnEscape(jug.equipo)}</span>` +
      `<span class="fj-pos fj-pos-${gnEscape(jug.pos)}">${FJ_POS[jug.pos] || gnEscape(String(jug.pos || '').toLowerCase())}</span></div>` +
    `<div class="fj-nombre"><span class="fj-apellido">${gnEscape(n.apellido)}</span><span class="fj-pila">${gnEscape(n.pila)}</span></div>` +
    `<div class="fj-pts"><span class="fj-pts-num">${fjPuntos(jug.puntos)}</span><span class="fj-pts-lbl">PTS.</span></div>` +
    `<div class="fj-res"><img class="fj-res-local" src="badges/${p.home.id}.png" onerror="this.style.visibility='hidden'">` +
      `<span class="fj-res-txt">${gnEscape(p.home.nombre)} ${p.home.score ?? '-'}-${p.away.score ?? '-'} ${gnEscape(p.away.nombre)}</span>` +
      `<img src="badges/${p.away.id}.png" onerror="this.style.visibility='hidden'"></div>` +
    '<div class="fj-bot"><img src="icons/ficha-wordmark.svg" alt="Winning"></div>' +
    '<div class="fj-ring"></div>';
}

function buildFichaJugador(jug, p, opts) {
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'card card-fj';
  el.dataset.exportPixelRatio = '1';   // PNG de 1080x1350 exactos
  el.innerHTML =
    `<div class="rn-foto" style="${opts.foto ? `background-image:url('${opts.foto}')` : ''}"></div>` +
    `<div class="fj-card">${fjCardHtml(jug, p, opts)}</div>` +
    `<div class="rn-wordmark">${WINNING_LOGO_HTML}</div>`;
  return el;
}

/* Si el nombre del equipo o la línea del resultado no entran, se achican. */
function fjAjustarTexto(card) {
  const escala = card.getBoundingClientRect().width / 1080 || 1;
  const anchoTexto = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width / escala; };
  const ajustar = (el, maxAncho, minTam) => {
    if (!el) return;
    let tam = parseFloat(getComputedStyle(el).fontSize);
    while (anchoTexto(el) > maxAncho && tam > minTam) { tam -= 0.5; el.style.fontSize = tam + 'px'; }
  };
  ajustar(card.querySelector('.fj-equipo'), 196, 13);      // entre la camiseta (x=231) y la etiqueta
  ajustar(card.querySelector('.fj-res-txt'), 500, 14);     // barra de 603 menos escudos y aire
  // El nombre: la línea más ancha de las dos no debe pasar la camiseta.
  const nom = card.querySelector('.fj-nombre');
  if (nom) {
    let tam = 44;
    const lineas = Array.from(nom.children);
    while (Math.max(...lineas.map(anchoTexto)) > 340 && tam > 24) { tam -= 0.5; nom.style.fontSize = tam + 'px'; nom.style.lineHeight = (tam * 36 / 44) + 'px'; }
  }
}

/* Agrega a la fila del partido la ficha del mejor jugador (con foto si hay,
   y siempre una sin foto), con selector de jugador y controles de foto. */
async function fjAgregar(row, fx, j, match, datos, matchday) {
  const jugadores = j.jugadores || [];
  if (!jugadores.length) return;
  const nombres = {};
  nombres[match.home_team.id] = match.home_team.name; nombres[match.away_team.id] = match.away_team.name;
  const p = { home: { id: fx.home_id, score: match.home_score ?? fx.home_score, nombre: match.home_team.name },
              away: { id: fx.away_id, score: match.away_score ?? fx.away_score, nombre: match.away_team.name } };
  jugadores.forEach(x => { x.equipo = nombres[x.team] || ''; });
  const gid = fx.game_id, id = 'fj' + gid;
  const base = { kits: datos.kits };
  const archivoBase = () => 'ficha_f' + matchday + '_' + match.home_team.short_name + '_vs_' + match.away_team.short_name;

  // La foto del partido, con encuadre propio para la ficha.
  if (rnElegidas && rnElegidas[gid] && !rnElegidas[id]) rnElegidas[id] = rnElegidas[gid];
  const ops = rnOpciones(id);
  let hayFoto = ops.length > 0;
  let archivo = null;
  if (hayFoto) {
    const k = rnOpActual(id);
    archivo = ops[k].archivo;
    if (!localStorage.getItem(rnFotoKey(id)) && ops[k].pos) rnFotoGuardar(id, ops[k].pos);
  } else if (await rnFotoExiste(gid)) {
    hayFoto = true; archivo = 'fotos-partido/' + gid + '-original.jpg'; rnFotoNat[id] = rnFotoNat[gid];
  }

  const cards = [];
  const armar = (conFoto) => {
    const card = buildFichaJugador(jugadores[0], p, conFoto ? { ...base, foto: archivo } : base);
    const w = createCardWrapper(card, archivoBase());
    // Selector de jugador: el mejor del partido por defecto, o cualquiera de los que jugaron.
    const ctl = document.createElement('div'); ctl.className = 'fj-ctl';
    const opciones = filtro => jugadores.map((x, i) => [x, i])
      .filter(([x]) => !filtro || fjSinAcentos(x.nombre + ' ' + x.equipo).includes(filtro))
      .map(([x, i]) => `<option value="${i}">${gnEscape(x.nombre)} · ${fjPuntos(x.puntos)} pts · ${gnEscape(x.equipo)}</option>`).join('');
    ctl.innerHTML = '<label>buscar <input type="text" class="fj-buscar" placeholder="apellido o equipo" size="16"></label>' +
      '<label>jugador <select class="fj-jugador">' + opciones('') + '</select></label><span class="fj-cuantos"></span>';
    // Buscador: achica la lista a los que coinciden (sin importar acentos) y elige al primero.
    ctl.querySelector('.fj-buscar').addEventListener('input', e => {
      const sel = ctl.querySelector('select'), antes = sel.value, filtro = fjSinAcentos(e.target.value.trim());
      const html = opciones(filtro);
      ctl.querySelector('.fj-cuantos').textContent = filtro ? (html ? (html.match(/<option/g).length + ' de ' + jugadores.length) : 'nadie con ese nombre') : '';
      if (!html) return;
      sel.innerHTML = html;
      if (!filtro && sel.querySelector(`option[value="${antes}"]`)) { sel.value = antes; return; }
      if (sel.value !== antes) sel.dispatchEvent(new Event('change'));
    });
    ctl.querySelector('select').addEventListener('change', e => {
      const jug = jugadores[+e.target.value];
      card.querySelector('.fj-card').innerHTML = fjCardHtml(jug, p, base);
      document.fonts.ready.then(() => fjAjustarTexto(card));
      const dl = w.querySelector('.download-btn');
      if (dl) { const nuevo = dl.cloneNode(true); dl.replaceWith(nuevo); nuevo.addEventListener('click', () => downloadCard(card, archivoBase() + '_' + fjPartirNombre(jug.nombre).apellido.toLowerCase().replace(/\s+/g, '_'))); }
    });
    w.appendChild(ctl);
    cards.push(card);
    return { card, w, ctl };
  };

  if (hayFoto) {
    const { card, w } = armar(true);
    rnFotoControles(w, card, id);
    if (!rnFotoNat[id]) { const img = new Image(); img.onload = () => { rnFotoNat[id] = { w: img.naturalWidth, h: img.naturalHeight }; rnFotoAplicar(card, id); }; img.src = archivo; }
    rnOpcionesControles(w, card, id, matchday);
    w.insertAdjacentHTML('beforeend', rnFotoInfoHtml(id));
    row.appendChild(w);
  }
  const { card: sinFoto, w: w2, ctl: ctl2 } = armar(false);
  // Todas las fichas sin fondo del partido de una: recorre el selector y baja un PNG por jugador.
  const todas = document.createElement('button'); todas.type = 'button'; todas.className = 'fj-todas';
  todas.style.cssText = 'font:11px system-ui;padding:3px 9px;background:#222;color:#cfcfe0;border:1px solid #555;border-radius:3px;cursor:pointer';
  const rotulo = () => 'descargar las ' + jugadores.length + ' fichas sin fondo';
  todas.textContent = rotulo();
  todas.addEventListener('click', async () => {
    if (todas.disabled) return;
    todas.disabled = true;
    // Con el buscador escrito la lista está recortada: se limpia para recorrer a todos.
    const bus = ctl2.querySelector('.fj-buscar'); if (bus.value) { bus.value = ''; bus.dispatchEvent(new Event('input')); }
    const sel = ctl2.querySelector('select'), antes = sel.value;
    try {
      for (let i = 0; i < jugadores.length; i++) {
        todas.textContent = 'bajando ' + (i + 1) + ' de ' + jugadores.length + '…';
        sel.value = String(i); sel.dispatchEvent(new Event('change'));
        await document.fonts.ready; await new Promise(r => setTimeout(r, 250));
        fjAjustarTexto(sinFoto);
        await downloadCard(sinFoto, archivoBase() + '_' + String(i + 1).padStart(2, '0') + '_' + fjPartirNombre(jugadores[i].nombre).apellido.toLowerCase().replace(/\s+/g, '_'));
        await new Promise(r => setTimeout(r, 350));
      }
    } finally { sel.value = antes; sel.dispatchEvent(new Event('change')); todas.disabled = false; todas.textContent = rotulo(); }
  });
  ctl2.appendChild(todas);
  const nota = document.createElement('div'); nota.className = 'rn-sinfoto';
  nota.textContent = hayFoto ? 'ficha sin foto' : 'ficha sin foto (no hay fotos-partido/' + gid + '-original.jpg)';
  w2.appendChild(nota);
  row.appendChild(w2);
  document.fonts.ready.then(() => cards.forEach(fjAjustarTexto));
}

/* Campo para escribir el título grande de una placa estilo MVPs (ej. "TOP 5 CABJ"). */

/* Los 5 mejores de un equipo por puntos acumulados en el torneo (una consulta
   por equipo, con caché). Nombre, posición y dorsal: los de su último partido. */
const t5eCache = {};
async function top5EquipoCargar(teamId) {
  const clave = currentComp + '-' + currentSeason + '-' + teamId;
  if (t5eCache[clave]) return t5eCache[clave];
  const { data, error } = await db.from(MV_VIEW)
    .select('player_id, player_name, position_code, jersey_number, team_id, total_points, matchday')
    .eq('competition_id', currentComp).eq('season_id', currentSeason).eq('team_id', teamId);
  if (error) throw error;
  const por = {};
  (data || []).forEach(r => {
    const p = por[r.player_id] = por[r.player_id] || { player_id: r.player_id, player_name: r.player_name, position_code: r.position_code, jersey_number: r.jersey_number, team_id: r.team_id, total_points: 0, ultima: -1 };
    p.total_points += Number(r.total_points) || 0;
    if (r.matchday > p.ultima) { p.ultima = r.matchday; p.player_name = r.player_name || p.player_name; p.position_code = r.position_code || p.position_code; if (r.jersey_number != null) p.jersey_number = r.jersey_number; }
  });
  return (t5eCache[clave] = Object.values(por).sort((a, b) => b.total_points - a.total_points).slice(0, 5));
}

/* Dos placas por partido: TOP 5 <local> y TOP 5 <visitante>, por puntos del torneo. */
async function top5EquipoAgregar(row, fx, match, datos, matchday) {
  const torneo = currentComp === 384 ? 'APERTURA' : 'CLAUSURA';

    if (!rows.length) continue;

async function top5Agregar(row, fx, j, match, datos, matchday) {

// PREVIA DEL PARTIDO
// Réplica del frame "Estudian gimnasia pre partido" sin la foto de fondo.
// Pastilla con las camisetas (dorsal del mejor puntaje fantasy de cada
// equipo en el torneo), "Equipo vs Equipo", fecha/hora/estadio; abajo un
// texto libre y "EQUIPO VS EQUIPO" con cada club en su color.
// ══════════════════════════════════════════════════════════════════════

/* teams.primary_color / secondary_color son palabras; si el primario es
   blanco (River, Vélez, Gimnasia, Huracán, Riestra) se usa el secundario. */
const PV_COLORES = { rojo: '#e2201d', azul: '#4972c6', celeste: '#7bb8e8', celesterc: '#7bb8e8', verde: '#2e8b57', amarillo: '#f9be2c', negro: '#111111', granate: '#7a1f2b', marron: '#6b3e26', blanco: '#ffffff' };
let pvColoresCache = null;
async function pvCargarColores() {
  if (pvColoresCache) return pvColoresCache;
  const { data } = await db.from('teams').select('id, primary_color, secondary_color');
  pvColoresCache = {};
  (data || []).forEach(t => {
    const p = String(t.primary_color || '').toLowerCase().trim(), s = String(t.secondary_color || '').toLowerCase().trim();
    const malo = c => !c || c === 'blanco' || c === 'negro';
    const elegido = !malo(p) ? p : (!malo(s) ? s : 'blanco');
    pvColoresCache[t.id] = PV_COLORES[elegido] || '#ffffff';
  });
  return pvColoresCache;
}
/* Dorsal del jugador con más puntos fantasy de cada equipo en el torneo. */
const pvDorsalCache = {};
async function pvCargarDorsales(teamIds) {
  const clave = currentComp + '-' + currentSeason;
  pvDorsalCache[clave] = pvDorsalCache[clave] || {};
  const faltan = teamIds.filter(id => !(id in pvDorsalCache[clave]));
  if (faltan.length) {
    const { data } = await db.from(MV_VIEW).select('player_id, team_id, jersey_number, total_points')
      .eq('competition_id', currentComp).eq('season_id', currentSeason).in('team_id', faltan);
    const suma = {};
    (data || []).forEach(r => {
      const k = r.team_id + ':' + r.player_id;
      suma[k] = suma[k] || { team: r.team_id, numero: r.jersey_number, pts: 0 };
      suma[k].pts += Number(r.total_points) || 0;
      if (r.jersey_number != null) suma[k].numero = r.jersey_number;
    });
    faltan.forEach(id => { pvDorsalCache[clave][id] = null; });
    Object.values(suma).forEach(s => { if (s.numero == null) return; const m = pvDorsalCache[clave][s.team]; if (!m || s.pts > m.pts) pvDorsalCache[clave][s.team] = s; });
  }
  const out = {}; teamIds.forEach(id => { const m = pvDorsalCache[clave][id]; out[id] = m ? m.numero : null; });
  return out;
}

function pvKitHtml(lado, teamId, kits, numero) {
  const kit = kits && kits[teamId];
  const adentro = kit ? rnKitHtml(kit, teamId, numero) : `<img class="pv-escudo" src="badges/${teamId}.png" onerror="this.style.display='none'">`;
  return `<div class="pv-kit pv-kit-${lado}">${adentro}</div>`;
}

/* Achica el título de la pastilla, la línea de equipos y el texto libre si no entran. */
function pvAjustarTexto(card) {
  const escala = card.getBoundingClientRect().width / 1080 || 1;
  const ancho = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width / escala; };
  const ajustar = (el, maxAncho, tamBase, minTam, lh) => {
    if (!el) return;
    let tam = tamBase; el.style.fontSize = tam + 'px'; if (lh) el.style.lineHeight = (tam * lh) + 'px';
    while (ancho(el) > maxAncho && tam > minTam) { tam -= 0.5; el.style.fontSize = tam + 'px'; if (lh) el.style.lineHeight = (tam * lh) + 'px'; }
  };
  ajustar(card.querySelector('.pv-titulo'), 600, 52.9, 28);
  ajustar(card.querySelector('.pv-vs'), 990, 65.8, 34);
  // El texto libre puede ocupar dos renglones; si pide más, se achica.
  const t = card.querySelector('.pv-texto');
  if (t) { let tam = 64.6; t.style.fontSize = tam + 'px'; t.style.lineHeight = (tam * 66 / 64.6) + 'px';
    while (t.getBoundingClientRect().height / escala > 2 * tam * 66 / 64.6 + 1 && tam > 30) { tam -= 0.5; t.style.fontSize = tam + 'px'; t.style.lineHeight = (tam * 66 / 64.6) + 'px'; } }
}

    '<label>texto de abajo <input class="pv-in-texto" size="34" placeholder="ej. LOS 5 MEJORES DE CADA EQUIPO DEL CLÁSICO"></label>';
  const repintar = () => {

// HISTORIAL — frame "historail template" (Figma 1174-9908)
// Escudos, triunfos / empates / triunfos de toda la vida y los hinchas
// Winning de cada club. El historial NO está en la base (sólo hay algunas
// temporadas desde 2020): sale de historial.json, investigado a mano, con
// fuente y fecha por cruce. Todo editable debajo de la placa; lo que se
// corrige queda guardado en el navegador.
// ══════════════════════════════════════════════════════════════════════
const HS_KEY = 'winning.recap.hs.';
let hsHistorialCache = null, hsHinchasCache = null;
async function hsCargarHistorial() {
  if (hsHistorialCache) return hsHistorialCache;
  hsHistorialCache = {};
  try {
    // En winning.com.ar un archivo que no existe devuelve la home con 200: por eso el try.
    const r = await fetch('historial.json?v=' + Date.now());
    const j = JSON.parse(await r.text());
    hsHistorialCache = (j && j.cruces) || {};
  } catch (e) { console.warn('historial.json no disponible', e); }
  return hsHistorialCache;
}
async function hsCargarHinchas() {
  if (hsHinchasCache) return hsHinchasCache;
  const { data, error } = await db.rpc('get_censo_hinchadas');
  if (error) throw error;
  hsHinchasCache = {};
  (data || []).forEach(r => { hsHinchasCache[r.team_id] = Number(r.fan_count) || 0; });
  return hsHinchasCache;
}
function hsNum(v) {
  if (v == null || v === '') return '–';
  const n = Number(v);
  return isFinite(n) ? n.toLocaleString('es-AR') : String(v);
}

function buildHistorial(p) {
  const el = document.createElement('div');
  el.className = 'card card-hs';
  el.dataset.exportPixelRatio = '1';
  const escudo = (lado, id) => `<div class="hs-escudo hs-escudo-${lado}"><img src="escudos/${id}.png" onerror="if(!this.dataset.alt){this.dataset.alt=1;this.src='badges/${id}.png';}else{this.style.display='none';}"></div>`;
  const caja = (i, v) => `<div class="hs-caja hs-caja-${i}"><div class="hs-t hs-num">${gnEscape(hsNum(v))}</div></div>`;
  const hinchas = (lado, eq) =>
    `<div class="hs-pill hs-pill-${lado}" style="background:${eq.color}"><div class="hs-t hs-pill-num"${hsNum(eq.hinchas).length > 5 ? ' style="font-size:40px"' : ''}>${gnEscape(hsNum(eq.hinchas))}</div></div>` +
    `<div class="hs-t hs-hinchas hs-hinchas-${lado}">HINCHAS WINNING</div>`;
  el.innerHTML =
    '<div class="hs-fondo"></div><div class="hs-foto hs-foto-local"></div><div class="hs-foto hs-foto-visita"></div><div class="hs-sep"></div><div class="hs-scrim"></div>' +
    escudo('local', p.home.id) + '<div class="hs-t hs-e">E</div>' + escudo('visita', p.away.id) +
    caja(0, p.home.triunfos) + caja(1, p.empates) + caja(2, p.away.triunfos) +
    '<div class="hs-t hs-rot hs-rot-0">TRIUNFOS</div><div class="hs-t hs-rot hs-rot-1">EMPATES</div><div class="hs-t hs-rot hs-rot-2">TRIUNFOS</div>' +
    hinchas('local', p.home) + hinchas('visita', p.away) +
    '<div class="hs-t hs-titulo">HISTORIAL</div>' +
    `<div class="rn-wordmark">${WINNING_LOGO_HTML}</div>`;
  return el;
}

async function hsAgregar(row, fx, match, matchday) {
  const home = match.home_team || {}, away = match.away_team || {};
  let colores = {}, hinchas = {}, historial = {};
  try { [colores, hinchas, historial] = await Promise.all([pvCargarColores(), hsCargarHinchas(), hsCargarHistorial()]); }
  catch (e) { console.warn('historial: datos incompletos', e); }
  // En historial.json la clave es "idMenor-idMayor": a = triunfos del id menor, b = del mayor.
  const menor = Math.min(fx.home_id, fx.away_id), mayor = Math.max(fx.home_id, fx.away_id);
  const clave = menor + '-' + mayor;
  const h = historial[clave] || null;
  const localEsMenor = fx.home_id === menor;
  // Los blancos de PV_COLORES no sirven de pastilla (el número es blanco).
  const color = id => (colores[id] && colores[id] !== '#ffffff') ? colores[id] : '#2b2b2b';
  const p = {
    home: { id: fx.home_id, triunfos: h ? (localEsMenor ? h.a : h.b) : null, hinchas: hinchas[fx.home_id] ?? null, color: color(fx.home_id) },
    away: { id: fx.away_id, triunfos: h ? (localEsMenor ? h.b : h.a) : null, hinchas: hinchas[fx.away_id] ?? null, color: color(fx.away_id) },
    empates: h ? h.e : null,
  };
  let guardado = null;
  try { guardado = JSON.parse(localStorage.getItem(HS_KEY + clave + '.' + fx.home_id) || 'null'); } catch (e) {}
  // Una corrección a mano vale mientras historial.json no traiga un dato más nuevo para el cruce.
  if (guardado && h && guardado.al !== h.al) guardado = null;
  if (guardado) { p.home.triunfos = guardado.tl; p.empates = guardado.e; p.away.triunfos = guardado.tv; }

  const archivo = 'historial_f' + matchday + '_' + (home.short_name || fx.home_id) + '_vs_' + (away.short_name || fx.away_id);
  const card = buildHistorial(p);
  card.dataset.filename = archivo;
  const w = createCardWrapper(card, archivo);
  const ctl = document.createElement('div'); ctl.className = 'pv-ctl';
  const campo = (cls, rot, v) => `<label>${rot} <input class="hs-in ${cls}" inputmode="numeric" value="${v == null ? '' : gnEscape(v)}"></label>`;
  ctl.innerHTML = campo('hs-in-tl', 'triunfos ' + gnEscape(home.short_name || 'local'), p.home.triunfos) + campo('hs-in-e', 'empates', p.empates) +
    campo('hs-in-tv', 'triunfos ' + gnEscape(away.short_name || 'visita'), p.away.triunfos) +
    campo('hs-in-hl', 'hinchas ' + gnEscape(home.short_name || 'local'), p.home.hinchas) + campo('hs-in-hv', 'hinchas ' + gnEscape(away.short_name || 'visita'), p.away.hinchas);
  const val = cls => { const v = ctl.querySelector('.' + cls).value.replace(/\D/g, ''); return v === '' ? null : Number(v); };
  const repintar = () => {
    p.home.triunfos = val('hs-in-tl'); p.empates = val('hs-in-e'); p.away.triunfos = val('hs-in-tv');
    p.home.hinchas = val('hs-in-hl'); p.away.hinchas = val('hs-in-hv');
    // Sólo el historial se guarda: los hinchas cambian todos los días y vienen de la base.
    try { localStorage.setItem(HS_KEY + clave + '.' + fx.home_id, JSON.stringify({ tl: p.home.triunfos, e: p.empates, tv: p.away.triunfos, al: h ? h.al : null })); } catch (e) {}
    // Sólo los números: rearmar la placa entera borraría las fotos puestas.
    const nums = card.querySelectorAll('.hs-num');
    [p.home.triunfos, p.empates, p.away.triunfos].forEach((v, i) => { nums[i].textContent = hsNum(v); });
    card.querySelectorAll('.hs-pill-num').forEach((el, i) => {
      const t = hsNum(i === 0 ? p.home.hinchas : p.away.hinchas);
      el.textContent = t; el.style.fontSize = t.length > 5 ? '40px' : '';
    });
  };
  ctl.querySelectorAll('input').forEach(i => i.addEventListener('input', repintar));
  w.appendChild(ctl);
  const nota = document.createElement('div'); nota.className = 'rn-sinfoto';
  if (guardado) nota.textContent = 'historial corregido a mano en este navegador';
  else if (h) nota.innerHTML = 'historial al ' + gnEscape(h.al || '?') + (h.fuente ? ' · <a href="' + gnEscape(h.fuente) + '" target="_blank" rel="noopener" style="color:inherit">fuente</a>' : '') + (h.conf ? ' · confianza ' + gnEscape(h.conf) : '') + (h.nota ? ' · ' + gnEscape(h.nota) : '');
  else { nota.textContent = 'SIN HISTORIAL CARGADO para este cruce: completar a mano'; nota.style.color = '#ff8a7a'; }
  if (h && h.conf === 'baja' && !guardado) nota.style.color = '#ff8a7a';
  w.appendChild(nota);
  hsFotoControles(w, card, home.short_name || 'local', away.short_name || 'visita');
  row.appendChild(w);
}

/* Fotos de la placa historial: una por mitad (541x1350). Se suben a mano y
   viven sólo en la página abierta (una data URL no entra en localStorage). */
function hsFotoControles(wrapper, card, nomLocal, nomVisita) {
  const W = 541, H = 1350;
  const est = { local: { src: null, nat: null, x: 50, y: 50, zoom: 1 }, visita: { src: null, nat: null, x: 50, y: 50, zoom: 1 } };
  const ctl = document.createElement('div'); ctl.className = 'hs-foto-ctl';
  const fila = (lado, nom) => `<div class="hs-fila" data-lado="${lado}"><b>foto ${gnEscape(nom)}</b><label class="hs-subir">subir archivo<input type="file" accept="image/*"></label>` +
    '<button type="button" class="hs-link">pegar link</button><button type="button" class="hs-quitar">quitar</button>' +
    '<label>zoom <input type="range" class="hs-zoom" min="1" max="3" step="0.01" value="1"></label></div>';
  ctl.innerHTML = fila('local', nomLocal) + fila('visita', nomVisita) +
    '<div class="hs-fila"><label><input type="checkbox" class="hs-mover"> mover foto / rueda = zoom</label>' +
    '<label><input type="checkbox" class="hs-marco" checked> separador + degradé</label></div>' +
    '<div class="hs-fila hs-estado"></div>';
  wrapper.appendChild(ctl);
  const estado = ctl.querySelector('.hs-estado');
  const aplicar = lado => {
    const e = est[lado], el = card.querySelector('.hs-foto-' + lado);
    if (!e.src) { el.style.backgroundImage = ''; el.style.backgroundSize = ''; el.style.backgroundPosition = ''; }
    else {
      el.style.backgroundImage = `url('${e.src}')`;
      el.style.backgroundPosition = e.x + '% ' + e.y + '%';
      if (e.nat && e.zoom > 1.001) { const esc = Math.max(W / e.nat.w, H / e.nat.h) * e.zoom; el.style.backgroundSize = Math.round(e.nat.w * esc) + 'px ' + Math.round(e.nat.h * esc) + 'px'; }
      else el.style.backgroundSize = 'cover';
    }
    const hay = !!(est.local.src || est.visita.src);
    card.classList.toggle('hs-con-foto', hay);
    estado.textContent = hay ? 'se descarga completa, con las fotos'
      : (card.classList.contains('hs-sin-marco') ? 'se descarga sin fondo' : 'se descarga sin fondo, con separador y degradé (las fotos van atrás en Figma)');
  };
  const poner = (lado, src) => {
    Object.assign(est[lado], { src, nat: null, x: 50, y: 50, zoom: 1 });
    ctl.querySelector(`[data-lado="${lado}"] .hs-zoom`).value = 1;
    const img = new Image(); img.onload = () => { est[lado].nat = { w: img.naturalWidth, h: img.naturalHeight }; aplicar(lado); }; img.src = src;
    aplicar(lado);
  };
  ctl.querySelectorAll('[data-lado]').forEach(f => {
    const lado = f.dataset.lado;
    f.querySelector('input[type=file]').addEventListener('change', e => {
      const a = e.target.files && e.target.files[0]; if (!a) return;
      const r = new FileReader(); r.onload = () => poner(lado, r.result); r.readAsDataURL(a);
      e.target.value = '';
    });
    // Un link puede fallar al exportar si el sitio de origen no lo permite; el archivo siempre anda.
    f.querySelector('.hs-link').addEventListener('click', () => { const u = prompt('Pegá el link de la foto (termina en .jpg, .png o .webp):'); if (u) poner(lado, u.trim()); });
    f.querySelector('.hs-quitar').addEventListener('click', () => { est[lado].src = null; aplicar(lado); });
    f.querySelector('.hs-zoom').addEventListener('input', e => { est[lado].zoom = Math.max(1, Math.min(3, +e.target.value || 1)); aplicar(lado); });
  });
  const chk = ctl.querySelector('.hs-mover');
  chk.addEventListener('change', () => card.classList.toggle('moviendo', chk.checked));
  ctl.querySelector('.hs-marco').addEventListener('change', e => { card.classList.toggle('hs-sin-marco', !e.target.checked); aplicar('local'); });
  // La mitad se decide por dónde cae el cursor dentro de la placa.
  const ladoDe = e => { const r = card.getBoundingClientRect(); return (e.clientX - r.left) < r.width / 2 ? 'local' : 'visita'; };
  let arr = null;
  card.addEventListener('mousedown', e => {
    if (!chk.checked) return;
    const lado = ladoDe(e), s = est[lado]; if (!s.src || !s.nat) return;
    const esc = Math.max(W / s.nat.w, H / s.nat.h) * s.zoom;
    arr = { lado, x0: e.clientX, y0: e.clientY, x: s.x, y: s.y, sobraX: s.nat.w * esc - W, sobraY: s.nat.h * esc - H, vista: card.getBoundingClientRect().width / 1080 };
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!arr) return;
    const dx = (e.clientX - arr.x0) / arr.vista, dy = (e.clientY - arr.y0) / arr.vista, s = est[arr.lado];
    s.x = arr.sobraX > 1 ? Math.max(0, Math.min(100, arr.x - dx / arr.sobraX * 100)) : 50;
    s.y = arr.sobraY > 1 ? Math.max(0, Math.min(100, arr.y - dy / arr.sobraY * 100)) : 50;
    aplicar(arr.lado);
  });
  window.addEventListener('mouseup', () => { arr = null; });
  card.addEventListener('wheel', e => {
    if (!chk.checked) return;
    const lado = ladoDe(e), s = est[lado]; if (!s.src) return;
    e.preventDefault();
    s.zoom = Math.max(1, Math.min(3, s.zoom * (e.deltaY < 0 ? 1.05 : 1 / 1.05)));
    ctl.querySelector(`[data-lado="${lado}"] .hs-zoom`).value = s.zoom;
    aplicar(lado);
  }, { passive: false });
  aplicar('local');
}

// CONTENIDO ESPECIAL — lo que NO se hace para los 15 partidos
// Un bloque propio arriba de las fichas de partido. Qué especiales hay en cada
// fecha, y su contenido editorial, sale de especiales.json (lo escribe Luchi y
// se carga a mano): clave "<torneo>-<temporada>-<fecha>", lista de especiales.
// Tipos: 'mejor-clasico' (portada + un slide por clásico histórico).
// Previsto y sin hacer: 'ultimos-5'.
// ══════════════════════════════════════════════════════════════════════
const CE_KEY = 'winning.recap.ce.';
let ceCache = null;
async function ceCargar() {
  if (ceCache) return ceCache;
  ceCache = {};
  try {
    // En winning.com.ar un archivo que no existe devuelve la home con 200: por eso el try.
    const r = await fetch('especiales.json?v=' + Date.now());
    ceCache = JSON.parse(await r.text()) || {};
  } catch (e) { console.warn('especiales.json no disponible', e); }
  return ceCache;
}
/* Los PNG de escudos traen márgenes transparentes muy distintos (el de Gimnasia casi la
   mitad, el de Boca nada): se recorta al dibujo para que todos ocupen lo mismo. */
function ceRecortarEscudo(img) {
  if (img.dataset.recortado) return; img.dataset.recortado = '1';
  try {
    const w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) return;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (d[(j * w + i) * 4 + 3] > 16) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
    if (x1 < 0 || (x0 === 0 && y0 === 0 && x1 === w - 1 && y1 === h - 1)) return;
    const r = document.createElement('canvas'); r.width = x1 - x0 + 1; r.height = y1 - y0 + 1;
    r.getContext('2d').drawImage(c, x0, y0, r.width, r.height, 0, 0, r.width, r.height);
    img.src = r.toDataURL('image/png');
  } catch (e) { /* imagen de otro origen: queda como vino */ }
}
const ceEscudo = (lado, id) => `<div class="ce-escudo ce-escudo-${lado}"><img src="escudos/${id}.png" onload="ceRecortarEscudo(this)" onerror="if(!this.dataset.alt){this.dataset.alt=1;this.src='badges/${id}.png';}else{this.style.display='none';}"></div>`;

/* Un renglón del título de la portada, con el nombre de cada club pintado de su color.
   pal = [{ texto: 'SAN LORENZO', color }, { texto: 'BOCA', color }]; la más larga primero,
   para que "BOCA JUNIORS" no quede a medio pintar por "BOCA". */
function ceTituloInner(texto, pal) {
  let partes = [{ t: String(texto || '') }];
  pal.filter(p => p.texto && p.texto.trim()).sort((a, b) => b.texto.length - a.texto.length).forEach(p => {
    const busca = fjSinAcentos(p.texto.trim());
    partes = partes.flatMap(x => {
      if (x.color) return [x];
      const out = []; let resto = x.t, i;
      while ((i = fjSinAcentos(resto).indexOf(busca)) >= 0) { if (i) out.push({ t: resto.slice(0, i) }); out.push({ t: resto.slice(i, i + busca.length), color: p.color }); resto = resto.slice(i + busca.length); }
      if (resto) out.push({ t: resto });
      return out;
    });
  });
  return partes.map(x => x.color ? `<b style="font-weight:inherit;color:${x.color}">${gnEscape(x.t)}</b>` : gnEscape(x.t)).join('');
}
const cePalabras = (e, ctx) => [{ texto: e.portada.palabra_local, color: e.portada.color_local || ctx.colorLocal }, { texto: e.portada.palabra_visita, color: e.portada.color_visita || ctx.colorVisita }];
function buildClasicoPortada(e, ctx) {
  const el = document.createElement('div');
  // card-hs: comparte con la placa Historial las capas de fondo y sus controles de foto.
  el.className = 'card card-hs card-ce card-ce-portada';
  el.dataset.exportPixelRatio = '1';
  el.innerHTML =
    '<div class="hs-fondo"></div><div class="hs-foto hs-foto-local"></div><div class="hs-foto hs-foto-visita"></div><div class="hs-sep"></div><div class="hs-scrim"></div>' +
    `<div class="ce-t ce-linea">${gnEscape(e.portada.linea || ctx.lineaAuto)}</div>` +
    `<div class="ce-tit ce-tit-1">${ceTituloInner(e.portada.titulo1, cePalabras(e, ctx))}</div><div class="ce-tit ce-tit-2">${ceTituloInner(e.portada.titulo2, cePalabras(e, ctx))}</div>` +
    ceEscudo('local', e.home_id) + ceEscudo('visita', e.away_id) +
    `<div class="rn-wordmark">${WINNING_LOGO_HTML}</div>`;
  return el;
}
function buildClasicoSlide(s) {
  const el = document.createElement('div');
  el.className = 'card card-ce card-ce-slide';
  el.dataset.exportPixelRatio = '1';
  el.innerHTML =

    ceEscudo('visita', s.visita_id);
  return el;
}
/* Achica lo que no entra: renglones de la portada, el título del slide (hasta dos
   renglones de 960) y la línea de la pastilla. */
function ceAjustarTexto(card) {
  const escala = card.getBoundingClientRect().width / 1080 || 1;
  const ancho = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width / escala; };
  const bajar = (els, medir, max, base, min, lh) => {
    let tam = base; els.forEach(x => { x.style.fontSize = tam + 'px'; if (lh) x.style.lineHeight = (tam * lh) + 'px'; });
    while (ancho(medir) > max && tam > min) { tam -= 0.5; els.forEach(x => { x.style.fontSize = tam + 'px'; if (lh) x.style.lineHeight = (tam * lh) + 'px'; }); }
  };
  card.querySelectorAll('.ce-tit').forEach(t => bajar([t], t, 1000, 61.1, 30));
  // Los dos renglones del título van al mismo tamaño: el del que más hubo que achicar.
  const tits = Array.from(card.querySelectorAll('.ce-tit'));
  if (tits.length) { const menor = Math.min(...tits.map(x => parseFloat(x.style.fontSize) || 61.1)); tits.forEach(x => { x.style.fontSize = menor + 'px'; }); }
  const lin = card.querySelector('.ce-linea'); if (lin) bajar([lin], lin, 1000, 35.9, 20);
  // El título del slide: como mucho dos renglones; si el texto pide más, se achica.
  const tit = card.querySelector('.ce-titulo');
  if (tit) {
    let tam = 90.7; const poner = () => { tit.style.fontSize = tam + 'px'; tit.style.lineHeight = (tam * 91 / 90.7) + 'px'; };
    poner();
    while (tit.getBoundingClientRect().height / escala > 2 * tam * 91 / 90.7 + 2 && tam > 40) { tam -= 1; poner(); }
  }
  // La línea de la pastilla: en un renglón si entra; si no, se parte en " | " y va en dos.
  const dato = card.querySelector('.ce-dato');
  if (dato) {
    const SALTO = String.fromCharCode(10);
    const entero = dato.textContent.split(SALTO).map(x => x.trim()).join(' | ');
    const medir = () => { const r = document.createRange(); r.selectNodeContents(dato); return r.getBoundingClientRect().width / escala; };
    const probar = (texto, base, min, lh) => {
      dato.textContent = texto; let tam = base;
      const poner = () => { dato.style.fontSize = tam + 'px'; dato.style.lineHeight = (tam * lh) + 'px'; };
      poner(); while (medir() > 750 && tam > min) { tam -= 0.5; poner(); }
      return medir() <= 750;
    };
    const corte = entero.indexOf(' | ');
    if (corte < 0) probar(entero, 24, 14, 28 / 24);
    else if (!probar(entero, 24, 21, 28 / 24)) probar(entero.slice(0, corte) + SALTO + entero.slice(corte + 3), 23, 14, 1.15);
  }
  card.querySelectorAll('.ce-gol').forEach(g => { g.style.fontSize = (g.textContent.trim().length > 1 ? 150 : 244) + 'px'; });
}

/* Foto a sangre de un slide: se sube a mano y se mueve con los controles de siempre. */
function ceFotoSlide(wrapper, card, idFoto) {
  const fila = document.createElement('div'); fila.className = 'ce-fila';
  fila.innerHTML = '<span>foto</span><label class="ce-subir">subir archivo<input type="file" accept="image/*"></label>' +
    '<button type="button" class="ce-link">pegar link</button><button type="button" class="ce-sinfoto">quitar</button>';
  const poner = src => {
    const foto = card.querySelector('.rn-foto');
    foto.style.backgroundImage = src ? `url('${src}')` : '';
    card.classList.toggle('ce-con-foto', !!src);
    delete rnFotoNat[idFoto]; try { localStorage.removeItem(rnFotoKey(idFoto)); } catch (e) {}
    if (src) { const img = new Image(); img.onload = () => { rnFotoNat[idFoto] = { w: img.naturalWidth, h: img.naturalHeight }; rnFotoAplicar(card, idFoto); }; img.src = src; }
    rnFotoAplicar(card, idFoto);
  };
  fila.querySelector('input').addEventListener('change', e => {
    const a = e.target.files && e.target.files[0]; if (!a) return;
    const r = new FileReader(); r.onload = () => poner(r.result); r.readAsDataURL(a); e.target.value = '';
  });
  // Un link puede fallar al exportar si el sitio de origen no lo permite; el archivo siempre anda.
  fila.querySelector('.ce-link').addEventListener('click', () => { const u = prompt('Pegá el link de la foto (termina en .jpg, .png o .webp):'); if (u) poner(u.trim()); });
  fila.querySelector('.ce-sinfoto').addEventListener('click', () => poner(null));
  return fila;
}

/* Arma las placas de un especial 'mejor-clasico' dentro de su renglón. */
async function ceArmarMejorClasico(row, e, clave, matchday) {
  const { matches } = partidosDeLaFecha;
  const match = matches.find(m => m.home_team.id === e.home_id && m.away_team.id === e.away_id) || null;
  let colores = {}, estadios = {};
  try { [colores, estadios] = await Promise.all([pvCargarColores(), fxLoadStadiums()]); } catch (err) { console.warn('especial: datos incompletos', err); }
  const color = id => colores[id] || '#ffffff';
  const corto = id => { const t = match && (match.home_team.id === id ? match.home_team : match.away_team.id === id ? match.away_team : null); return (t && t.short_name) || id; };
  let lineaAuto = '';
  if (match && match.kickoff_local) {
    const k = new Date(match.kickoff_local);
    const dia = new Intl.DateTimeFormat('es-AR', { timeZone: FX_TZ, weekday: 'long' }).format(k);
    lineaAuto = 'Este ' + dia + ' · ' + fxTimeFmt.format(k) + ' · hay clásico' + (estadios[e.home_id] ? ' en el ' + estadios[e.home_id] : '');
  }
  const ctx = { lineaAuto, colorLocal: color(e.home_id), colorVisita: color(e.away_id) };

  // Lo editado a mano vale mientras especiales.json no traiga una versión nueva de este especial.
  const kGuardado = CE_KEY + clave;
  try { const g = JSON.parse(localStorage.getItem(kGuardado) || 'null'); if (g && g.v === (e.v || 0)) { e.portada = g.portada; e.slides = g.slides; } } catch (err) {}
  const guardar = () => { try { localStorage.setItem(kGuardado, JSON.stringify({ v: e.v || 0, portada: e.portada, slides: e.slides })); } catch (err) {} };
  const base = 'clasico_f' + matchday + '_' + corto(e.home_id) + '_vs_' + corto(e.away_id);
  const campo = (rot, cls, val, tipo) => tipo === 'area'
    ? `<label><span>${rot}</span><textarea class="${cls}" rows="2">${gnEscape(val || '')}</textarea></label>`
    : `<label><span>${rot}</span><input type="text" class="${cls}" value="${gnEscape(val ?? '')}"></label>`;

  const acciones = document.createElement('div'); acciones.className = 'ce-acciones';
  acciones.innerHTML = '<button type="button" class="ce-bajar-todo"></button><button type="button" class="ce-mas">+ agregar slide</button>' +
    (e.nota ? `<span class="ce-aviso">${gnEscape(e.nota)}</span>` : '');
  row.before(acciones);
  const cards = () => Array.from(row.querySelectorAll('.card-ce'));
  const rotular = () => { acciones.querySelector('.ce-bajar-todo').textContent = 'descargar las ' + cards().length + ' placas'; pintarBarraEspeciales(); };
  const nombreDe = card => { const i = cards().indexOf(card); return base + '_' + String(i).padStart(2, '0') + (i === 0 ? '_portada' : '_' + fjSinAcentos(card.querySelector('.ce-titulo').textContent).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 30)); };
  const engancharDescarga = (w, card) => { const dl = w.querySelector('.download-btn'); const n = dl.cloneNode(true); dl.replaceWith(n); n.addEventListener('click', () => downloadCard(card, nombreDe(card))); };

  // ── Portada ──
  const portada = buildClasicoPortada(e, ctx);
  const wp = createCardWrapper(portada, base + '_00_portada');
  engancharDescarga(wp, portada);
  const cp = document.createElement('div'); cp.className = 'ce-ctl';
  cp.innerHTML = campo('línea', 'ce-in-linea', e.portada.linea || '') + campo('título 1', 'ce-in-t1', e.portada.titulo1) + campo('título 2', 'ce-in-t2', e.portada.titulo2) +
    campo('palabra ' + corto(e.home_id), 'ce-in-pl', e.portada.palabra_local) + campo('palabra ' + corto(e.away_id), 'ce-in-pv', e.portada.palabra_visita) +
    `<div class="ce-fila"><span>color ${gnEscape(corto(e.home_id))}</span><input type="color" class="ce-in-cl" value="${e.portada.color_local || ctx.colorLocal}"><span>color ${gnEscape(corto(e.away_id))}</span><input type="color" class="ce-in-cv" value="${e.portada.color_visita || ctx.colorVisita}"></div>`;
  // Qué palabra del título lleva el color de cada club (por defecto, el nombre del club).
  const nombreDeEquipo = id => { const t = match && (match.home_team.id === id ? match.home_team : match.away_team.id === id ? match.away_team : null); return t ? String(t.name || '').toUpperCase() : ''; };
  if (e.portada.palabra_local == null) e.portada.palabra_local = nombreDeEquipo(e.home_id);
  if (e.portada.palabra_visita == null) e.portada.palabra_visita = nombreDeEquipo(e.away_id);
  const pintarTitulo = () => [[1, e.portada.titulo1], [2, e.portada.titulo2]].forEach(([k, t]) => { portada.querySelector('.ce-tit-' + k).innerHTML = ceTituloInner(t, cePalabras(e, ctx)); });
  pintarTitulo();
  cp.querySelector('.ce-in-linea').placeholder = lineaAuto || 'Este domingo · 14:45 · hay clásico en…';
  cp.addEventListener('input', () => {
    e.portada.color_local = cp.querySelector('.ce-in-cl').value; e.portada.color_visita = cp.querySelector('.ce-in-cv').value;
    e.portada.palabra_local = cp.querySelector('.ce-in-pl').value; e.portada.palabra_visita = cp.querySelector('.ce-in-pv').value;
    e.portada.linea = cp.querySelector('.ce-in-linea').value; e.portada.titulo1 = cp.querySelector('.ce-in-t1').value; e.portada.titulo2 = cp.querySelector('.ce-in-t2').value;
    portada.querySelector('.ce-linea').textContent = e.portada.linea || lineaAuto;
    pintarTitulo();
    ceAjustarTexto(portada); guardar();
  });
  wp.appendChild(cp);
  hsFotoControles(wp, portada, corto(e.home_id), corto(e.away_id));
  row.appendChild(wp);

  // ── Slides ──

/* La lista de especiales de la fecha: un renglón desplegable por cada uno. */
async function pintarEspeciales(matchday) {
  const cont = document.getElementById('especialesContainer');
  if (!cont) return;
  cont.innerHTML = '';
  const todos = await ceCargar();
  if (fechaActual !== matchday) return;   // cambiaron de fecha mientras cargaba
  const lista = (todos[currentComp + '-' + currentSeason + '-' + matchday] || []).filter(e => CE_TIPOS[e.tipo]);
  if (!lista.length) return;
  const { matches } = partidosDeLaFecha;
  cont.innerHTML = '<div class="match-toggle" style="cursor:default"><b>CONTENIDO ESPECIAL</b><span>' + lista.length + (lista.length === 1 ? ' especial' : ' especiales') + ' en esta fecha</span></div>';
  lista.forEach((orig, i) => {
    const e = JSON.parse(JSON.stringify(orig)); e.portada = e.portada || {};
    const tipo = CE_TIPOS[e.tipo];
    const m = matches.find(x => x.home_team.id === e.home_id && x.away_team.id === e.away_id);
    const nombre = m ? m.home_team.name + ' vs ' + m.away_team.name : e.home_id + ' vs ' + e.away_id;
    const clave = currentComp + '-' + currentSeason + '-' + matchday + '.' + e.tipo + '.' + e.home_id + '-' + e.away_id;
    const section = document.createElement('div');
    section.className = 'match-section match-acordeon';
    section.innerHTML = '<button type="button" class="match-head ce-head"><span class="match-flecha">▸</span>' +
      `<h3>${gnEscape(tipo.rotulo)} · ${gnEscape(nombre)}</h3><span class="match-estado">${tipo.placas(e)} placas</span></button>` +
      '<div class="cards-row" style="display:none"></div>';
    const row = section.querySelector('.cards-row');
    section.querySelector('.match-head').addEventListener('click', async () => {
      const abrir = !section.classList.contains('is-abierto');
      section.classList.toggle('is-abierto', abrir);
      section.querySelector('.match-flecha').textContent = abrir ? '▾' : '▸';
      row.style.display = abrir ? '' : 'none';
      const acc = section.querySelector('.ce-acciones'); if (acc) acc.style.display = abrir ? '' : 'none';
      if (abrir && !row.dataset.armado) { row.dataset.armado = '1'; await tipo.armar(row, e, clave, matchday); }
    });
    cont.appendChild(section);
  });
}

/* Arma las placas de un partido la primera vez que se abre. */
async function abrirPartido(section, match, matchday) {
  const row = section.querySelector('.cards-row');
  section.classList.add('is-abierto');
  section.querySelector('.match-flecha').textContent = '▾';
  row.style.display = '';
  if (!row.dataset.armado) {
    row.dataset.armado = '1';
    if (disenoPartidos === 'nuevas') await armarPartidoNuevas(row, match, matchday);
    else armarPartidoAntiguas(row, match, matchday);
  }
  pintarBarraPartidos();
}
function cerrarPartido(section) {
  section.classList.remove('is-abierto');
  section.querySelector('.match-flecha').textContent = '▸';
  section.querySelector('.cards-row').style.display = 'none';
  pintarBarraPartidos();
}

async function pintarPartidos() {
  const cont = document.getElementById('matchesContainer');
  const barra = document.getElementById('matchesToggle');
  if (!cont || !barra) return;

  const { matchday, matches } = partidosDeLaFecha;
  cont.innerHTML = '';
  if (!matches.length) { barra.innerHTML = ''; return; }
  if (disenoPartidos === 'nuevas') cont.appendChild(rnBarraOpciones());

  const porAbrir = [];
  matches.forEach(match => {
    const clave = partidoClave(matchday, match);
    const section = document.createElement('div');
    section.className = 'match-section match-acordeon';
    const estado = (match.post_match || match.period === 'FullTime') ? 'Finalizado' :
      ((!match.period || match.period === 'PreMatch') ? 'Próximo' : 'En juego');
    section.innerHTML =
      '<button type="button" class="match-head"><span class="match-flecha">▸</span>' +
        `<h3>${gnEscape(match.home_team.name)} ${match.home_score ?? '-'} - ${match.away_score ?? '-'} ${gnEscape(match.away_team.name)}</h3>` +
        `<span class="match-estado">${estado}</span></button>` +
      '<div class="cards-row" style="display:none"></div>';
    section.querySelector('.match-head').addEventListener('click', () => {
      if (section.classList.contains('is-abierto')) { partidosAbiertos.delete(clave); cerrarPartido(section); }
      else { partidosAbiertos.add(clave); abrirPartido(section, match, matchday); }
    });
    cont.appendChild(section);
    if (partidosAbiertos.has(clave)) porAbrir.push([section, match]);
  });
  pintarBarraPartidos();
  // De a uno: cada partido nuevo son varias consultas y una docena de placas.
  for (const [section, match] of porAbrir) { if (!section.isConnected) return; await abrirPartido(section, match, matchday); }
}

async function loadFecha(matchday) {
  fechaActual = matchday;
  pintarNavFecha();
  document.getElementById('selectorView').style.display = 'none';
  document.getElementById('cardsView').style.display = 'block';
  document.getElementById('fechaTitle').textContent =
    (currentComp === 384 ? 'Apertura' : 'Clausura') + ' 2026 - Fecha ' + matchday;
  document.getElementById('matchesContainer').innerHTML = '';
  document.getElementById('matchesToggle').innerHTML = '';
  document.getElementById('especialesContainer').innerHTML = '';
  document.getElementById('fotosContainer').innerHTML = '';
  document.getElementById('ganadoresConfig').innerHTML = '';
  document.getElementById('ganadoresContainer').innerHTML = '';
  document.getElementById('postersContainer').innerHTML = '';
  document.getElementById('mvpContainer').innerHTML = '';
  document.getElementById('goleadoresContainer').innerHTML = '';
  document.getElementById('destacadoContainer').innerHTML = '';
  document.getElementById('fixturesContainer').innerHTML = '';
  document.getElementById('loadingSpinner').style.display = 'block';

  // Winners and MVPs ride on their own queries; let them stream in beside the
  // match recap instead of serialising behind it.
  loadGanadores(matchday);
  autoPanelRender();
  loadMvpCards(matchday);
  loadGoleadores(matchday);
  loadDestacado(matchday);

  const { data, error } = await db.rpc('get_matchday_recap', {
    p_competition_id: currentComp,
    p_season_id: currentSeason,
    p_matchday: matchday,
  });

  document.getElementById('loadingSpinner').style.display = 'none';

  if (error) {
    document.getElementById('matchesContainer').innerHTML =
      '<div class="spinner">Error: ' + error.message + '</div>';
    return;
  }

  corregirSuperSuplentes(matchday, data);

  // Qué jugadores tienen recorte. Va antes de dibujar cualquier tarjeta: los
  // dos pósters y las 22 fichas individuales consultan este resultado.
  await fotoPreload(data);

  // Full-pitch posters (Figma 356:4068 / 356:3821). These carry the same XIs as
  // the individual player-card sections below, laid out on the field.
  renderPitchPosters(matchday, data);   // async: espera el motor de posiciones
  renderFotosPendientes(data);
  renderFixturesCard(matchday, data);

  // Los partidos se guardan para poder redibujarlos si se cambia de diseño.
  partidosDeLaFecha = { matchday, matches: data.matches || [] };
  pintarEspeciales(matchday);
  pintarPartidos();
}

/* get_matchday_recap arma el once del ganador con is_starter = true y no mira
   la suplencia automática (súper suplente): lista al titular que salió aunque
   el total ya cuenta al suplente que entró. La clave pública no puede leer
   locked_lineup_players.auto_sub, así que la corrección va a mano, por fecha.
   Se apaga sola cuando arreglen la función: si el que salió ya no viene en la
   lista, o el que entró ya está, no toca nada. */
const SUPER_SUPLENTES_GANADOR = {
  '724-2026-9': [{
    sale: 522203,   // Alex Luna (INS), 7.9
    entra: {
      player_id: 490357, player_name: 'Matías Fernández', team_id: 8627,
      team_short_name: 'IRM', jersey_number: 10, display_position: 'VOL',
      total_points: 9.7, is_captain: false, bidon_id: null, bidon_name: null,
      team: { primary_color: '223A6B', secondary_color: 'FFFFFF',
              jersey_number_color: '#FFFFFF', jersey_stroke_color: null },
      events: { goals: 0, assists: 1, own_goals: 0, red_cards: 0, clean_sheet: false,
                yellow_cards: 0, penalty_goals: 0, penalty_saves: 0 },
    },
  }],
};

function corregirSuperSuplentes(matchday, data) {
  const cambios = SUPER_SUPLENTES_GANADOR[currentComp + '-' + currentSeason + '-' + matchday];
  const jugadores = data && data.winner_team && data.winner_team.players;
  if (!cambios || !jugadores) return;
  cambios.forEach(c => {
    const i = jugadores.findIndex(p => p.player_id === c.sale);
    if (i < 0 || jugadores.some(p => p.player_id === c.entra.player_id)) return;
    jugadores[i] = c.entra;
  });
}
