# Sube a YouTube un video ya armado (el mismo de reels/<carpeta>/ en el S3 del sitio):
# Actions → "Publicar en YouTube" → Run workflow → carpeta.
# Vertical y de hasta 3 minutos, YouTube lo toma como Short.
# El título sale de titulo.txt o de la primera línea de caption.txt.
# El canal se conecta desde la compu con tools/youtube-conectar.js.
name: Publicar en YouTube

on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: 'Carpeta dentro de reels/ en el sitio (ej: censo-01-santiago)'
        required: true
      visibilidad:
        description: 'privado · oculto: solo con el link · publico'
        required: true
        type: choice
        options: [privado, oculto, publico]
        default: privado
      probar:
        description: 'Solo probar: revisa video, título y descripción, no sube nada'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: sa-east-1
  BUCKET: s3://winning-com-ar/iloveneuquen

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # La carpeta va por variable de ambiente, no pegada en el comando.
      - name: Publicar
        run: node tools/publicar-youtube.js "$CARPETA" ${{ inputs.probar && '--probar' || '' }} ${{ inputs.visibilidad == 'publico' && '--publico' || '' }} ${{ inputs.visibilidad == 'oculto' && '--oculto' || '' }}
        env:
          CARPETA: ${{ inputs.carpeta }}
