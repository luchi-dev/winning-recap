# Sube a TikTok en MODO FOTO las placas de carruseles/<carpeta>/ (las mismas de Instagram), con caption.txt.
# borrador: llega a la bandeja de la app de TikTok con el texto cargado y se publica desde ahí.
# directo: se publica solo; en público recién cuando TikTok apruebe la app.
name: Publicar fotos en TikTok

on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: 'Carpeta dentro de carruseles/ en el sitio (la misma de Instagram: NN.jpg + caption.txt)'
        required: true
      modo:
        description: 'borrador: a la bandeja de la app · directo: público (con la app aprobada) · directo-privado: en "Solo yo"'
        required: true
        type: choice
        options: [borrador, directo, directo-privado]
        default: borrador
      probar:
        description: 'Solo probar: revisa fotos y texto, no sube nada'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
  TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
  TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: sa-east-1
  BUCKET: s3://winning-com-ar/iloveneuquen

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # La carpeta va por variable de ambiente, no pegada en el comando.
      - name: Publicar
        run: node tools/publicar-tiktok-foto.js "$CARPETA" ${{ inputs.probar && '--probar' || '' }} ${{ inputs.modo != 'borrador' && '--directo' || '' }} ${{ inputs.modo == 'directo-privado' && '--privado' || '' }}
        env:
          CARPETA: ${{ inputs.carpeta }}
