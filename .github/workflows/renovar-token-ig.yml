# Renueva el token de Instagram antes de que venza (dura 60 días; cada renovación
# suma otros 60). Corre el 1 y el 15 de cada mes: así nunca llega a vencer.
# Si falla (por ejemplo, Meta pide volver a aceptar permisos), GitHub manda un mail
# y queda margen de sobra para generar uno nuevo a mano antes del vencimiento.
#
# Necesita el secreto SECRETS_PAT: un token de GitHub con permiso para escribir
# los secretos de este repo (el GITHUB_TOKEN de Actions no puede).
name: Renovar token de Instagram

on:
  schedule:
    - cron: '0 12 1,15 * *'
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el token renovado y guardarlo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Falta el secreto SECRETS_PAT (ver arriba del archivo)."; exit 1; fi
          r=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN")
          nuevo=$(echo "$r" | jq -r '.access_token // empty')
          if [ -z "$nuevo" ]; then echo "Instagram no renovó el token: $(echo "$r" | jq -c '.error // .')"; exit 1; fi
          echo "::add-mask::$nuevo"
          printf '%s' "$nuevo" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}"
          dias=$(echo "$r" | jq -r '((.expires_in // 0) / 86400) | floor')
          echo "Token de Instagram renovado: vence en $dias días."
