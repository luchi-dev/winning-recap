# Busca solo las fotos del Recap (fotos de partido y caras de Transfermarkt) y
# las publica en winning.com.ar/iloveneuquen. Corre en los servers de GitHub,
# no en la compu de nadie. El que decide qué falta es tools/vigilante.js.
name: Fotos del Recap

on:
  schedule:
    # Horas en UTC (Argentina = UTC-3). El cron de GitHub NO es confiable (el
    # 21-sep-2026 sonó 1 vez de 131): sólo sirve para ARRANCAR la guardia. Una
    # vez arrancada, tools/vigilante.js se queda despierto mientras haya fútbol
    # que mirar y lanza él mismo la siguiente corrida antes de que GitHub corte
    # ésta (6 h). Como el vigilante empieza a vigilar 2 h antes de cada partido,
    # el cron tiene varias chances de acertar aunque saltee muchas.
    - cron: '3,23,43 * * *'
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

# Una guardia a la vez: las corridas nuevas (cron o relevo) esperan a que
# termine la que está, y sólo queda una en cola.
concurrency:
  group: fotos
  cancel-in-progress: false

permissions:
  contents: read
  actions: write        # para que la guardia lance su relevo (gh workflow run)

env:
  BUCKET: s3://winning-com-ar/iloveneuquen
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: sa-east-1

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 358    # el máximo de GitHub es 360; el vigilante pasa la guardia a las 5 h 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Traer lo que ya está publicado
        run: |
          mkdir -p fotos fotos-partido
          aws s3 cp $BUCKET/vigilante.json vigilante.json --only-show-errors || echo "(todavía no hay vigilante.json)"
          aws s3 cp $BUCKET/fotos-partido/elegidas.json fotos-partido/elegidas.json --only-show-errors
          aws s3 sync $BUCKET/fotos/ fotos/ --only-show-errors

      - name: Mirar si falta algo
        id: mirar
        run: node tools/vigilante.js --mirar

      - name: Instalar herramientas
        if: steps.mirar.outputs.trabajo == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: tools

      # Publica solo cada cosa apenas la encuentra (no espera al final) y, si hay
      # un partido por terminar, se queda despierto hasta el pitazo.
      - name: Buscar las fotos (y quedarse de guardia)
        if: steps.mirar.outputs.trabajo == 'true'
        run: node tools/vigilante.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
          GH_TOKEN: ${{ github.token }}

      - name: Publicar lo que haya quedado
        if: always() && steps.mirar.outputs.trabajo == 'true'
        run: |
          node tools/lista-fotos.js
          aws s3 sync fotos/ $BUCKET/fotos/ --cache-control "no-cache" --only-show-errors --exclude "revisar.html"
          aws s3 sync fotos-partido/ $BUCKET/fotos-partido/ --cache-control "no-cache" --only-show-errors --exclude "*" --include "*.jpg" --include "elegidas.json" --exclude "_*"
          aws s3 cp vigilante.json $BUCKET/vigilante.json --cache-control "no-cache" --only-show-errors
